# The "ask me" questions and answers at the end of the portfolio (built into data/faq.json by
# scripts/build_content.py). They are for someone reading the portfolio before an interview:
# short answers, like a business card, each with links.
# Numbers appear only as {project.metric} placeholders, filled from the evaluation cards and checked
# against them with evidence-check, or as {_count} build counts. A sentence holds card numbers or
# build counts, not both. Any other digit has to be listed below.
# Personal details follow the line the person set: job intent, availability, school and course,
# GitHub. Nothing else about the person goes here.
# Besides the written entries, the build adds one entry per public project (from its card) and one
# per [[direction]] below. Entries in the group "more" are questions an interview would ask: they
# come last, are never chips, and no other entry points to them.

allowed_literals = ["claude-haiku-5-5", "claude-sonnet-5-5", "llia0031-dotcom", "2028", "3 个月", "3 months", "F1", "BM25"]

fallback = { zh = "这个我没写在作品集里。", en = "That isn't in this portfolio." }

[[group]]
id = "me"
label = { zh = "关于我", en = "About me" }

[[group]]
id = "projects"
label = { zh = "关于项目", en = "About the projects" }

[[group]]
id = "direction"
label = { zh = "按方向找项目", en = "Projects by area" }

[[group]]
id = "project"
label = { zh = "每个项目", en = "Each project" }

[[group]]
id = "more"
label = { zh = "更多", en = "More" }

