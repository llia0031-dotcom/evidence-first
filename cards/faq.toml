[[item]]
id = "iterate-adopt"
group = "more"
order = 100
q = { zh = "怎么决定一个改动采用不采用？", en = "How do you decide whether to adopt a change?" }
aliases = { zh = ["迭代", "对照实验", "采用标准", "回滚", "灰度", "怎么改版"], en = ["iteration", "a/b test", "experiment", "adoption rule", "rollback", "canary"] }
a = { zh = "每次只改一处，跑之前写下预测和采用规则，在同一套冻结的题上和上一版并排比；区间整个在零以上才算提升。例如标注 Agent 的第二版：点评上 {labelling-agent-kit.lak_h6_asap} {labelling-agent-kit.lak_h6_asap:ci}，采用；广告上 {labelling-agent-kit.lak_h6_ad} {labelling-agent-kit.lak_h6_ad:ci}，区间碰到零，不采用。", en = "One change at a time, with predictions and an adoption rule written before the run, compared with the previous version on the same frozen items; a gain counts only when the whole interval is above zero. For example, the labelling agent's second version: on reviews {labelling-agent-kit.lak_h6_asap} {labelling-agent-kit.lak_h6_asap:ci}, adopted; on ads {labelling-agent-kit.lak_h6_ad} {labelling-agent-kit.lak_h6_ad:ci}, the interval reaches zero, not adopted." }
