# The "ask me" questions and answers at the end of the portfolio (built into data/faq.json by
# scripts/build_content.py). They are for someone reading the portfolio before an interview.
# Voice: first person, as if said face to face, one to three short sentences. Say what the work does
# and what it achieved. No defensive lines (no "this is real", "it's all checkable", "kept anyway"),
# nothing that hands the choice back to the reader, no shortcomings volunteered, and no numbers that
# box the person in (project counts, months, days a week, graduation year, money spent).
# Evaluation results are achievements and may appear, as {project.metric} placeholders filled from
# the cards and checked against them with evidence-check. Any other digit has to be listed below.
# Personal details follow the line the person set: job intent, availability, school and course,
# GitHub. Nothing else about the person goes here.
# Besides the written entries, the build adds one entry per public project ([project_line] plus the
# card's result line, or [project_result] where given) and one per [[direction]] below. Entries in
# the group "more" come last, are never chips, and no other entry points to them.

allowed_literals = ["claude-haiku-5-5", "llia0031-dotcom", "F1"]

fallback = { zh = "这个留到当面聊。先看看这几个：", en = "Let's save that one for when we talk. Meanwhile, have a look at these:" }

