status = "public"
links = [
  { label = { zh = "代码和报告", en = "Code and report" }, url = "https://github.com/Jason-d-e/voice-agent-eval" },
]
card_version = "1.2"
updated = "2026-11-15"
period = "2026-11-13 – 2026-11-15"
team = "Liang Liyuan"
stack = { zh = "Python、SenseVoice、本机 MCP 工具、FireRedChat pVAD、Claude Haiku 5.5", en = "Python, SenseVoice, local MCP tools, FireRedChat pVAD, Claude Haiku 5.5" }
did = { zh = "我写了 42 段带停顿、插话、附和和噪声的对话、事先定好答案，搭了一条本机串联的语音 Agent 做基线；然后一项一项试改进，每项先写补充预注册再跑，最后把有效的合在一起。", en = "I wrote 42 conversations with pauses, barge-ins, backchannels and noise, answers fixed in advance, and built a local cascaded voice agent as the baseline; then tried fixes one at a time, each with its own preregistration addendum, and combined the ones that worked." }
name = { zh = "实时语音 Agent 体验评测", en = "Real-time voice agent evaluation" }
problem = { zh = "语音助手在用户停顿、插话、说“嗯”、背景有人说话时还能不能把事办对，体验用时延、打断、误停的数字来衡量", en = "Whether a voice assistant still gets the task right when the user pauses, interrupts, says \"mm\" or talks over background speech, with experience measured as latency, barge-in and false-stop numbers" }
primary_metric = { zh = "严格通过率（事办对且交互对）；开口时延中位数；插话停下率；附和后继续说的比例", en = "Strict pass (task and interaction right); median time to first audio; barge-ins stopped; backchannels talked through" }
headline = [
  { zh = "严格通过：基线（开思考）{base_strict}，四项改进合在一起 {combo_strict}；纯文字对照 {text_strict}", en = "Strict pass: baseline (thinking on) {base_strict}, four fixes combined {combo_strict}; text-only control {text_strict}" },
  { zh = "背景人声时开口：{babble_base} → {babble_pvad}（只听主说话人）", en = "First audio over background speech: {babble_base} → {babble_pvad} (primary-speaker VAD)" },
  { zh = "真插话停下 {combo_stopped}，停下时延 {combo_stop_latency}", en = "Real barge-ins stopped {combo_stopped}, in {combo_stop_latency}" },
]
summary = { zh = "测一条串联的实时语音 Agent（静音检测 → 语音识别 → 带工具的模型 → 语音合成）在 42 段写好的中英对话里的表现：停顿、插话、附和词、噪声、工具调用。每段对话的答案在写题时定好，跑前冻结题目、音频和打分脚本。先测三种基线设置和纯文字对照，再在同一套题上一项一项试改进：附和不算打断、先暂停再确认、第一段语音切短、删除前先确认、只听主说话人，最后把有效的合在一起。", en = "Measures a cascaded real-time voice agent (voice activity detection → speech recognition → a model with tools → speech synthesis) on 42 scripted Chinese and English conversations covering pauses, interruptions, backchannels, noise and tool calls. Answers were fixed when the items were written; items, audio and scorer were frozen before the run. Three baseline settings and a text-only control come first; fixes are then tried one at a time on the same items (backchannels are not barge-ins, pause before cancelling, a shorter first speech chunk, confirm before deleting, listen only to the primary speaker), and the useful ones are combined." }
core_link = { zh = "借用 evidence-check 的预注册做法；离线另查了“说出口的确认和工具结果对不对得上”。", en = "Follows evidence-check's preregistration practice; an offline check also compares spoken confirmations with tool results." }
models = { zh = "claude-haiku-5-5（effort low，普通流式接口：调用都在实时回路里，不适用批量接口）；语音识别 SenseVoice；只听主说话人用 FireRedChat pVAD。", en = "claude-haiku-5-5 (effort low, standard streaming API: every call is in the real-time loop, so batch does not apply); SenseVoice for recognition; FireRedChat pVAD for primary-speaker detection." }

judge = { zh = [
  "没有用评分器：打分是冻结的规则脚本，脚本带 6 条答案已知的自检对话，每次运行先过自检。",
  "推理有没有被说出口，用固定的规则匹配。",
], en = [
  "No grader is used: scoring is a frozen rule-based script that ships six known-answer traces and must pass them first.",
  "Reasoning said aloud is detected with a fixed pattern.",
] }

iteration = { zh = ["附和不算打断、声音至少 0.5 秒才算插话、先暂停再确认是不是真插话：一项一项试下来，“嗯”“好的”“Okay”不再让它停下或只停一下就接着说，“嗯嗯”仍会打断。", "只听主说话人（pVAD）：背景人声时开口 {babble_base} → {babble_pvad}，三项改进里效果最大。", "四项合在一起：严格通过 {combo_strict}，真插话仍然 {combo_stopped} 停下。"], en = ["Backchannels not counted as barge-ins, a 0.5 s minimum before a barge-in counts, pause before cancelling: tried one at a time, \"mm\", \"okay\" and \"好的\" no longer stop it or only pause it briefly, though \"mm-mm\" still interrupts.", "Primary-speaker VAD: first audio over background speech {babble_base} → {babble_pvad}, the largest effect of the three fixes.", "All four together: strict pass {combo_strict}, real barge-ins still stopped {combo_stopped}."] }

conclusion = { zh = "四项改进合在一起是测过最好的设置；剩下的附和问题光看识别出的文字分不出来，得看声音本身。", en = "The four fixes together are the best setting tested; the remaining backchannel problem cannot be solved from transcribed text and needs the audio itself." }

short_name = { zh = "语音评测", en = "Voice agent eval" }
card_title = { zh = "语音助手被打断、听到“嗯”时，还能办对事吗", en = "Can a voice agent stay right when interrupted?" }
assumed = { zh = "以为固定识别语言，就能把“嗯”和真插话分开", en = "Expected a fixed recognition language to tell \"mm\" from a barge-in" }
showed = { zh = "“嗯”照样被认成别的字，光看文字分不出附和，得看声音本身", en = "\"Mm\" was still heard as other words; text alone cannot tell, the audio must" }
result_line = { zh = "背景有人说话时，助手从等 {babble_base}才开口，缩短到 {babble_pvad}", en = "With someone talking in the background, the assistant's wait before replying fell from {babble_base} to {babble_pvad}" }
key_numbers = [{ metric = "babble_pvad", label = { zh = "背景有人说话时，开口要等（原来 {babble_base}）", en = "Wait before replying over background talk (was {babble_base})" } }, { metric = "combo_stop_latency", label = { zh = "用户插话后，助手多快停下来", en = "How fast it stops when the user cuts in" } }, { metric = "combo_stopped", label = { zh = "用户真的插话时，助手每次都停下", en = "Stopped every time the user really cut in" } }]
timeline = [
  { date = "2026-11-13", label = { zh = "附和不算打断", en = "Backchannel rule" }, text = { zh = "要听出两个不是附和词的字才停", en = "Stop only on two non-backchannel words" }, before = "base_kept", after = "words_kept", adopted = false },
  { date = "2026-11-13", label = { zh = "固定识别语言", en = "Fixed language" }, text = { zh = "没帮上忙，“嗯”照样停", en = "Did not help; \"mm\" still stopped it" }, before = "words_kept", after = "lang_kept", adopted = false },
  { date = "2026-11-14", label = { zh = "先暂停再确认", en = "Pause, then confirm" }, text = { zh = "真插话照样快停，附和后接着说", en = "Fast stops kept; resumes after \"mm\"" }, adopted = true },
  { date = "2026-11-14", label = { zh = "删除前先确认", en = "Confirm before delete" }, text = { zh = "只给不能撤销的操作加确认", en = "Confirm only irreversible actions" }, adopted = true },
  { date = "2026-11-14", label = { zh = "只听主说话人", en = "Primary speaker only" }, text = { zh = "背景有人说话也能及时开口", en = "Answers on time over background speech" }, before = "babble_base", after = "babble_pvad", adopted = true },
  { date = "2026-11-14", label = { zh = "四项合在一起", en = "Fixes combined" }, text = { zh = "测过最好的设置", en = "Best setting tested" }, after = "combo_strict", adopted = true },
]

[uses]
zh = [
  "比较实时语音 Agent 的设置：哪一种在停顿、插话、附和、噪声下更稳，代价是多少时延。",
  "改一个设置之前，先在同一套题上回放，看有没有把原来对的改坏。",
]
en = [
  "Compare settings of a real-time voice agent: which holds up under pauses, barge-ins, backchannels and noise, and at what latency cost.",
  "Replay the same items before changing a setting, to see whether anything that worked breaks.",
]

[out_of_scope]
zh = [
  "不是端到端语音模型的评测：没有和端到端实时语音模型对比。",
  "不代表真人用户：用户语音是合成的，时间是模拟的，回声消除按理想情况处理。",
]
en = [
  "Not an evaluation of end-to-end speech models; none was compared.",
  "Does not represent real users: user speech is synthesised, time is simulated and echo cancellation is assumed perfect.",
]


[[eval]]
id = "base"
name = { zh = "主评测：三种基线设置和纯文字对照（42 段对话）", en = "Main run: three baseline settings and a text-only control (42 conversations)" }
date = "2026-11-13"
data = { zh = "42 段对话：任务、停顿、插话、附和、粉红噪声、背景人声。答案写题时定好；题目、音频清单、打分脚本跑前冻结。", en = "42 conversations: tasks, pauses, barge-ins, backchannels, pink noise and background speech. Answers fixed at writing; items, audio manifest and scorer frozen before the run." }
items = { zh = "42 段对话，每种设置 2 遍，共 {base_strict:n} 段", en = "42 conversations, 2 runs per setting, {base_strict:n} in all" }
runs = { zh = "每种设置 2 遍，合并计算；同一题两遍不独立，区间偏窄", en = "2 runs per setting, pooled; the runs are not independent, so intervals are too narrow" }
setup = { zh = "claude-haiku-5-5，普通流式接口", en = "claude-haiku-5-5, standard streaming API" }
frozen = { zh = "`eval/PREREGISTRATION.md`（计划、预期、文件哈希）", en = "`eval/PREREGISTRATION.md` (plan, expectations, file hashes)" }

  [[eval.metric]]
  id = "text_strict"
  label = { zh = "纯文字对照：严格通过", en = "Text-only control: strict pass" }
  extractor = "vo_strict"
  args = { arm = "oracle" }
  direction = "none"

  [[eval.metric]]
  id = "vad_strict"
  label = { zh = "静音检测基线（关思考）：严格通过", en = "VAD baseline, thinking off: strict pass" }
  extractor = "vo_strict"
  args = { arm = "vad" }

  [[eval.metric]]
  id = "base_strict"
  label = { zh = "静音检测基线（开思考）：严格通过", en = "VAD baseline, thinking on: strict pass" }
  extractor = "vo_strict"
  args = { arm = "vad-think" }

  [[eval.metric]]
  id = "vad_fa"
  label = { zh = "关思考：说完到开口", en = "Thinking off: end of speech to first audio" }
  extractor = "vo_first_audio"
  args = { arm = "vad" }
  direction = "lower"
  note = { zh = "干净的任务题", en = "clean task items" }

  [[eval.metric]]
  id = "base_fa"
  label = { zh = "开思考：说完到开口", en = "Thinking on: end of speech to first audio" }
  extractor = "vo_first_audio"
  args = { arm = "vad-think" }
  direction = "lower"
  note = { zh = "干净的任务题", en = "clean task items" }

  [[eval.metric]]
  id = "base_stopped"
  label = { zh = "开思考：真插话时停下", en = "Thinking on: stopped on a real barge-in" }
  extractor = "vo_interaction"
  args = { arm = "vad-think", cat = "interrupt", field = "stopped" }

  [[eval.metric]]
  id = "base_kept"
  label = { zh = "开思考：用户只说“嗯”“好的”时继续说", en = "Thinking on: kept talking through a backchannel" }
  extractor = "vo_interaction"
  args = { arm = "vad-think", cat = "backchannel", field = "kept_talking" }

  [[eval.metric]]
  id = "vad_leak"
  label = { zh = "关思考时把推理说出口", en = "Reasoning said aloud with thinking off" }
  extractor = "vo_leaks"
  args = { arm = "vad" }
  direction = "lower"

  [[eval.metric]]
  id = "babble_base"
  decimals = 1
  label = { zh = "开思考：背景人声题说完到开口", en = "Thinking on: first audio over background speech" }
  extractor = "vo_first_audio"
  args = { arm = "vad-think", cat = "noise", noise = "babble" }
  direction = "lower"

[[eval]]
id = "fixes"
name = { zh = "逐项改进（同一套 42 段对话）", en = "Fixes one at a time (same 42 conversations)" }
date = "2026-11-14"
data = { zh = "题目、音频和打分脚本不变；每项改进跑前写一份补充预注册（改了什么、预期、文件哈希）。下表只列被采用的两项和合在一起的设置，其余各项的结果在项目报告第 6 节。", en = "Items, audio and scorer unchanged; each fix has its own preregistration addendum (change, expectation, file hashes). Only two adopted fixes and the combined setting are listed here; the rest are in section 6 of the project report." }
items = { zh = "42 段对话，每种设置 2 遍", en = "42 conversations, 2 runs per setting" }
runs = { zh = "每种设置 2 遍，合并计算", en = "2 runs per setting, pooled" }
setup = { zh = "claude-haiku-5-5，普通流式接口", en = "claude-haiku-5-5, standard streaming API" }
frozen = { zh = "`eval/PREREGISTRATION.md` 的补充一到补充十一", en = "`eval/PREREGISTRATION.md`, addenda 1–11" }
takeaway = { zh = "四项合在一起是测过最好的设置；剩下的附和问题光看识别出的文字分不出来，得看声音本身。", en = "The four fixes together are the best setting tested; the remaining backchannel problem cannot be solved from transcribed text alone and needs the audio itself." }

  [[eval.metric]]
  id = "pvad_strict"
  label = { zh = "只听主说话人：严格通过", en = "Primary-speaker VAD: strict pass" }
  extractor = "vo_strict"
  args = { arm = "vad-think-pvad" }

  [[eval.metric]]
  id = "babble_pvad"
  label = { zh = "只听主说话人：背景人声题说完到开口", en = "Primary-speaker VAD: first audio over background speech" }
  extractor = "vo_first_audio"
  args = { arm = "vad-think-pvad", cat = "noise", noise = "babble" }
  direction = "lower"

  [[eval.metric]]
  id = "pause_strict"
  label = { zh = "先暂停、确认是真插话再取消：严格通过", en = "Pause, cancel only on a real barge-in: strict pass" }
  extractor = "vo_strict"
  args = { arm = "vad-think-pause" }
  note = { zh = "按原规则暂停也算停下，所以附和题仍记为没通过", en = "under the original rule a pause counts as a stop, so backchannel items still fail" }

  [[eval.metric]]
  id = "combo_strict"
  label = { zh = "四项合在一起：严格通过", en = "Four fixes combined: strict pass" }
  extractor = "vo_strict"
  args = { arm = "vad-think-combo" }

  [[eval.metric]]
  id = "combo_fa"
  label = { zh = "四项合在一起：说完到开口", en = "Four fixes combined: first audio" }
  extractor = "vo_first_audio"
  args = { arm = "vad-think-combo" }
  direction = "lower"
  note = { zh = "干净的任务题", en = "clean task items" }

  [[eval.metric]]
  id = "combo_stopped"
  label = { zh = "四项合在一起：真插话时停下", en = "Four fixes combined: stopped on a real barge-in" }
  extractor = "vo_interaction"
  args = { arm = "vad-think-combo", cat = "interrupt", field = "stopped" }

  [[eval.metric]]
  id = "combo_stop_latency"
  label = { zh = "四项合在一起：插话到停下", en = "Four fixes combined: barge-in to stop" }
  extractor = "vo_stop_latency"
  args = { arm = "vad-think-combo" }
  direction = "lower"


  [[eval.metric]]
  id = "words_kept"
  label = { zh = "附和不算打断：用户只说“嗯”“好的”时继续说", en = "Backchannel rule: kept talking through a backchannel" }
  extractor = "vo_interaction"
  args = { arm = "vad-think-words", cat = "backchannel", field = "kept_talking" }

  [[eval.metric]]
  id = "lang_kept"
  label = { zh = "再固定识别语言：用户只说“嗯”“好的”时继续说", en = "Plus fixed language: kept talking through a backchannel" }
  extractor = "vo_interaction"
  args = { arm = "vad-think-words-lang", cat = "backchannel", field = "kept_talking" }

[[limitation]]
text = { zh = "用户语音是合成的，时间是模拟的；42 段对话每种设置只跑两遍，相差一两段属于噪声。", en = "User speech is synthesised and time is simulated; with 42 conversations and two runs per setting, a difference of one or two is noise." }
advice = { zh = "上线前用真人录音（例如公开的对话语音数据）重跑，并在真实网络下测时延。", en = "Before launch, rerun with recorded human speech (for example a public dialogue speech set) and measure latency on a real network." }

[[limitation]]
text = { zh = "“嗯嗯”这类附和仍会打断：识别器把它听成别的字，光看识别出的文字分不出附和和短插话。", en = "Backchannels such as \"mm-mm\" still interrupt: the recogniser hears other words, and text alone cannot tell a backchannel from a short barge-in." }
advice = { zh = "用看声音本身的附和检测；现成的声学附和模型离线试过，没达到事先定的标准，所以没接进来。", en = "Use detection on the audio itself; an off-the-shelf acoustic backchannel model was tried offline and missed the preset bar, so it was not added." }

[[limitation]]
text = { zh = "没有和端到端实时语音模型比较。", en = "No end-to-end real-time speech model was compared." }
advice = { zh = "接上一个有免费额度的端到端模型，用同一套题和同一个打分脚本比较。", en = "Add an end-to-end model with a free tier and compare it on the same items and scorer." }

