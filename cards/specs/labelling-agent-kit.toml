  "标注质量出问题时：按根因表分清是规则、提示词还是标准标签本身的问题，改版后先在没用过的样本上验证再上线。",
]
en = [
  "Taking on a new labelling task: write the rules and cases folder, pick an arm with the same experiments, and find weak labels with slices and confusion.",
  "When labelling quality slips: use the root-cause table to tell rules, prompts and the gold labels apart, and check a revision on unseen items before it ships.",
]

[out_of_scope]
zh = [
  "不证明这套流程在别的模型、别的任务上同样有效；换任务要重新跑对照。",
  "不替数据集改标准标签：可两读或漏标的标签照实报告，交给定标准的一方。",
]
en = [
  "Does not show the flow works as well with other models or tasks; a new task needs its own comparison.",
  "Does not rewrite a dataset's gold labels: labels that read either way or were left out are reported to whoever sets the standard.",
]

[[eval]]
id = "dev"
name = { zh = "开发集第一轮：Agent 第一步用不用工具", en = "Development round one: does the agent's first turn use a tool?" }
date = "2026-11-18"
data = { zh = "开发集上记下每种做法第一步有没有调用工具；结果用来改流程，测试集冻结前完成。", en = "On the dev sets, whether each arm's first turn called a tool; the result changed the flow before the test sets were frozen." }
items = { zh = "点评开发集 40 条", en = "40 dev reviews" }
runs = { zh = "每条每种做法 1 遍", en = "1 run per item and arm" }
setup = { zh = "claude-haiku-5-5，effort low，批量接口", en = "claude-haiku-5-5, effort low, Message Batches API" }
takeaway = { zh = "只给检索案例的工具，Agent 第一步一次也不用；检索改成流程里固定的一步，Agent 和加案例的做法之间只差案例本身。", en = "Offered the case tools alone, the agent never used them in its first turn; retrieval became a fixed step, so the agent and the case arm differ only in the cases." }

  [[eval.metric]]
  id = "lak_dev1_agent_tool"
  label = { zh = "只给规则工具：第一步调用了工具", en = "Rule tools only: first turn called a tool" }
  extractor = "md_match_of"
  args = { path = "labelling-agent-kit-public/results/dev1/FIRST_TURN.md", match = { "Task" = "asap", "Arm" = "agent" }, col = "First turn called a tool" }
  direction = "none"

  [[eval.metric]]
  id = "lak_dev1_cases_tool"
  label = { zh = "再给检索案例的工具：第一步调用了工具", en = "With case tools added: first turn called a tool" }
  extractor = "md_match_of"
  args = { path = "labelling-agent-kit-public/results/dev1/FIRST_TURN.md", match = { "Task" = "asap", "Arm" = "agent-cases" }, col = "First turn called a tool" }
  direction = "none"

