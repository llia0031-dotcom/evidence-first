did = { zh = "我做了一个通用的内容标注 Agent：换一个放规则和案例的文件夹就能接新任务。用两个任务、五种做法做预注册的 A/B 对照，算每个标签的精确率和召回率、混淆和切片；把最好的做法的失败样本归到五类根因，按根因改出第二版，再在没用过的测试集上检验。常用的分析做成了五个 Agent Skill。", en = "I built one content-labelling agent that takes on a new task through a folder of rules and cases. Two tasks and five arms go through preregistered A/B comparisons, with per-label precision and recall, confusion and slices; the best arm's failures are sorted into five root causes, a second version is built from them and checked on a test set nothing was tuned on. The common analyses are packaged as five Agent Skills." }
name = { zh = "标注 Agent 工具箱", en = "Labelling Agent Kit" }
problem = { zh = "标注 Agent 怎么设计标得最好，错在哪些标签、哪类样本上，为什么错，改了以后在新样本上还成不成立", en = "How should a labelling agent be built to label best, where and why does it fail, and does a fix still hold on new items?" }
primary_metric = { zh = "微平均 F1（附区间）；每个标签的精确率和召回率；漏判和误判", en = "Micro F1 with intervals; per-label precision and recall; misses and false alarms" }
headline = [
  { zh = "测试集 A 微平均 F1，短提示词 → 完整 Agent：广告 {lak_ad_short} → {lak_ad_full}，点评 {lak_asap_short} → {lak_asap_full}", en = "Test A micro F1, short prompt → full agent: ads {lak_ad_short} → {lak_ad_full}, reviews {lak_asap_short} → {lak_asap_full}" },
  { zh = "形似违规其实合规的广告：短提示词打了标签 {lak_lookalike_short}，完整 Agent {lak_lookalike_full}", en = "Look-alike ads that are compliant: the short prompt labelled {lak_lookalike_short}, the full agent {lak_lookalike_full}" },
  { zh = "按根因改的第二版，在没用过的测试集 B 上：点评 {lak_h6_asap} {lak_h6_asap:ci}，采用；广告 {lak_h6_ad} {lak_h6_ad:ci}，区间碰到 0，不采用", en = "The revision built from root causes, on unseen test B: reviews {lak_h6_asap} {lak_h6_asap:ci}, adopted; ads {lak_h6_ad} {lak_h6_ad:ci}, the interval reaches 0, not adopted" },
]
summary = { zh = "一个换一套规则和案例就能接新任务的内容标注 Agent，配一整套用证据调它的工具：预注册的 A/B 对照、每个标签的精确率和召回率（带区间）、混淆和切片、失败样本根因表，以及按根因改版后在没用过的样本上验证。流程是：先检索相似案例，再用规则和案例工具标注，代码负责规则门（没读规则就给的标签，补发规则）、原话修正和自查。两个任务：中英文广告政策标签（每种语言 7 类，答案在写广告时定好），和公开数据集 ASAP 的餐厅点评 18 个方面（标签是数据集自带的）。五种做法从短提示词到“查规则 + 检索案例 + 自查”逐步加，点评另比较真实、合成和一半一半三种案例库。方案、假设和冻结文件跑前写好；最好的做法的失败样本，每个错误判断独立归因两次；按根因改出第二版，冻结后才在测试集 B 上跑。", en = "A content-labelling agent that plugs into any labelling task through a folder of rules and cases, and the kit to tune it with evidence: preregistered A/B experiments, per-label precision and recall with intervals, confusion and slices, a root-cause table of failures, and a revision checked on items it never saw. The flow: retrieve similar cases, label with rule and case tools, and let code run a rule gate (labels given without reading their rule get the rule sent), quote repair and a self-check. Two tasks: ad-policy labels in Chinese and English (7 per language, answers fixed when each ad was written) and 18 aspects of restaurant reviews from the public ASAP dataset (the dataset's own labels). Five arms add one piece at a time, from a short prompt to rules plus retrieved cases plus a self-check; on reviews, real, synthetic and half-and-half case libraries are also compared. Plan, hypotheses and frozen files were written before the runs; each wrong decision of the best arm was classified twice, independently; the revision built from the causes was frozen before it ran on test B." }
core_link = { zh = "广告任务的题目和规则来自有据审核和审核模型实验公开的数据；有据标注流水线负责把 Agent 跑成每天的流程，这个工具箱负责把它调准。", en = "The ad items and rulebook come from the public data of Grounded Review and Policy Model Lab; the Grounded Labelling Pipeline runs the agent as a daily workflow, and this kit tunes it." }
models = { zh = "claude-haiku-5-5（effort low，批量接口），每条样本每种做法跑一次。", en = "claude-haiku-5-5 (effort low, Message Batches API), one run per item and arm." }
iteration = { zh = ["开发集第一轮：只把检索案例的工具交给 Agent 时，它在 40 条点评上第一步一次也没调用（{lak_dev1_cases_tool}），只给规则工具时 {lak_dev1_agent_tool}；检索改成流程里固定的一步。", "测试集 A：查规则是最大的一步（广告 {lak_h1_ad}，点评 {lak_h1_asap}）；检索相似案例两个任务都有用；自查只在点评上测出提升，每千条点评的费用从 {lak_cost_asap_cases}升到 {lak_cost_asap_full}。", "整本规则放进提示词，广告上已到 {lak_ad_rules}；Agent 比它高的那部分只在点评上测出来。", "根因：点评上 {lak_rca_decisions} 个错误判断，最多的是标签歧义（{lak_rca_ambiguity}）；能改的是提示词缺陷、规则冲突和模型能力。", "第二版只改根因表指出的地方：点评在测试集 B 上测出提升，采用；广告区间碰到 0，不采用。"], en = ["Development round one: with the case tools only offered, the agent's first turn called no tool on 40 reviews ({lak_dev1_cases_tool}), against {lak_dev1_agent_tool} with the rule tools alone; retrieval became a fixed step of the flow.", "Test A: reading the rules is the largest step (ads {lak_h1_ad}, reviews {lak_h1_asap}); retrieved cases help on both tasks; the self-check is a measured gain on reviews only and raises the cost per 1,000 reviews from {lak_cost_asap_cases} to {lak_cost_asap_full}.", "Putting the whole rulebook in the prompt already reaches {lak_ad_rules} on ads; the agent's lead over it is measured only on reviews.", "Root causes: of {lak_rca_decisions} wrong decisions on reviews, label ambiguity is the largest class ({lak_rca_ambiguity}); the fixable classes are prompt defects, rule conflicts and model capability.", "The revision changes only what the root-cause table points to: a measured gain on reviews in test B, adopted; on ads the interval reaches 0, not adopted."] }
conclusion = { zh = "让 Agent 先读规则、再看相似案例，是标注质量最大的来源；自查只在标签多、边界细的任务上值得多花的钱。一个任务能标到多准，先受标准标签本身的限制：点评数据里不少“错误”是可两读或漏标的标签，这部分应该交给定标准的人，而不是继续调提示词。按根因改版要在没用过的样本上再验一次，没测出提升的就不上。", en = "Reading the rules first and then similar cases is where most of the labelling quality comes from; a self-check is worth its cost only on tasks with many fine-grained labels. How well a task can be labelled is bounded first by its gold labels: many \"errors\" on the review data are labels that read either way or were left out, which belongs with whoever sets the standard, not with more prompt tuning. A revision built from root causes needs a check on unseen items, and one with no measured gain does not ship." }
short_name = { zh = "标注 Agent", en = "Labelling agent" }
card_title = { zh = "标注 Agent 怎么调准，错在哪、为什么错", en = "Tuning a labelling agent, and why it fails" }
assumed = { zh = "以为真实案例库比合成案例库更有用，因为真实案例带着数据集的标注习惯", en = "Expected real cases to beat synthetic ones, since they carry the dataset's labelling conventions" }
showed = { zh = "真实对合成没测出差别：{lak_h5a} {lak_h5a:ci}", en = "No measured difference between real and synthetic cases: {lak_h5a} {lak_h5a:ci}" }
