date = "2026-11-18"
data = { zh = "广告：中英文广告文案加画面上的字，每种语言 7 类政策标签，答案在写广告时定好，其中 32 条形似违规其实合规。点评：大众点评的中文餐厅点评，18 个方面，标签是 ASAP 数据集自带的。五种做法：短提示词、整本规则放进提示词、会查规则的 Agent、再加检索相似案例、再加自查。", en = "Ads: caption plus on-screen text in Chinese and English, 7 policy labels per language, answers fixed when each ad was written, 32 of them compliant look-alikes. Reviews: Chinese Dianping restaurant reviews, 18 aspects, the ASAP dataset's own labels. Five arms: short prompt, whole rulebook in the prompt, an agent that reads rules, plus retrieved cases, plus a self-check." }
items = { zh = "广告 119 条；点评 201 条", en = "119 ads; 201 reviews" }
runs = { zh = "每条每种做法 1 遍", en = "1 run per item and arm" }
setup = { zh = "claude-haiku-5-5，effort low，批量接口", en = "claude-haiku-5-5, effort low, Message Batches API" }
frozen = { zh = "`experiments/PREREGISTRATION.md`（14 个冻结文件的指纹）", en = "`experiments/PREREGISTRATION.md` (fingerprints of 14 frozen files)" }
