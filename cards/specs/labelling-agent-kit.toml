data = { zh = "第二版只改根因表指出的地方：点评补上数据集对“只标有评价的方面”的例外（商场位置、优惠、标价）、两个价格标签的分界和自查保留惯例要求的标签；广告把检测得出的效果百分比归到数据类、把“立刻减重”只归到减重类；两个任务都让 Agent 答前过一遍全部标签。冻结后才在测试集 B 上跑。", en = "The revision changes only what the root-cause tables point to: for reviews, the dataset's exceptions to \"judged aspects only\" (mall locations, deals, stated prices), the boundary between the two price labels and a self-check that keeps convention-required labels; for ads, effect percentages from tests as the data label and immediate weight-loss claims as the weight label only; for both, going through the whole label list before answering. It was frozen before it ran on test B." }
items = { zh = "广告 118 条；点评 199 条（测试集 B，之前没用过）", en = "118 ads; 199 reviews (test B, unused before)" }
runs = { zh = "每条每个版本 1 遍；区间按题目自助重抽样", en = "1 run per item and version; item bootstrap intervals" }
setup = { zh = "claude-haiku-5-5，effort low，批量接口", en = "claude-haiku-5-5, effort low, Message Batches API" }
frozen = { zh = "`experiments/REVISION.md`（17 个冻结文件的指纹）", en = "`experiments/REVISION.md` (fingerprints of 17 frozen files)" }
takeaway = { zh = "点评：第二版在没用过的题上测出提升，收益落在改动瞄准的价格、优惠和位置标签上，采用。广告：也高一点，但区间下端是 0，按事先定的规则不算提升，不采用；第一版在测试集 A 上只错了四条，能测的空间本来就小。", en = "Reviews: a measured gain on unseen items, sitting on the price, deal and location labels the changes aimed at; adopted. Ads: slightly higher, but the interval's lower end is 0, so by the rule set beforehand it is not a gain and is not adopted; v1 made only four errors on test A, leaving little to measure." }

