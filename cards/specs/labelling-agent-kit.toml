[[eval]]
id = "rca"
name = { zh = "根因：完整 Agent 在测试集 A 上的错误判断", en = "Root causes: the full agent's wrong decisions on test A" }
date = "2026-11-18"
data = { zh = "最好的做法（两个任务都是完整 Agent）的每个错误标签判断，先由代码算出线索，再独立归类两次，归到五类：提示词缺陷、模型能力、规则冲突、样本分布、标签歧义（数据集的标签可两读或漏标）。两次不一致的单列为“分歧”。", en = "Each wrong label decision of the best arm (the full agent on both tasks) gets code-computed signals and is classified twice, independently, into five causes: prompt defect, model capability, rule conflict, sample distribution and label ambiguity (a gold label that reads either way or was left out). Disagreements are listed as split." }
items = { zh = "点评 165 条里的错误判断；广告 4 条里的错误判断", en = "Wrong decisions on 165 reviews and on 4 ads" }
runs = { zh = "每个错误判断归类 2 次", en = "2 classifications per wrong decision" }
setup = { zh = "claude-haiku-5-5，批量接口", en = "claude-haiku-5-5, Message Batches API" }
frozen = { zh = "`experiments/PREREGISTRATION.md` 第六节", en = "`experiments/PREREGISTRATION.md`, section 6" }
takeaway = { zh = "点评最多的一类是标签歧义，近一半错误判断在所有做法里都错：这部分受标准标签本身限制，照实报告，不去拟合。能改的是规则和流程：提示词没让 Agent 想到的标签、自查删掉了数据集惯例要的标签、通用规则和数据集惯例冲突（价格、优惠、商场位置）。", en = "On reviews the largest class is label ambiguity, and nearly half of the wrong decisions were wrong in every arm: that part is bounded by the gold labels and is reported, not fitted. The fixable part is rules and flow: labels the prompt never led the agent to consider, a self-check that deleted labels the dataset's conventions require, and a general rule that clashes with those conventions (prices, deals, mall locations)." }

