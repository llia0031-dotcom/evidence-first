[[limitation]]
text = { zh = "每种做法每条只跑了一次；模型采样带来的波动不在按题目重抽样的区间里，几处差别离边界很近（点评上查规则对整本规则、一半一半案例库、广告的第二版）。", en = "Each arm labelled each item once; sampling variance is not in the item-bootstrap intervals, and several differences sit close to the edge (rules versus the whole rulebook on reviews, the half-and-half library, the ads revision)." }
advice = { zh = "上线前对离边界近的几组多跑几次，确认结论不变。", en = "Before relying on the close calls, run them several more times and confirm they hold." }

[[limitation]]
text = { zh = "广告的题目和广告规则出自同一组项目（有据审核、审核模型实验），答案在写广告时定好，不是独立标注员定的；完整 Agent 在广告上已接近满分。", en = "The ad items come from the same projects as the ad rulebook (Grounded Review and Policy Model Lab), with answers fixed by construction rather than by independent annotators; the full agent is near the ceiling on ads." }
advice = { zh = "接真实业务前，用业务里已有结论的样本另建测试集。", en = "Before real use, build a test set from business items with settled outcomes." }

[[limitation]]
text = { zh = "点评的标准标签漏掉了一些提及：测试集 A 的 {lak_a10_test_a:n} 条点评里，有 {lak_a10_test_a:k} 条含有在训练集里几乎总伴随某个标签的词，却没有那个标签；根因里还有 {lak_rca_ambiguity} 个判断归为标签歧义。点评上的精确率受这个限制，Agent 的一部分“错误”可能是数据集该有的标签。", en = "The review gold labels leave out some mentions: {lak_a10_test_a:k} of the {lak_a10_test_a:n} test A reviews contain a phrase that almost always comes with a label in the training split, yet lack that label; {lak_rca_ambiguity} decisions were classed as label ambiguity. Precision on reviews is bounded by this, and some of the agent's \"errors\" may be labels the dataset arguably should have." }
advice = { zh = "把可两读或漏标的样本整理给定标准的一方，先统一标注口径，再比较做法。", en = "Hand the ambiguous or unlabelled cases to whoever sets the standard, settle the labelling rules first, then compare arms." }

[[limitation]]
text = { zh = "合成点评比真实点评短，而且是照 Agent 读的同一本规则生成的；换一种生成方式，真实对合成的结论可能不同。", en = "The synthetic reviews are shorter than real ones and were generated from the same rulebook the agent reads; a different generator could change the real-versus-synthetic result." }
