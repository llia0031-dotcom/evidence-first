[[eval]]
id = "prompts"
name = { zh = "裁判提示词 v1 到 v4（开发集）", en = "Judge prompts v1 to v4 (development split)" }
date = "2026-11-18"
data = { zh = "开发集上比较四版裁判提示词，按三类判断题的平均平衡准确率选一版，选定后冻结，再在测试集上跑。", en = "Four judge prompts compared on the development split by mean balanced accuracy over the three item families; the chosen one was frozen before the test split ran." }
items = { zh = "开发集", en = "Development split" }
runs = { zh = "每版每题 1 遍", en = "1 run per item per version" }
setup = { zh = "claude-haiku-5-5，effort medium，批量接口", en = "claude-haiku-5-5, effort medium, Message Batches API" }
frozen = { zh = "`eval/PREREGISTRATION.md`", en = "`eval/PREREGISTRATION.md`" }
takeaway = { zh = "v2 最好，采用；v3 和 v2 打平但更贵，v4 更严、把对的也判错了一些，都不采用。", en = "v2 was best and adopted; v3 tied at a higher cost and v4 was stricter, failing some right answers; neither was adopted." }

  [[eval.metric]]
  id = "jc_dev_v1"
  label = { zh = "平均平衡准确率（v1）", en = "Mean balanced accuracy (v1)" }
  extractor = "md_value"
  args = { path = "judge-calibration-public/eval/results/RESULTS.md", section = "1. Prompt versions", row = "v1", col = "Score (mean BA)", decimals = 3 }

  [[eval.metric]]
  id = "jc_dev_v2"
  label = { zh = "平均平衡准确率（v2）", en = "Mean balanced accuracy (v2)" }
  extractor = "md_value"
  args = { path = "judge-calibration-public/eval/results/RESULTS.md", section = "1. Prompt versions", row = "v2", col = "Score (mean BA)", decimals = 3 }

[[eval]]
id = "constructed"
name = { zh = "定好答案的判断题（测试集，三次判断取多数）", en = "Items with fixed answers (test split, majority of three judgments)" }
date = "2026-11-18"
data = { zh = "审核意见、简历判断、修改建议三类判断题，取自有据审核、简历初筛和卖点体检的存档答案，并植入引文、条款、格式、结论等类型的错误；答案在出题时定好。", en = "Review opinions, resume verdicts and revision advice taken from the stored answers of Grounded Review, resume screening and Sellpoint Check, with planted errors in quotes, clauses, format and conclusions; answers fixed when the items were built." }
items = { zh = "711 道", en = "711 items" }
runs = { zh = "每题判三次，取多数", en = "Three judgments per item, majority taken" }
setup = { zh = "claude-haiku-5-5，effort medium，批量接口；提示词 v2", en = "claude-haiku-5-5, effort medium, Message Batches API; prompt v2" }
frozen = { zh = "`eval/PREREGISTRATION.md`", en = "`eval/PREREGISTRATION.md`" }
takeaway = { zh = "答案清楚的判断题上，裁判几乎全对，植入的错误大多抓到。9 处不一致里 2 处是答案要再斟酌；另有 3 处是题目当初少给了商品页，补上后重跑已全部判对（更正 1）。", en = "On items with clear answers the judge is almost always right and catches most planted errors. Of the 9 disagreements, 2 point at answers worth revisiting; 3 more came from items first built without the product listing, and after it was added and the family judged again they were all right (correction 1)." }

  [[eval.metric]]
  id = "jc_constructed"
  label = { zh = "和定好的答案一致", en = "Agreement with the fixed answers" }
  extractor = "md_cell"
  args = { path = "judge-calibration-public/eval/results/RESULTS.md", section = "2. Constructed answers", row = "all", col = "Agreement" }

  [[eval.metric]]
  id = "jc_caught"
  label = { zh = "植入的错误抓到", en = "Planted errors caught" }
  extractor = "md_cell"
  args = { path = "judge-calibration-public/eval/results/RESULTS.md", section = "2. Constructed answers", row = "all", col = "Errors caught" }

  [[eval.metric]]
  id = "jc_kappa"
  label = { zh = "Cohen's kappa", en = "Cohen's kappa" }
  extractor = "json_value"
  args = { path = "judge-calibration-public/eval/results/summary.json", keys = ["binary", "pooled", "kappa", "kappa"], decimals = 3 }

[[eval]]
id = "regulator"
name = { zh = "监管和法院的结论（46 条真实广告）", en = "Regulator and court decisions (46 real ads)" }
date = "2026-11-18"
data = { zh = "英国广告标准局的 30 份裁决和中文的 16 个监管或法院案例；按结论能不能从广告本身看出来分成两组。", en = "30 UK ASA rulings and 16 Chinese regulator or court cases, split by whether the decision can be read from the ad itself." }
items = { zh = "46 条广告", en = "46 ads" }
runs = { zh = "每条判三次，取多数", en = "Three judgments per ad, majority taken" }
setup = { zh = "claude-haiku-5-5，effort medium，批量接口", en = "claude-haiku-5-5, effort medium, Message Batches API" }
frozen = { zh = "`eval/PREREGISTRATION.md`", en = "`eval/PREREGISTRATION.md`" }
takeaway = { zh = "能从广告本身看出结论的，裁判大多判对；要靠外部证据（检测报告、资质、实际效果）才能定的，只对一半左右。", en = "Where the decision shows in the ad itself the judge is mostly right; where it rests on outside evidence (test reports, licences, actual effects) it is right about half the time." }

  [[eval.metric]]
  id = "jc_reg_all"
  label = { zh = "和监管、法院结论一致", en = "Agreement with regulator and court decisions" }
  extractor = "md_cell"
  args = { path = "judge-calibration-public/eval/results/RESULTS.md", section = "3. Regulator", row = "all", col = "Agreement" }

  [[eval.metric]]
  id = "jc_reg_face"
  label = { zh = "从广告本身能看出的", en = "Readable from the ad itself" }
  extractor = "md_cell"
  args = { path = "judge-calibration-public/eval/results/RESULTS.md", section = "3. Regulator", row = "on_the_face", col = "Agreement" }

  [[eval.metric]]
  id = "jc_reg_evidence"
  label = { zh = "要靠外部证据的", en = "Turning on outside evidence" }
  extractor = "md_cell"
  args = { path = "judge-calibration-public/eval/results/RESULTS.md", section = "3. Regulator", row = "evidence_dependent", col = "Agreement" }

[[eval]]
id = "human"
name = { zh = "公开数据集自带的人工评分", en = "Human ratings that ship with public datasets" }
date = "2026-11-18"
data = { zh = "Judge's Verdict（200 道，三位标注员）、SummEval（30 篇新闻各 4 条摘要，四个维度各 120 条，三位专家）、WMT MQM 中译英（240 句）。人工评分都是数据集自带的。", en = "Judge's Verdict (200 items, three annotators), SummEval (30 news articles with 4 summaries each, 120 per dimension, three experts) and WMT MQM Chinese to English (240 segments). All human ratings come with the datasets." }
items = { zh = "Judge's Verdict 200 道；SummEval 每个维度 120 条摘要；WMT MQM 240 句", en = "200 Judge's Verdict items; 120 SummEval summaries per dimension; 240 WMT MQM segments" }
runs = { zh = "每题判三次", en = "Three judgments per item" }
setup = { zh = "claude-haiku-5-5，effort medium，批量接口", en = "claude-haiku-5-5, effort medium, Message Batches API" }
frozen = { zh = "`eval/PREREGISTRATION.md`", en = "`eval/PREREGISTRATION.md`" }
takeaway = { zh = "答对答错这类题，裁判和标注员的一致程度与标注员彼此之间差不多；主观质量（流畅度、连贯性）和翻译错误的严重程度，裁判和人差得多。", en = "On right-or-wrong items the judge agrees with annotators about as well as they agree with one another; on subjective quality (fluency, coherence) and translation error severity it is far from people." }

  [[eval.metric]]
  id = "jc_jv_judge"
  label = { zh = "Judge's Verdict：裁判和每位标注员完全一致（平均）", en = "Judge's Verdict: exact agreement with each annotator (mean)" }
  extractor = "json_value"
  args = { path = "judge-calibration-public/eval/results/summary.json", keys = ["jv", "judge_mean_exact"], scale = 100, unit = "pct", decimals = 1 }
  direction = "higher"

  [[eval.metric]]
  id = "jc_jv_human"
  label = { zh = "Judge's Verdict：标注员彼此完全一致（平均）", en = "Judge's Verdict: exact agreement between annotators (mean)" }
  extractor = "json_value"
  args = { path = "judge-calibration-public/eval/results/summary.json", keys = ["jv", "human_mean_exact"], scale = 100, unit = "pct", decimals = 1 }
  direction = "none"

  [[eval.metric]]
  id = "jc_se_fluency"
  label = { zh = "SummEval 流畅度：和专家的 Spearman 相关", en = "SummEval fluency: Spearman with experts" }
  extractor = "json_value"
  args = { path = "judge-calibration-public/eval/results/summary.json", keys = ["summeval", "fluency", "spearman"], decimals = 3 }

  [[eval.metric]]
  id = "jc_se_consistency"
  label = { zh = "SummEval 事实一致：和专家的 Spearman 相关", en = "SummEval consistency: Spearman with experts" }
  extractor = "json_value"
  args = { path = "judge-calibration-public/eval/results/summary.json", keys = ["summeval", "consistency", "spearman"], decimals = 3 }

  [[eval.metric]]
  id = "jc_mqm_kappa"
  label = { zh = "WMT MQM 中译英：加权 kappa", en = "WMT MQM Chinese to English: weighted kappa" }
  extractor = "json_value"
  args = { path = "judge-calibration-public/eval/results/summary.json", keys = ["mqm", "weighted_kappa", "kappa"], decimals = 3 }

[[eval]]
id = "routing"
name = { zh = "规则、裁判和复核队列怎么分工（711 道）", en = "Rules, judge and a review queue (711 items)" }
date = "2026-11-18"
data = { zh = "同一批定好答案的判断题，比较只用裁判（A）和先用规则、再判一次、拿不准的送人工（B）。", en = "The same items with fixed answers, comparing the judge alone (A) with rules first, then one judgment, unsure items sent to a queue (B)." }
items = { zh = "711 道，其中 390 道含错误", en = "711 items, 390 of them wrong" }
runs = { zh = "每种接法 1 遍", en = "1 run per arm" }
setup = { zh = "claude-haiku-5-5，effort medium，批量接口", en = "claude-haiku-5-5, effort medium, Message Batches API" }
frozen = { zh = "`eval/PREREGISTRATION.md`", en = "`eval/PREREGISTRATION.md`" }
takeaway = { zh = "先用规则、再交裁判、拿不准的送人工，漏掉的错误更少，费用也更低；裁判自己说“拿不准”的那部分错得多，正好拿来决定送人工。", en = "Rules first, then the judge, with unsure items to people, misses fewer errors at a lower cost; the items the judge marks unsure are the ones it gets wrong most, which makes them the right ones to send." }

  [[eval.metric]]
  id = "jc_missed_a"
  label = { zh = "只用裁判：漏掉的错误", en = "Judge alone: errors missed" }
  extractor = "json_counts"
  args = { path = "judge-calibration-public/eval/results/summary.json", at = ["combination", "A", "missed"] }
  direction = "lower"

  [[eval.metric]]
  id = "jc_missed_b"
  label = { zh = "规则、裁判、复核队列：漏掉的错误", en = "Rules, judge, review queue: errors missed" }
