did = { zh = "我把一个模型裁判分别和三种标准比：出题时定好的答案、监管和法院的结论、公开数据集自带的人工评分；再定出哪些检查交给脚本、哪些交给裁判、哪些留给人，并做了一个带验收标准的质检 Agent。方案、冻结的文件和预测跑前写好。", en = "I measured one model judge against three standards kept apart: answers fixed when the items were built, regulator and court decisions, and the human ratings that ship with public datasets; then set which checks go to a script, a judge or a person, and built a quality-check agent with an acceptance standard. The plan, frozen files and predictions were written before the runs." }
name = { zh = "模型裁判校准", en = "Judge Calibration" }
problem = { zh = "用模型当裁判打分省事，可它能信到什么程度；哪些检查可以交给它，哪些该用脚本，哪些必须留给人", en = "A model judge is convenient, but how far can it be trusted, which checks can it take, which belong to a script, and which must stay with people?" }
primary_metric = { zh = "和标准一致的比例；植入的错误抓到的比例；漏掉的错误和送人工的比例", en = "Agreement with each standard; planted errors caught; errors missed and share sent to people" }
headline = [
  { zh = "和出题时定好的答案一致 {jc_constructed}，植入的错误抓到 {jc_caught}", en = "Agreed with the answers fixed at item-building time on {jc_constructed}; planted errors caught {jc_caught}" },
  { zh = "监管和法院结论：从广告本身能看出的 {jc_reg_face}，要靠外部证据的只有 {jc_reg_evidence}", en = "Regulator and court decisions: {jc_reg_face} where the ad itself shows it, only {jc_reg_evidence} where outside evidence decides" },
  { zh = "先用规则、再交裁判、拿不准的送人：漏掉的错误 {jc_missed_b}，只用裁判时 {jc_missed_a}；送人工 {jc_queue_b}", en = "Rules, then the judge, unsure items to people: errors missed {jc_missed_b} against {jc_missed_a} with the judge alone; sent to people {jc_queue_b}" },
]
summary = { zh = "检验一个模型裁判能信到什么程度。三种标准分开比：出题时定好答案的判断题（审核意见、简历判断、修改建议）、监管机构和法院对真实广告的结论、公开数据集自带的人工评分（Judge's Verdict、SummEval、WMT MQM 中译英）。再按结果把检查分成三类：能用脚本查的、能交给裁判的、必须留给人的，比较“只用裁判”和“先规则、再裁判、拿不准的送人工”两种接法；最后做了一个用两个工具的质检 Agent，并按模拟批次给它定验收标准。没有为这个项目另做人工评分。", en = "Measures how far one model judge can be trusted, against three standards kept apart: items with answers fixed when they were built (review opinions, resume verdicts, revision advice), regulator and court decisions on real ads, and the human ratings that ship with public datasets (Judge's Verdict, SummEval, WMT MQM Chinese to English). The results sort checks into three kinds: for a script, for the judge, and for people; the judge alone is compared with rules first, then the judge, with unsure items sent to people. Last, a quality-check agent with two tools gets an acceptance standard tested on simulated batches. No human ratings were collected for this project." }
core_link = { zh = "判断题来自有据审核、简历初筛和卖点体检的存档答案；能用规则查的部分照 evidence-check 的做法交给脚本。", en = "The items come from the stored answers of Grounded Review, resume screening and Sellpoint Check; the rule-checkable part goes to a script, the way evidence-check does it." }
models = { zh = "裁判用 claude-haiku-5-5（effort medium，批量接口）；在 120 道题上用 claude-sonnet-5-5 做第二裁判对照。", en = "The judge is claude-haiku-5-5 (effort medium, Message Batches API); claude-sonnet-5-5 serves as a second judge on 120 items." }
iteration = { zh = ["裁判提示词 v1 到 v4：v2 在开发集上 {jc_dev_v2}（v1 {jc_dev_v1}），采用；v3 打平、v4 更严，都不采用。", "对定好的答案几乎全对；对监管和法院的结论，要靠外部证据的那一半明显差。", "对公开数据集的人工评分：和每位标注员的一致率 {jc_jv_judge}，落在标注员彼此之间的范围里；流畅度这类主观项和专家相关最低（{jc_se_fluency}）。", "规则、裁判、人工分工：先规则再裁判、拿不准的送人工，比只用裁判漏得少，也更便宜。", "质检 Agent 查出全部错误记录（{jc_qc_caught}），正确记录误报 {jc_qc_false}；验收标准在错误率百分之二的批次上达标，在百分之十的批次上没达到目标。"], en = ["Judge prompt v1 to v4: v2 scored {jc_dev_v2} on the development split (v1 {jc_dev_v1}) and was adopted; v3 tied and v4 was stricter, neither adopted.", "Against fixed answers the judge is almost always right; against regulator and court decisions it is clearly weaker where outside evidence decides.", "Against published human ratings: agreement with each annotator {jc_jv_judge}, within the range annotators reach with one another; subjective dimensions such as fluency correlate least with experts ({jc_se_fluency}).", "Splitting the work: rules first, then the judge, with unsure items to people, misses less than the judge alone and costs less.", "The quality-check agent caught every wrong record ({jc_qc_caught}) and flagged {jc_qc_false} correct ones; the acceptance standard met its target on batches with a two-percent error rate but not on ten-percent batches."] }
conclusion = { zh = "模型裁判在答案清楚、能对回原文的检查上可以放心用，能用规则查的交给脚本更稳；要靠外部证据的结论和主观质量评分，裁判和人差得多，应该留给人。裁判自己说“拿不准”的那部分错得多，正好可以拿来决定送人工。", en = "A model judge can be trusted on checks with clear answers that trace back to the text, and rule-checkable parts are safer with a script; decisions that turn on outside evidence and subjective quality ratings stay far from people and should stay with them. The judge's own \"unsure\" marks the items it gets wrong most often, which makes it a good signal for sending items to people." }
short_name = { zh = "裁判校准", en = "Judge calibration" }
card_title = { zh = "模型裁判能信到什么程度，哪些该交给人", en = "How far a model judge can be trusted" }
assumed = { zh = "以为在答案里加“保证没错”这类话会骗过裁判", en = "Expected assurance phrases in an answer to sway the judge" }
showed = { zh = "加废话 {jc_verbose}、加保证语 {jc_assertive}，没有让错的被放过", en = "Padding changed {jc_verbose} and assurances {jc_assertive}; no wrong answer got through" }
result_line = { zh = "和定好的答案一致 {jc_constructed}；要靠外部证据的监管结论只对 {jc_reg_evidence}", en = "Agreed with fixed answers on {jc_constructed}; only {jc_reg_evidence} on regulator decisions that turn on outside evidence" }
key_numbers = [{ metric = "jc_constructed", label = { zh = "和出题时定好的答案一致", en = "Agreement with answers fixed at item-building time" } }, { metric = "jc_reg_evidence", label = { zh = "要靠外部证据的监管结论，判对", en = "Regulator decisions that turn on outside evidence: right" } }, { metric = "jc_missed_b", label = { zh = "规则加裁判加复核漏掉（只用裁判 {jc_missed_a}）", en = "Errors missed with rules, judge and review (judge alone: {jc_missed_a})" } }]
