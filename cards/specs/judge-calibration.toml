  { date = "2026-11-18", label = { zh = "监管和法院", en = "Regulators and courts" }, text = { zh = "要靠外部证据的那一半明显差", en = "Weaker where outside evidence decides" }, before = "jc_reg_face", after = "jc_reg_evidence" },
  { date = "2026-11-18", label = { zh = "分工", en = "Splitting the work" }, text = { zh = "规则、裁判、人工分开，漏得更少", en = "Rules, judge and people: fewer misses" }, before = "jc_missed_a", after = "jc_missed_b", adopted = true },
