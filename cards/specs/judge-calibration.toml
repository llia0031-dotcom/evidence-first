[[eval]]
id = "sensitivity"
name = { zh = "加废话、加保证语会不会骗过裁判（368 道）", en = "Does padding or assurance sway the judge? (368 items)" }
date = "2026-11-18"
data = { zh = "同一批题，答案里加上不相干的长段落，或加上“保证没错”这类话，看裁判的判断变不变；同时量重复判一次本来就会变多少。", en = "The same items with irrelevant padding or assurance phrases added to the answer, to see whether verdicts change; repeating the judgment measures the noise floor." }
items = { zh = "368 道", en = "368 items" }
runs = { zh = "每种改法 1 遍", en = "1 run per change" }
setup = { zh = "claude-haiku-5-5，effort medium，批量接口", en = "claude-haiku-5-5, effort medium, Message Batches API" }
frozen = { zh = "`eval/PREREGISTRATION.md`", en = "`eval/PREREGISTRATION.md`" }
takeaway = { zh = "加废话一道没变；加保证语变了 {jc_assertive}，都是边界上的好建议，没有让错的被放过；事先预测的“会被骗”没成立。", en = "Padding changed no verdict; assurances changed {jc_assertive}, all borderline good answers, and let no wrong one through; the prediction that they would sway the judge did not hold." }

  [[eval.metric]]
  id = "jc_verbose"
  label = { zh = "加废话后判断变了", en = "Verdicts changed by padding" }
  extractor = "md_cell"
  args = { path = "judge-calibration-public/eval/results/RESULTS.md", section = "7. Sensitivity", row = "verbose", col = "Verdicts changed" }
  direction = "lower"

  [[eval.metric]]
  id = "jc_assertive"
  label = { zh = "加保证语后判断变了", en = "Verdicts changed by assurances" }
  extractor = "md_cell"
  args = { path = "judge-calibration-public/eval/results/RESULTS.md", section = "7. Sensitivity", row = "assertive", col = "Verdicts changed" }
  direction = "lower"

[[eval]]
id = "qc"
name = { zh = "质检 Agent 和验收标准", en = "Quality-check agent and acceptance standard" }
date = "2026-11-18"
data = { zh = "239 条审核记录（119 条有错、120 条正确），比较只用脚本和用两个工具的质检 Agent；验收标准在每批 100 条、不同错误率的模拟批次上检验。", en = "239 review records (119 wrong, 120 right), comparing a script alone with a quality-check agent using two tools; the acceptance standard is tested on simulated batches of 100 records at several error rates." }
items = { zh = "239 条记录；模拟批次", en = "239 records; simulated batches" }
runs = { zh = "每条 1 遍", en = "1 run per record" }
setup = { zh = "claude-haiku-5-5，effort medium，批量接口", en = "claude-haiku-5-5, effort medium, Message Batches API" }
frozen = { zh = "`eval/PREREGISTRATION.md`", en = "`eval/PREREGISTRATION.md`" }
takeaway = { zh = "质检 Agent 查出全部错误记录，误报少；验收标准放行了错误率低的批次，但错误率百分之十的批次也有一部分被放行，没达到事先定的目标。", en = "The agent caught every wrong record with few false flags; the acceptance standard passed low-error batches, but some ten-percent batches also passed, missing the target set beforehand." }

  [[eval.metric]]
  id = "jc_qc_caught"
  label = { zh = "质检 Agent：错误记录查出", en = "QC agent: wrong records caught" }
  extractor = "json_counts"
  args = { path = "judge-calibration-public/eval/results/summary.json", at = ["qc", "agent", "caught"] }

  [[eval.metric]]
  id = "jc_qc_false"
  label = { zh = "质检 Agent：正确记录被误报", en = "QC agent: correct records flagged" }
  extractor = "json_counts"
  args = { path = "judge-calibration-public/eval/results/summary.json", at = ["qc", "agent", "false_flags"] }
  direction = "lower"

  [[eval.metric]]
  id = "jc_accept_2"
  label = { zh = "错误率百分之二的批次被放行", en = "Batches with a two-percent error rate accepted" }
  extractor = "md_value"
  args = { path = "judge-calibration-public/eval/results/RESULTS.md", section = "Acceptance standard", row = "2%", col = "Accepted", unit = "pct", decimals = 1 }
  direction = "higher"

  [[eval.metric]]
  id = "jc_accept_10"
  label = { zh = "错误率百分之十的批次被放行（目标是不超过一成）", en = "Batches with a ten-percent error rate accepted (target: at most one in ten)" }
  extractor = "md_value"
  args = { path = "judge-calibration-public/eval/results/RESULTS.md", section = "Acceptance standard", row = "10%", col = "Accepted", unit = "pct", decimals = 1 }
  direction = "lower"

  [[eval.metric]]
  id = "jc_predictions"
  label = { zh = "事先写好的预测成立", en = "Predictions written beforehand that held" }
  extractor = "json_count_true"
  args = { path = "judge-calibration-public/eval/results/summary.json", at = ["predictions"], field = "held" }
  direction = "none"

  [[eval.metric]]
  id = "jc_cost_total"
  label = { zh = "整个项目的接口费用（批量价）", en = "Total API cost (batch prices)" }
  extractor = "json_value"
  args = { path = "judge-calibration-public/eval/results/summary.json", keys = ["cost", "total_usd"], unit = "usd", decimals = 2 }
  direction = "lower"

[[limitation]]
text = { zh = "判断题来自同一组项目的存档答案，错误是植入的；“论证成错误结论”这类错误样本由 `eval/gen_flips.py` 生成，生成时用的是同一个模型，裁判认得自己写法的偏差没有排除。", en = "The items come from the same set of projects' stored answers and the errors are planted; \"argued to a wrong conclusion\" samples were produced by `eval/gen_flips.py` with the same model, so a bias towards its own writing is not ruled out." }
advice = { zh = "上线前用真实业务里已经有结论的记录再校准一次，错误样本换不同来源。", en = "Before use, calibrate again on real records with settled outcomes, with error samples from other sources." }

[[limitation]]
text = { zh = "监管和法院的结论只有 46 条，要靠外部证据的只有 11 条；区间很宽。", en = "Only 46 regulator and court decisions, 11 of them turning on outside evidence; the intervals are wide." }
advice = { zh = "这类结论直接留给人，或者先补齐外部证据再交裁判。", en = "Leave such decisions to people, or gather the outside evidence before handing them to a judge." }

[[limitation]]
text = { zh = "验收标准在错误率百分之十的批次上放行了 {jc_accept_10}，没达到事先定的目标。", en = "The acceptance standard passed {jc_accept_10} of ten-percent batches, missing the target set beforehand." }
advice = { zh = "加大每批抽检量或收紧放行门槛，再在模拟批次上重测。", en = "Sample more per batch or tighten the pass threshold, then test again on simulated batches." }

