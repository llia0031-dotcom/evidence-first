did = { zh = "我写了虚构的岗位和简历、事先定好答案，比较普通打分、附原文、附原文加脚本核对几种做法；发现核对的接法会误伤正确的判断以后，改了两版接法；再用带陷阱的新简历、植入错误和第二次独立复核检验。", en = "I wrote fictional jobs and resumes with answers fixed in advance and compared plain scoring, quotes, and quotes plus the script; after finding that the check discarded correct verdicts I rewired it twice; then tested with trap-laden new resumes, planted errors and an independent second review." }
name = { zh = "有据可查的简历初筛", en = "Evidence-backed resume screening" }
problem = { zh = "用模型初筛简历时，每个“符合 / 不符合”都要附简历原文；看它会不会更准、换名字性别学校后结论会不会变", en = "When a model screens resumes, every met / not-met verdict should carry a resume quote; does that make it more accurate, and do verdicts change when name, gender or school change" }
primary_metric = { zh = "逐条要求判对率；换名字等之后去留有没有变；正确的“符合”被核对误伤的比例", en = "Requirement verdicts right; advance decisions that change when names and other details change; correct \"met\" verdicts lost to the quote check" }
headline = [
  { zh = "换名字后去留变化：普通打分 {v1_name_flip_plain}，附原文 {v1_name_flip_evidence}", en = "Advance decisions changed by a name swap: plain {v1_name_flip_plain}, with quotes {v1_name_flip_evidence}" },
  { zh = "核对误伤正确的“符合”：{v2_loss_evidence} → {v2_loss_split}（先拆出简历事实）→ {v2_loss_self}（交卷前自查）", en = "Correct \"met\" verdicts lost to the check: {v2_loss_evidence} → {v2_loss_split} (resume facts split out) → {v2_loss_self} (self-check before submitting)" },
  { zh = "独立复核挑出植入的错读：{verify_full}", en = "Second review catches planted misreadings: {verify_full}" },
]
summary = { zh = "检验一件事：让模型给每个“符合 / 不符合”附上简历原文、再用 evidence-check 的脚本核对，初筛会不会更准、在换掉名字、性别、学校、休学、婚育之后更稳。岗位和简历全部虚构，答案在写简历时定好。做了四版评测：第一版看准确和稳定，第二版改核对的接法，第三版用更乱、带陷阱的简历，另做了植入错误测试和第二次独立复核。", en = "Tests whether having the model attach a resume quote to every met / not-met verdict, checked by the evidence-check script, makes screening more accurate and more stable when name, gender, school, career gaps or marital details change. All jobs and resumes are fictional and answers were fixed when the resumes were written. Four rounds: accuracy and stability, a better way to wire the check, messier resumes with traps, plus planted-error tests and an independent second review." }
core_link = { zh = "用 evidence-check 0.2.0 脚本的冻结副本核对每条引文。", en = "Uses a frozen copy of the evidence-check 0.2.0 script to check every quote." }
models = { zh = "claude-haiku-5-5；第三版之后走批量接口。", en = "claude-haiku-5-5; from round three on, the Message Batches API." }

judge = { zh = [
  "逐条要求按写简历时定好的答案用脚本算，没有用评分器。",
  "第二次独立复核先在答案已知的样本上检验：植入的错读挑出 {verify_full}，正确答案误报 {verify_full_fa}。",
], en = [
  "Requirement verdicts are scored by script against answers fixed when the resumes were written; no grader is used.",
  "The independent second review was checked on known answers first: planted misreadings caught {verify_full}, false alarms on right answers {verify_full_fa}.",
] }

iteration = { zh = ["第一版：把脚本核对直接接在“符合”上，逐条判对只有 {v1_evidence_script}，原因是“符合”里复述了岗位门槛的数字。", "第二版：先拆出“简历事实”再核对，误伤 {v2_loss_split}；再让模型交卷前自己调用核对，误伤 {v2_loss_self}。", "植入错误：引文核对拦得住编造，拦不住看错意思（{seeded_misread}），所以加第二次独立复核，挑出 {verify_full}。"], en = ["Round 1: the script wired straight onto \"met\" verdicts got only {v1_evidence_script} right, because verdicts restated the job's threshold numbers.", "Round 2: resume facts split out before the check, {v2_loss_split} lost; the model calling the checker itself before submitting, {v2_loss_self} lost.", "Planted errors: quote checking stops fabrication but not misreading ({seeded_misread}), so an independent second review was added, catching {verify_full}."] }

conclusion = { zh = "附原文不降准确率，换名字、性别、学校也不改变去留；但核对要接对位置，而且只防编造、不防看错，所以还要第二次复核。", en = "Quotes cost no accuracy and swapping name, gender or school does not change decisions; but the check must be wired in the right place and stops fabrication, not misreading, so a second review is needed." }

short_name = { zh = "简历初筛", en = "Resume screening" }
card_title = { zh = "初筛简历时，每个“符合”都附简历原文", en = "Resume screening where every verdict quotes the resume" }
