  [[eval.metric]]
  id = "v2_loss_evidence"
  label = { zh = "正确的“符合”被核对误伤（附原文 + 脚本）", en = "Correct \"met\" lost to the check (quotes + script)" }
  extractor = "sa_script_loss"
  args = { path = "screening-audit/eval/v2/results/run-2026-11-13.summary.json", arm = "evidence + script", base = "evidence" }
  direction = "lower"

  [[eval.metric]]
  id = "v2_loss_split"
  label = { zh = "正确的“符合”被核对误伤（先拆简历事实 + 脚本）", en = "Correct \"met\" lost to the check (resume facts split out + script)" }
  extractor = "sa_script_loss"
  args = { path = "screening-audit/eval/v2/results/run-2026-11-13.summary.json", arm = "split + script", base = "split" }
  direction = "lower"

  [[eval.metric]]
  id = "v2_loss_self"
  label = { zh = "正确的“符合”被核对误伤（交卷前自查 + 脚本）", en = "Correct \"met\" lost to the check (self-check + script)" }
  extractor = "sa_script_loss"
  args = { path = "screening-audit/eval/v2/results/run-2026-11-13.summary.json", arm = "split-self + script", base = "split-self" }
  direction = "lower"

[[eval]]
id = "v3"
name = { zh = "第三版：更乱、带陷阱的简历（24 份）", en = "Round 3: messier resumes with traps (24)" }
date = "2026-11-14"
data = { zh = "24 份更乱的新简历，埋了 40 个陷阱（例如只用过没做过、低于门槛、已经毕业），答案写简历时定好，跑前冻结。", en = "24 messier new resumes with 40 planted traps (used but did not build, below the threshold, already graduated and so on); answers fixed at writing, frozen before the run." }
items = { zh = "24 份简历、40 个陷阱，3 组各 2 遍", en = "24 resumes, 40 traps, 3 arms × 2 runs" }
runs = { zh = "每组 2 遍，合并计算", en = "2 runs per arm, pooled" }
setup = { zh = "claude-haiku-5-5，批量接口（半价）", en = "claude-haiku-5-5, Message Batches API (half price)" }
frozen = { zh = "`eval/v3/PREREGISTRATION.md`", en = "`eval/v3/PREREGISTRATION.md`" }

  [[eval.metric]]
  id = "v3_traps_self"
  label = { zh = "陷阱判成“不符合”（交卷前自查）", en = "Traps judged not met (self-check arm)" }
  extractor = "sa_traps_right"
  args = { path = "screening-audit/eval/v3/results/run-2026-11-14.summary.json", arm = "split-self" }

  [[eval.metric]]
  id = "v3_traps_plain"
  label = { zh = "陷阱判成“不符合”（普通打分）", en = "Traps judged not met (plain)" }
  extractor = "sa_traps_right"
  args = { path = "screening-audit/eval/v3/results/run-2026-11-14.summary.json", arm = "plain" }

  [[eval.metric]]
  id = "v3_cells_self"
  label = { zh = "逐条判对（交卷前自查 + 脚本）", en = "Requirements right (self-check + script)" }
  extractor = "json_counts"
  args = { path = "screening-audit/eval/v3/results/run-2026-11-14.summary.json", at = ["accuracy", "split-self + script"], num = "correct", den = "cells" }

[[eval]]
id = "seeded"
name = { zh = "植入错误测试：脚本能拦住什么", en = "Planted errors: what the script stops" }
date = "2026-11-14"
data = { zh = "在已有的正确回答里植入错误：改数字、加数字、删字、换成别人简历里的句子，以及“看错意思”（引文是真的，结论是错的）。不调用模型。", en = "Errors planted into existing correct answers: changed numbers, added numbers, dropped characters, lines from another resume, and misreadings where the quote is real but the verdict is wrong. No model calls." }
items = { zh = "409 条基础回答", en = "409 base answers" }
runs = { zh = "确定性脚本，跑 1 遍", en = "Deterministic script, 1 run" }
setup = { zh = "不调用模型，不花钱", en = "No model calls, no cost" }
frozen = { zh = "`eval/seeded/PREREGISTRATION.md`", en = "`eval/seeded/PREREGISTRATION.md`" }
takeaway = { zh = "引文核对防编造，不防看错意思；所以还要第二次独立复核。", en = "Quote checking stops fabrication, not misreading; that is why a second review is needed." }

  [[eval.metric]]
  id = "seeded_added"
  label = { zh = "加进去的数字被拦下", en = "Added numbers stopped" }
  extractor = "json_counts"
  args = { path = "screening-audit/eval/seeded/results/seeded-2026-11-14.json", at = ["summary", "families", "A2"], num = "caught", den = "n" }

  [[eval.metric]]
  id = "seeded_other_resume"
  label = { zh = "别人简历里的句子被拦下", en = "Lines from another resume stopped" }
  extractor = "json_counts"
  args = { path = "screening-audit/eval/seeded/results/seeded-2026-11-14.json", at = ["summary", "families", "A4"], num = "caught", den = "n" }

  [[eval.metric]]
  id = "seeded_misread"
  label = { zh = "看错意思被拦下", en = "Misreadings stopped" }
  extractor = "json_counts"
  args = { path = "screening-audit/eval/seeded/results/seeded-2026-11-14.json", at = ["summary", "families", "B"], num = "caught", den = "n" }

[[eval]]
id = "verify"
name = { zh = "第二次独立复核", en = "Independent second review" }
date = "2026-11-14"
data = { zh = "对每条“符合”另做一次独立复核：一组看得到理由，一组只看引文。用第三版的 103 条正确答案和 40 条植入的错读检验。", en = "Every \"met\" gets an independent second review: one arm sees the reason, one sees only the quote. Tested on 103 right answers and 40 planted misreadings from round three." }
items = { zh = "143 条，每组 2 遍", en = "143 items, 2 runs per arm" }
runs = { zh = "每组 2 遍，合并计算", en = "2 runs per arm, pooled" }
setup = { zh = "claude-haiku-5-5，批量接口（半价）", en = "claude-haiku-5-5, Message Batches API (half price)" }
frozen = { zh = "`eval/verify/PREREGISTRATION.md`", en = "`eval/verify/PREREGISTRATION.md`" }

  [[eval.metric]]
  id = "verify_full"
  label = { zh = "挑出植入的错读（看得到理由）", en = "Misreadings caught (reason visible)" }
  extractor = "sa_verify"
  args = { path = "screening-audit/eval/verify/results/run-2026-11-14.summary.json", arm = "verify-full" }

  [[eval.metric]]
  id = "verify_fact"
  label = { zh = "挑出植入的错读（只看引文）", en = "Misreadings caught (quote only)" }
  extractor = "sa_verify"
  args = { path = "screening-audit/eval/verify/results/run-2026-11-14.summary.json", arm = "verify-fact" }

  [[eval.metric]]
  id = "verify_full_fa"
  label = { zh = "正确答案被误报（看得到理由）", en = "Right answers wrongly flagged (reason visible)" }
  extractor = "sa_verify"
  args = { path = "screening-audit/eval/verify/results/run-2026-11-14.summary.json", arm = "verify-full", field = "false_alarms", total = "right" }
  direction = "lower"

[[limitation]]
text = { zh = "简历是虚构的、短的，和答案出自同一作者；一个模型、一个设置。", en = "Resumes are fictional and short and come from the same author as the answers; one model, one setting." }
advice = { zh = "上线前用脱敏的真实简历和招聘团队自己的岗位重测。", en = "Before launch, re-test on anonymised real resumes and the team's own jobs." }

[[limitation]]
text = { zh = "植入的错读是写进去的，复核和初筛用的是同一个模型。", en = "The misreadings were written in, and the review uses the same model as the screening." }
advice = { zh = "复核换一个不同厂家的模型，或抽样人工复核。", en = "Use a model from another provider for the review, or review a sample by hand." }

