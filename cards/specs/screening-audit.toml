data = { zh = "让模型先拆出“简历事实”和引文，脚本只核对这两样；再试一组交卷前自己调用核对工具。12 份新简历、48 个版本，跑前冻结。", en = "The model first separates resume facts and quotes, and the script checks only those; another arm calls the checker itself before submitting. 12 new resumes, 48 versions, frozen before the run." }
items = { zh = "48 个版本，4 组各 2 遍，共 384 次对话", en = "48 versions, 4 arms × 2 runs, 384 conversations" }
runs = { zh = "每组 2 遍，合并计算", en = "2 runs per arm, pooled" }
setup = { zh = "claude-haiku-5-5，普通接口", en = "claude-haiku-5-5, standard API" }
