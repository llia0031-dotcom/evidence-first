[[eval]]
id = "v1"
name = { zh = "第一版：准确和稳定（228 个简历版本）", en = "Round 1: accuracy and stability (228 resume versions)" }
date = "2026-11-13"
data = { zh = "4 个岗位、24 份基础简历，每份改出换名字、性别、学校、休学、婚育、提示注入等版本，共 228 个。比较关键词匹配、普通打分、附原文、附原文加脚本核对。跑前冻结 11 个文件的哈希。", en = "4 jobs and 24 base resumes, each varied by name, gender, school, career gap, marital status and prompt injection: 228 versions. Compared keyword matching, plain scoring, with quotes, and with quotes plus the script check. Hashes of 11 files frozen before the run." }
items = { zh = "228 个版本，每组 2 遍，共 1,368 次调用", en = "228 versions, 2 runs per arm, 1,368 calls" }
runs = { zh = "每组 2 遍，合并计算", en = "2 runs per arm, pooled" }
setup = { zh = "claude-haiku-5-5，普通接口", en = "claude-haiku-5-5, standard API" }
frozen = { zh = "`eval/PREREGISTRATION.md`", en = "`eval/PREREGISTRATION.md`" }
takeaway = { zh = "附原文本身不降准确率；但把脚本核对直接接在“符合”上会误伤：模型的“符合”里常复述岗位门槛的数字，简历原文里没有，被判没依据。", en = "Quotes alone cost no accuracy, but wiring the script straight onto \"met\" verdicts discards correct ones: the model's verdict often restates the job's threshold number, which the resume quote does not contain." }

  [[eval.metric]]
  id = "v1_plain"
  label = { zh = "逐条判对（普通打分）", en = "Requirements right (plain)" }
  extractor = "json_counts"
  args = { path = "screening-audit/eval/results/run-2026-11-13.summary.json", at = ["accuracy", "plain"], num = "correct", den = "cells" }

  [[eval.metric]]
  id = "v1_evidence"
  label = { zh = "逐条判对（附原文）", en = "Requirements right (with quotes)" }
  extractor = "json_counts"
  args = { path = "screening-audit/eval/results/run-2026-11-13.summary.json", at = ["accuracy", "evidence"], num = "correct", den = "cells" }

  [[eval.metric]]
  id = "v1_evidence_script"
  label = { zh = "逐条判对（附原文 + 脚本核对）", en = "Requirements right (quotes + script)" }
  extractor = "json_counts"
  args = { path = "screening-audit/eval/results/run-2026-11-13.summary.json", at = ["accuracy", "evidence+script"], num = "correct", den = "cells" }

  [[eval.metric]]
  id = "v1_keyword"
  label = { zh = "逐条判对（关键词匹配）", en = "Requirements right (keyword matching)" }
  extractor = "json_counts"
  args = { path = "screening-audit/eval/results/run-2026-11-13.summary.json", at = ["accuracy", "keyword"], num = "correct", den = "cells" }

  [[eval.metric]]
  id = "v1_name_flip_plain"
  label = { zh = "换名字后去留变了（普通打分）", en = "Advance decision changed by a name swap (plain)" }
  extractor = "json_counts"
  args = { path = "screening-audit/eval/results/run-2026-11-13.summary.json", at = ["stability", "plain", "by_kind", "name"], num = "decision_flips", den = "decisions" }
  direction = "lower"

  [[eval.metric]]
  id = "v1_name_flip_evidence"
  label = { zh = "换名字后去留变了（附原文）", en = "Advance decision changed by a name swap (with quotes)" }
  extractor = "json_counts"
  args = { path = "screening-audit/eval/results/run-2026-11-13.summary.json", at = ["stability", "evidence", "by_kind", "name"], num = "decision_flips", den = "decisions" }
  direction = "lower"

  [[eval.metric]]
  id = "v1_school_flip_evidence"
  label = { zh = "换学校后去留变了（附原文）", en = "Advance decision changed by a school swap (with quotes)" }
  extractor = "json_counts"
  args = { path = "screening-audit/eval/results/run-2026-11-13.summary.json", at = ["stability", "evidence", "by_kind", "school"], num = "decision_flips", den = "decisions" }
  direction = "lower"

[[eval]]
id = "v2"
name = { zh = "第二版：改核对的接法（12 份新简历）", en = "Round 2: a better way to wire the check (12 new resumes)" }
