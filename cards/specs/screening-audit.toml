result_line = { zh = "附上简历原文后，判断几乎不出错（{v1_evidence}），只换名字也不改变去留（{v1_name_flip_evidence}）", en = "With resume quotes, verdicts were right {v1_evidence} times; swapping names changed {v1_name_flip_evidence} decisions" }
key_numbers = [{ metric = "v1_name_flip_evidence", label = { zh = "只换候选人名字，去留结论改变的次数", en = "Decisions changed when only the name changed" } }, { metric = "v2_loss_self", label = { zh = "对的判断被核对误删（改进前 {v2_loss_evidence}）", en = "Correct verdicts wrongly removed (before the fix: {v2_loss_evidence})" } }, { metric = "verify_full", label = { zh = "看错简历的判断，复核时全部挑了出来", en = "Misread resumes, all caught by the second review" } }]
timeline = [
