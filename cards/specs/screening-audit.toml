  { date = "2026-11-13", label = { zh = "第二版", en = "Round 2" }, text = { zh = "先拆简历事实，再交卷前自查", en = "Facts split out, then self-check" }, before = "v2_loss_evidence", after = "v2_loss_self", adopted = true },
  { date = "2026-11-14", label = { zh = "第二次复核", en = "Second review" }, text = { zh = "另做一次复核，专抓看错意思", en = "A second review for misreadings" }, after = "verify_full", adopted = true },
