[[limitation]]
text = { zh = "题目和 Skill 出自同一作者，资料是虚构的；一个模型、两遍、一天。", en = "Items and skill come from the same author, on fictional documents; one model, two runs, one day." }
advice = { zh = "装进别的 Agent 时，用那个场景自己的资料和错误再测一轮。", en = "When adding it to another agent, test again with that setting's own documents and errors." }

[[limitation]]
text = { zh = "脚本单独用时抓不住意思上的矛盾：原文是真的、数字也对，但说法和原文相反，脚本会放行。", en = "On its own the script misses contradictions in meaning: a real quote with the right numbers can be cited for the opposite claim." }
advice = { zh = "所以 Skill 要求 Agent 逐条重读通过的说法；要更稳就再加一次独立复核。", en = "That is why the skill makes the agent reread every passing claim; add an independent second check for more safety." }

[[limitation]]
text = { zh = "中文引文至少要 4 个字，少于 4 个字的完整短句会被挡下；翻译过的组名、离得远的序数还认不出。", en = "Chinese quotes need at least four characters, so complete shorter phrases are blocked; translated group names and ordinals far from the quote are not yet recognised." }
advice = { zh = "这几类写进了下一版待改清单，改之前照样先写新题。", en = "These are on the list for the next version, which will again get new items before the change." }

