id = "evidence-check"
order = 1
layer = "core"
status = "public"
card_version = "1.1"
updated = "2026-11-15"
period = "2026-11-12 – 2026-11-14"
team = "Liang Liyuan"
stack = { zh = "Python（只用标准库）、Agent Skill、promptfoo", en = "Python (standard library only), Agent Skill, promptfoo" }
did = { zh = "我把 TraceDesk 里逐字核对引文和数字的规则抽出来，做成谁都能装的 Skill 加核对脚本；先在开发评测里找问题、改出 v0.2，再在冻结的留出题上和普通提示比较；之后按真实使用中的误报和待改清单两次改规则（0.3.0、0.4.0），每次改之前先写好新题。", en = "I took TraceDesk's word-for-word quote and number rules out into a skill and checker anyone can install; found problems in a development run, wrote v0.2, and compared it with a plain prompt on frozen held-out items; then revised the rules twice (0.3.0, 0.4.0) from false alarms in real use and a list of known gaps, writing new items before each change." }
name = { zh = "有据可查 evidence-check", en = "evidence-check" }
problem = { zh = "AI 按资料写的回答和草稿，会悄悄改掉日期、数字，或者多出资料里没有的话；要让每句事实都附逐字原文，再用脚本核对", en = "Answers and drafts written from documents quietly shift dates and numbers or add facts no document states; every factual sentence should carry a word-for-word quote that a script checks" }
primary_metric = { zh = "埋进去的错误被标出的比例；正确事实被误标的比例；编造数字的回答数", en = "Planted errors flagged; correct facts wrongly flagged; answers with an invented number" }
headline = [
  { zh = "留出评测：埋的错误全部标出 {v2_flag_v02}，正确事实误标 {v2_fa_v02}", en = "Held-out: planted errors flagged {v2_flag_v02}, correct facts wrongly flagged {v2_fa_v02}" },
  { zh = "编造数字的回答：普通提示 {v2_inv_plain} → Skill v0.2 {v2_inv_v02}", en = "Answers with an invented number: plain prompt {v2_inv_plain} → skill v0.2 {v2_inv_v02}" },
  { zh = "脚本 0.4.0：正确说法通过 {v4_ok_before} → {v4_ok_after}，改错的数字仍全部标出 {v4_wrong_after}", en = "Script 0.4.0: correct claims passing {v4_ok_before} → {v4_ok_after}, changed numbers still all flagged {v4_wrong_after}" },
]
links = [
  { label = { zh = "代码和报告", en = "Code and report" }, url = "https://github.com/llia0031-dotcom/evidence-check" },
]
summary = { zh = "一个 Agent Skill 加一个核对脚本。Skill 让 Agent 给每句事实附上资料里逐字的原文；脚本核对两件事：原文真的在所引的文件里（大小写、空格、弯引号和标点不计较），以及这句话里的日期、时间、金额和数量也都出现在原文里，中英文数字互认（例如“下午2点”和 14:00）。脚本判断不了意思，所以 Skill 还要求 Agent 逐条读一遍通过的说法。两种用法：按资料回答问题；核对一篇草稿。", en = "An Agent Skill plus a checker script. The skill has the agent attach a word-for-word quote from the documents to every factual sentence; the script checks that the quote is really in the cited file (case, spacing, curly quotes and punctuation forgiven) and that every date, time, amount and count in the sentence also appears in its quotes, across Chinese and English numerals (\"下午2点\" matches 14:00). The script cannot judge meaning, so the skill also has the agent reread every passing claim. Two modes: answer from documents, and check a draft." }
core_link = { zh = "就是核心部件本身：卖点体检、有据审核、简历初筛都调用它的脚本；匹配和数字规则移植自 TraceDesk。", en = "This is the core component: Sellpoint Check, Grounded Review and the screening study call its script; the matching and number rules were ported from TraceDesk." }
models = { zh = "评测用 claude-haiku-5-5（effort medium）；脚本本身不调用模型，只要 Python 3.9 以上。", en = "Evaluated with claude-haiku-5-5 (effort medium); the script itself calls no model and needs only Python 3.9+." }

judge = { zh = [
  "没有用评分器：所有分数按写题时定好的答案用脚本算。",
], en = [
  "No grader is used: every score is computed by script against answers fixed when the items were written.",
] }

iteration = { zh = ["Skill v0.1 → v0.2：开发评测里两次误报都是正确的翻译、漏掉的一句是算错的时长，于是改成“改写和翻译算有依据、只写资料给的数字”；留出评测里编造数字的回答 {v2_inv_v01} → {v2_inv_v02}。", "脚本 0.2.0 → 0.3.0：按真实使用里的误报加 9 条规则，改之前先写 36 条新说法；正确说法通过 {v3_ok_before} → {v3_ok_after}，改错的数字仍全部标出 {v3_wrong_after}。", "脚本 0.3.0 → 0.4.0：再加 6 条规则（四舍五入、中文序数等），又先写 28 条新说法；正确说法通过 {v4_ok_before} → {v4_ok_after}，旧题没有退步。"], en = ["Skill v0.1 → v0.2: in the development run both false alarms were correct translations and the one miss was a miscalculated duration, so paraphrase and translation now count as supported and only stated numbers may be used; answers with an invented number on the held-out set {v2_inv_v01} → {v2_inv_v02}.", "Script 0.2.0 → 0.3.0: nine rules from false alarms in real use, with 36 new claims written before the change; correct claims passing {v3_ok_before} → {v3_ok_after}, changed numbers still all flagged {v3_wrong_after}.", "Script 0.3.0 → 0.4.0: six more rules (rounding, Chinese ordinals and others), again with 28 new claims written first; correct claims passing {v4_ok_before} → {v4_ok_after}, no regression on earlier items."] }

conclusion = { zh = "Skill 的作用主要在回答问题时：不再编数字；核对脚本单独用时抓不住意思上的矛盾，所以还要逐条重读通过的说法。", en = "The skill's effect shows mainly in free answers, which no longer invent numbers; the script alone misses contradictions in meaning, so passing claims are reread one by one." }

short_name = { zh = "有据可查", en = "evidence-check" }
card_title = { zh = "让 AI 的每句事实都附原文，再用脚本核对", en = "Every fact an AI writes gets a quote a script checks" }
result_line = { zh = "装上这个 Skill 后，AI 按资料回答时，编了数字的回答从 {v2_inv_plain} 降到 {v2_inv_v02}", en = "With the skill, answers that made up a number fell from {v2_inv_plain} to {v2_inv_v02}" }
key_numbers = [{ metric = "v2_flag_v02", label = { zh = "草稿里故意埋的错误，全被标了出来", en = "Errors hidden in drafts on purpose, all flagged" } }, { metric = "v2_inv_v02", label = { zh = "编了数字的回答（不装是 {v2_inv_plain}）", en = "Answers with a made-up number (without it: {v2_inv_plain})" } }, { metric = "v4_ok_after", label = { zh = "改规则后，对的说法全部通过（原来 {v4_ok_before}）", en = "Correct claims no longer flagged after the fix (was {v4_ok_before})" } }]
timeline = [
  { date = "2026-11-12", label = { zh = "Skill v0.2", en = "Skill v0.2" }, text = { zh = "只写资料给的数字，改写和翻译算有依据", en = "Only stated numbers; paraphrase counts" }, before = "v2_inv_v01", after = "v2_inv_v02", adopted = true },
  { date = "2026-11-13", label = { zh = "脚本 0.3.0", en = "Script 0.3.0" }, text = { zh = "按真实使用里的误报加九条规则", en = "Nine rules from real false alarms" }, before = "v3_ok_before", after = "v3_ok_after", adopted = true },
  { date = "2026-11-14", label = { zh = "脚本 0.4.0", en = "Script 0.4.0" }, text = { zh = "加六条规则：四舍五入、中文序数等", en = "Six rules: rounding, ordinals and more" }, before = "v4_ok_before", after = "v4_ok_after", adopted = true },
]

[uses]
zh = [
  "按自己的资料回答问题，每句事实附原文，没通过核对的句子在给人看之前改掉或删掉。",
  "核对一篇草稿：拆成一句句，逐句找原文、跑脚本，列出有问题的句子、原文和一条修改建议。",
  "当作其他 Agent 的“引文核对”工具（有据审核、卖点体检都这样接）。",
]
en = [
  "Answer from your own documents with a quote for every fact; claims that fail are fixed or dropped before anyone reads them.",
  "Check a draft: split it into claims, quote a source for each, run the script and report each problem with the document's words and one suggested fix.",
  "Serve as the quote-checking tool inside other agents, as Grounded Review and Sellpoint Check do.",
]

[out_of_scope]
zh = [
  "观点、头脑风暴这类没有出处可查的内容。",
  "判断意思：一句真实的原文可能被拿来支持相反的说法，脚本看不出来。",
  "加总、换算、算出来的天数和比例：脚本会故意标出来，让人去核对。",
]
en = [
  "Opinions and brainstorming, which have no source to check.",
  "Judging meaning: a real sentence can be cited for its opposite, and the script cannot tell.",
  "Sums, conversions and computed day counts or ratios: the script flags them on purpose for a person to check.",
]


[[eval]]
id = "v2"
name = { zh = "留出评测 v2（144 次对话）", en = "Held-out evaluation v2 (144 conversations)" }
date = "2026-11-12"
data = { zh = "虚构活动的资料，16 个问题（中英各 8）和 8 篇草稿，草稿里埋了 30 处错误（矛盾、数字、编造、过时、算出来的），另有 75 个正确事实。Skill v0.2 在写这些题之前就冻结；跑前冻结题目和打分脚本的哈希。三组：普通提示、Skill v0.1、Skill v0.2，同一个模型、同一份资料、同一种输出格式。", en = "Documents for a fictional event: 16 questions (8 Chinese, 8 English) and 8 drafts with 30 planted errors (contradictions, numbers, invented facts, outdated values, computed values) and 75 correct facts. Skill v0.2 was frozen before the items were written; item and scorer hashes were frozen before the run. Three arms, plain prompt, skill v0.1 and skill v0.2, with one model, one set of documents and one output format." }
items = { zh = "24 道题，每组 2 遍，3 组共 144 次对话", en = "24 items, 2 runs per arm, 3 arms, 144 conversations" }
runs = { zh = "每组 2 遍，合并计算；同一题两遍不独立，区间偏窄", en = "2 runs per arm, pooled; the runs are not independent, so intervals are too narrow" }
setup = { zh = "claude-haiku-5-5，普通接口", en = "claude-haiku-5-5, standard API" }
frozen = { zh = "`eval/v2/PREREGISTRATION.md`（计划、预期、12 个文件的哈希）", en = "`eval/v2/PREREGISTRATION.md` (plan, expectations, hashes of 12 files)" }
