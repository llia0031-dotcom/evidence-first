  extractor = "md_value"
  args = { path = "launchpad-tracedesk/eval/results/check-v2.4-2026-11-09.summary.md", row = "cost (US$)", col = "grounded-v2.4-access", unit = "usd", decimals = 4 }
  direction = "lower"

  [[eval.metric]]
  id = "check2_cost_base"
  label = { zh = "20 道题的费用（普通提示）", en = "Cost of 20 cases (plain prompt)" }
  extractor = "md_value"
  args = { path = "launchpad-tracedesk/eval/results/check-v2.4-2026-11-09.summary.md", row = "cost (US$)", col = "baseline-v2", unit = "usd", decimals = 4 }
  direction = "lower"

[[limitation]]
text = { zh = "只有 40 道题、虚构资料；第二轮在看过第一轮之后改提示词，不是干净的留出结果。", en = "Only 40 cases on fictional documents; the second run changed the prompt after seeing the first, so it is not a clean held-out result." }
advice = { zh = "下一版先冻结一组没看过的新题，再比较。", en = "For the next version, freeze a new unseen set before comparing." }

[[limitation]]
text = { zh = "引文核对只证明原文存在，不证明原文支持这句回答；自动检查也会误报，事实对不对要另外逐条核对。", en = "The quote check proves the quote exists, not that it supports the answer; automatic checks also raise false alarms, so factual correctness needs a separate item-by-item check." }
advice = { zh = "加一层意思核对（evidence-check 的做法：通过的说法再逐条重读）。", en = "Add a meaning check, as evidence-check does by rereading every passing claim." }

[[limitation]]
text = { zh = "带出处的提示更贵：同样 20 道题，v2.4 {check2_cost_v24}，普通提示 {check2_cost_base}。", en = "The grounded prompt costs more: {check2_cost_v24} for v2.4 against {check2_cost_base} for the plain prompt on the same 20 cases." }
advice = { zh = "量大时把资料切短再给模型，或缓存不变的部分。", en = "At volume, send shorter document excerpts or cache the unchanging part." }

