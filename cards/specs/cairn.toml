  { label = { zh = "在线演示", en = "Live demo" }, url = "https://llia0031-dotcom.github.io/cairn/" },
  { label = { zh = "演示视频", en = "Demo video" }, url = "https://youtu.be/0OJ8MqxsqYE" },
]
summary = { zh = "一个按机构公开规定回答问题的问答台，每句话都逐字引原文。公开的这一版用 Monash 学生事务的 58 个公开页面。检索先把问题翻译成英文，再做向量检索和重排；回答里的引文先核对通过才显示，不能逐字对上的改写会被拦下。评测比较了 7 种检索做法。", en = "A desk that answers questions from an organisation's published rules and quotes them word for word. The public instance uses 58 public Monash student pages. Retrieval translates the question into English, then runs vector search and reranking; quotes in the answer are shown only after they pass the check, and paraphrases that do not match word for word are withheld. The evaluation compares seven retrieval methods." }
core_link = { zh = "检索问答场景，主线的起点：回答必须附原文。卖点体检的“先检索”做法用的就是这里的检索模型和 Orama 混合检索。", en = "The grounded Q&A scenario where the thread starts: every answer carries its source. Sellpoint Check's retrieval arms reuse its embedding models and Orama hybrid search." }
models = { zh = "回答和中文问题翻译用 claude-haiku-5-5；检索用本机的向量模型和重排模型。", en = "claude-haiku-5-5 for answers and for translating Chinese questions; local embedding and reranking models for retrieval." }

judge = { zh = [
  "没有用评分器：每道题的正确页面在写题时定好，命中和 MRR 用脚本算。",
], en = [
  "No grader is used: each question's right page was fixed when it was written, and hits and MRR are computed by script.",
] }

iteration = { zh = ["检索：比较了 7 种做法，只用向量检索的 MRR {team_mrr_vector}，先翻译再向量检索加重排 {team_mrr}，采用后者；中文题进前 5 名 {team_zh_hit5_notrans} → {team_zh_hit5}。", "资料：最早用无障碍规范（WCAG），换成学生事务的公开页面，因为那才是学生真要问的。", "提示词：cairn-monash-v1 → v2，来自最后一轮可读性检查（只说“页面”、不多提校区）。"], en = ["Retrieval: seven methods compared; vector search alone has MRR {team_mrr_vector}, translate then vector search with reranking {team_mrr}, which was adopted; Chinese questions in the top five {team_zh_hit5_notrans} → {team_zh_hit5}.", "Corpus: started on the accessibility guidelines (WCAG) and switched to public student pages, which students actually need.", "Prompt: cairn-monash-v1 → v2, from the final readability review (say \"the pages\", no needless campus remarks)."] }

conclusion = { zh = "先翻译再检索、加重排的做法最好；学生的真实提问比自己写的题难。", en = "Translating first, then retrieving with reranking works best; real student questions are harder than the written set." }

