primary_metric = { zh = "检索命中率：正确页面排进前 1、3、5 名的比例；MRR@10", en = "Retrieval hit rate: right page in the top 1, 3 and 5; MRR@10" }
headline = [
  { zh = "45 道题、7 种检索做法：采用的做法正确页面进前 5 名 {team_hit5}，MRR {team_mrr}", en = "45 questions, 7 retrieval methods: the method in use has the right page in the top five for {team_hit5}, MRR {team_mrr}" },
  { zh = "学生用自己的话提的问题：前 5 名 {student_hit5}，MRR {student_mrr}", en = "Questions from students in their own words: top five {student_hit5}, MRR {student_mrr}" },
]
