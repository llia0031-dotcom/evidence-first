  { date = "2026-11-10", label = { zh = "检索", en = "Retrieval" }, text = { zh = "先翻译、再向量检索加重排", en = "Translate, then vector search and rerank" }, before = "team_mrr_vector", after = "team_mrr", adopted = true },
  { date = "2026-11-10", label = { zh = "cairn-monash-v2", en = "cairn-monash-v2" }, text = { zh = "可读性检查后改提示词", en = "Prompt revised after readability review" }, adopted = true },
