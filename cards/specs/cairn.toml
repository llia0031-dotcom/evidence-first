[[eval]]
id = "team"
name = { zh = "检索评测：45 道题、7 种做法", en = "Retrieval evaluation: 45 questions, 7 methods" }
date = "2026-11-10"
data = { zh = "45 道题（英文 25、中文 20），每题的正确页面写题时定好。比较关键词、向量、两种混合检索、加重排、先翻译再检索等 7 种做法。没有跑前冻结的哈希。", en = "45 questions (25 English, 20 Chinese), each with its right page fixed at writing. Seven methods compared: keyword, vector, two hybrid searches, with reranking, and translate-then-retrieve. No hashes were frozen before the run." }
items = { zh = "45 道题", en = "45 questions" }
runs = { zh = "每种做法 1 遍", en = "1 run per method" }
setup = { zh = "检索在本机跑；中文问题的翻译用 claude-haiku-5-5，普通接口", en = "Retrieval runs locally; Chinese questions are translated with claude-haiku-5-5, standard API" }

  [[eval.metric]]
  id = "team_hit1"
  label = { zh = "正确页面排第 1（采用的做法）", en = "Right page first (method in use)" }
  extractor = "json_row"
  args = { path = "cairn-public/app/eval/results/retrieval-2026-11-10.json", list_key = "summary", match = { method = "translate + vector + rerank", lang = "all" }, num = "hit1", den = "n" }

  [[eval.metric]]
  id = "team_hit5"
  label = { zh = "正确页面进前 5（采用的做法）", en = "Right page in the top five (method in use)" }
  extractor = "json_row"
  args = { path = "cairn-public/app/eval/results/retrieval-2026-11-10.json", list_key = "summary", match = { method = "translate + vector + rerank", lang = "all" }, num = "hit5", den = "n" }

  [[eval.metric]]
  id = "team_mrr"
  label = { zh = "MRR@10（采用的做法）", en = "MRR@10 (method in use)" }
  extractor = "json_row"
  args = { path = "cairn-public/app/eval/results/retrieval-2026-11-10.json", list_key = "summary", match = { method = "translate + vector + rerank", lang = "all" }, num = "mrr", value = true }

  [[eval.metric]]
  id = "team_mrr_vector"
  label = { zh = "MRR@10（只用向量检索）", en = "MRR@10 (vector only)" }
  extractor = "json_row"
  args = { path = "cairn-public/app/eval/results/retrieval-2026-11-10.json", list_key = "summary", match = { method = "vector", lang = "all" }, num = "mrr", value = true }

  [[eval.metric]]
  id = "team_mrr_bm25"
  label = { zh = "MRR@10（只用关键词）", en = "MRR@10 (keyword only)" }
  extractor = "json_row"
  args = { path = "cairn-public/app/eval/results/retrieval-2026-11-10.json", list_key = "summary", match = { method = "keyword (BM25)", lang = "all" }, num = "mrr", value = true }

  [[eval.metric]]
  id = "team_zh_hit5_notrans"
