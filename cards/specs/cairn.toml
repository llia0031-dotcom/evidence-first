  [[eval.metric]]
  id = "student_hit5"
  label = { zh = "正确页面进前 5", en = "Right page in the top five" }
  extractor = "json_row"
  args = { path = "cairn-public/app/eval/results/student-retrieval-2026-11-11.json", list_key = "summary", match = { method = "translate + vector + rerank", lang = "all" }, num = "hit5", den = "n" }

  [[eval.metric]]
  id = "student_mrr"
  label = { zh = "MRR@10", en = "MRR@10" }
  extractor = "json_row"
  args = { path = "cairn-public/app/eval/results/student-retrieval-2026-11-11.json", list_key = "summary", match = { method = "translate + vector + rerank", lang = "all" }, num = "mrr", value = true }

[[limitation]]
text = { zh = "真实提问比自己写的题难：学生问题的 MRR {student_mrr}，自己写的题 {team_mrr}；前五名里只漏了断网的线上考试那一题，马来文的问题排第五。", en = "Real wording is harder: MRR {student_mrr} on students' questions against {team_mrr} on the written set; the only question missing from the top five was an online exam that lost connection, and the Malay question ranked fifth." }
advice = { zh = "上线后把用户的真实问题按同样的方法单独打分，持续盯住这个差距。", en = "After launch, score real user questions the same way as a separate set and keep watching the gap." }

[[limitation]]
text = { zh = "没有评测回答本身写得好不好；冒烟测试里有一次把马来西亚校区的问题按澳大利亚的规定回答了。", en = "Answer quality itself is not evaluated; in a smoke test one Malaysia-campus question was answered from Australian rules." }
advice = { zh = "加一套带校区的题，检查答案引用的页面和提问者的校区一致。", en = "Add campus-specific items and check that the cited page matches the asker's campus." }

