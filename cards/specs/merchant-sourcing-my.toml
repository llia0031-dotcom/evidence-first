  { date = "2026-11-19", label = { zh = "商家池", en = "Pool" }, text = { zh = "每个格子都有核对过的原文", en = "Every cell has a checked quote" }, after = "msm_cells" },
  { date = "2026-11-19", label = { zh = "全文核对", en = "Full check" }, text = { zh = "洞察、清单和 README 全部对上", en = "Insight, checklist and READMEs all match" }, after = "msm_claims" },
]

[uses]
zh = [
  "类目团队开拓一个新市场的细分品类时：先看行业洞察定先招什么，再按商家池的先后和下一步去联系。",
  "商家第一次通话后：把对应品类的资质清单发过去，用跟进表排出入驻节点，用头 30 天的 SQL 看新店起步。",
  "第一批商家有了结果后：把公开字段换成团队自己的数据，用校准脚本检验各维度的分数跟不跟得上结果，再定下一版规则。",
]
en = [
  "When a category team opens sub-categories in a new market: the insight decides what to recruit first, the pool's order and next steps decide whom to call.",
  "After a merchant's first call: send the approvals checklist for its category, plan onboarding dates in the tracker, and follow the new shop with the first-30-days SQL.",
  "Once the first batch has results: replace public fields with the team's own data, check with the calibration script whether each dimension tracks results, then set the next version of the rules.",
]

[out_of_scope]
zh = [
  "不评价任何商家；分数低只表示公开证据少或眼下能补的少。",
  "不替代平台自己的卖家名单和后台数据；只用不登录就能读的公开页面。",
]
en = [
  "Does not judge any merchant; a low score means less public evidence or less to gain right now.",
  "Does not replace a platform's own seller lists or back-office data; only pages readable without signing in are used.",
]

[[eval]]
id = "claims"
name = { zh = "全文核对：每条带出处的说法", en = "Full check: every sourced claim" }
date = "2026-11-19"
data = { zh = "洞察、资质清单、中英两份 README 里每一行带出处标签的话，商家池每一行的每个字段，还有每条需求信号；对照的是存档的公开页面原文和结果文件。", en = "Every tagged line of the insight, the checklist and both READMEs, every field of every pool row and every demand signal, against the saved public pages and the result files." }
items = { zh = "全部带出处的说法", en = "All sourced claims" }
runs = { zh = "每次构建都跑", en = "Run on every build" }
setup = { zh = "evidence-check 0.5.0 的核对脚本；不调用模型", en = "The evidence-check 0.5.0 script; no model called" }
frozen = { zh = "`sources/manifests/`（每个网址、读取时间和原文的 SHA-256）", en = "`sources/manifests/` (each URL, fetch time and the SHA-256 of the text)" }
takeaway = { zh = "每条说法都对回了原文，带数字却没标出处的行一条也没有。", en = "Every claim matches its source, and no line carries a number without a source tag." }

  [[eval.metric]]
  id = "msm_claims"
  label = { zh = "带出处的说法对回存档原文", en = "Sourced claims matched to saved pages" }
  extractor = "text_ratio_labels"
  args = { path = "merchant-sourcing-my-public/results/CLAIM_CHECK.md", k_label = "- supported:", n_label = "- claims checked:" }

  [[eval.metric]]
  id = "msm_untagged"
  label = { zh = "带数字却没标出处的行", en = "Lines with a number but no source tag" }
  extractor = "text_value"
  args = { path = "merchant-sourcing-my-public/results/CLAIM_CHECK.md", label = "- lines with a number but no source tag:" }
  direction = "lower"

[[eval]]
id = "pool"
name = { zh = "商家池：按冻结的规则打分", en = "Merchant pool: scored by frozen rules" }
date = "2026-11-19"
data = { zh = "本地品牌、经销商和连锁店，每个字段只从存档的公开页面填，带出处编号和原文；四个维度：需求信号、内容电商缺口、资质准备度、内容能力。", en = "Local brands, distributors and retailers; every field filled only from saved public pages, with a source id and a verbatim quote; four dimensions: demand signal, content-commerce gap, qualification readiness and content capability." }
items = { zh = "商家池全部商家", en = "Every merchant in the pool" }
runs = { zh = "每次构建都跑", en = "Run on every build" }
setup = { zh = "`pool/build.py` 照规则打分，先校验规则文件的指纹", en = "`pool/build.py` scores by the rules after checking the rules file's fingerprint" }
frozen = { zh = "`pool/SCORING.md` 第二版", en = "`pool/SCORING.md` version two" }
takeaway = { zh = "排在最前的是在别处已经卖得好、在内容电商上还没开店或还没做大的本地商家；一半以上找到了马来西亚公司或具名经销商。", en = "The top of the list is local merchants that already sell well elsewhere but have no content-commerce shop yet, or a small one; more than half have a Malaysian company or named distributor." }

