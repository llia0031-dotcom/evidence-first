  label = { zh = "帮已开但还小的店做起来", en = "To grow a shop that is open but small" }
  extractor = "text_value"
  args = { path = "merchant-sourcing-my-public/results/SUMMARY.md", label = "- segments:", nth = 0 }
  direction = "none"

[[eval]]
id = "sources"
name = { zh = "来源：存档的公开页面", en = "Sources: saved public pages" }
date = "2026-11-19"
data = { zh = "只读单个公开页面：先查 robots.txt，同一网站至少隔几秒，不登录，不读电商平台的商品页、店铺页和搜索页；资质只引监管机构。页面原文归原发布方，不公开，清单里有网址、读取时间和原文的 SHA-256。", en = "Single public pages only: robots.txt first, a pause between requests to the same site, no sign-in, no platform product, shop or search pages; approvals quote regulators only. Page texts belong to their publishers and are not redistributed; the manifests list each URL, fetch time and text SHA-256." }
items = { zh = "全部存档页面", en = "Every saved page" }
runs = { zh = "读取一次，可用 `tools/refetch.py` 重新保存", en = "Fetched once; `tools/refetch.py` saves them again" }
setup = { zh = "不调用模型", en = "No model called" }
frozen = { zh = "`sources/manifests/`", en = "`sources/manifests/`" }
takeaway = { zh = "大部分存下的页面都被洞察、清单或商家池引用；资质清单只引监管机构的页面。", en = "Most saved pages are quoted by the insight, the checklist or the pool; the approvals checklist quotes regulators only." }

  [[eval.metric]]
  id = "msm_pages"
  label = { zh = "存档的公开页面", en = "Public pages saved" }
  extractor = "text_value"
  args = { path = "merchant-sourcing-my-public/results/SUMMARY.md", label = "- public pages saved:", nth = 0 }
  direction = "none"

  [[eval.metric]]
  id = "msm_quoted"
  label = { zh = "被引用的页面", en = "Pages quoted" }
  extractor = "text_ratio_labels"
  args = { path = "merchant-sourcing-my-public/results/SUMMARY.md", k_label = "- pages quoted in the insight, the checklist and the pool:", n_label = "- public pages saved:" }
  direction = "none"

  [[eval.metric]]
  id = "msm_official"
  label = { zh = "官方页面", en = "Official pages" }
  extractor = "text_value"
  args = { path = "merchant-sourcing-my-public/results/SUMMARY.md", label = "- public pages saved:", nth = 1 }
  direction = "none"

[[limitation]]
text = { zh = "“公开来源里没找到”不代表不存在，也不是对商家的评价；只读了不登录能看的页面。", en = "\"Not found in public sources\" does not mean it does not exist, and is no judgement of the merchant; only pages readable without signing in were read." }
advice = { zh = "第一次联系前，先查平台自己的卖家名单。", en = "Check the platform's own seller list before the first call." }

[[limitation]]
text = { zh = "第三方给的销量数字是它们的估算；店铺榜只来自一个数据集，按件数排序。", en = "Third-party sales figures are their estimates; the shop ranking comes from one dataset, ordered by units." }
advice = { zh = "拿到平台或商家自己的数据后，用它替换估算再排一次。", en = "Re-rank with the platform's or the merchant's own data once available." }

[[limitation]]
text = { zh = "没有联系过任何商家，触达模板没有发出过；头 30 天的示例数据是虚构的，只用来测 SQL。", en = "No merchant has been contacted and the outreach templates have not been sent; the first-30-days example data is fictional and only tests the SQL." }
advice = { zh = "真正联系后，把入驻结果和第四周的销售记下来，照 pool/INSIDE_THE_TEAM.md 用 pool/calibrate.py 检验权重。", en = "Once outreach starts, record onboarding and week-4 sales, then test the weights with pool/calibrate.py as pool/INSIDE_THE_TEAM.md describes." }

