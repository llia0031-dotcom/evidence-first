did = { zh = "我先查了现成的店铺排行工具：它们只排已经在平台上的商家，回答不了“还没进来或还没做起来的商家里先招谁”。于是用公开来源补这一块：存下官方、市场和品牌的公开页面，写出行业洞察和按品类的资质清单；打分规则在填写任何一行之前写好并冻结，按它给本地品牌、经销商和连锁店排出先后；再配上入驻跟进表、头 30 天的 SQL 和触达模板；充电器、充电宝和数据线单独做了一页深挖；另写了进团队以后先换哪些公开字段、怎么用结果检验打分权重，附校准脚本。每条事实和商家池的每一格都用 evidence-check 对回存档原文。", en = "I first checked the existing shop-ranking tools: they rank merchants already on a platform and cannot answer \"which merchants not yet there, or not yet large, to recruit first\". This pack fills that gap from public sources: saved official, market and brand pages, an industry insight and a per-category approvals checklist; scoring rules written and frozen before any row was filled, ranking local brands, distributors and retailers; then an onboarding tracker, first-30-days SQL and outreach templates; a one-page deep dive on chargers, power banks and cables; and a guide to which public fields to replace with team data first and how to test the scoring weights against results, with a calibration script. Every fact and every cell of the pool is checked against its saved page with evidence-check." }
name = { zh = "马来西亚电子类目招商样本", en = "Malaysia Electronics Merchant Sourcing Pack" }
problem = { zh = "类目团队招商的第一周：市场什么样、先联系哪些商家、凭什么，每类产品要哪些认证，入驻怎么跟进；每条理由都要拿得出公开出处", en = "A category team's first week of merchant recruiting: what the market looks like, which merchants to contact first and why, which approvals each product needs, how onboarding is tracked; every reason backed by a public source" }
primary_metric = { zh = "带出处的说法逐字对回存档原文的比例；商家池里有核对过原文的格子数", en = "Share of sourced claims matched word for word against the saved pages; cells in the pool backed by a checked quote" }
headline = [
  { zh = "洞察、资质清单、两份 README 和商家池里带出处的说法，逐字对回存档原文：{msm_claims}", en = "Sourced claims in the insight, the checklist, both READMEs and the pool, matched word for word against the saved pages: {msm_claims}" },
  { zh = "商家池 {msm_merchants} 家、{msm_subcats} 个细分品类，{msm_cells} 个格子各有核对过的原文；按冻结的规则分档，A 档 {msm_tier_a} 家", en = "A pool of {msm_merchants} merchants across {msm_subcats} sub-categories, {msm_cells} cells each with a checked quote; tiered by the frozen rules, {msm_tier_a} in tier A" },
  { zh = "存了 {msm_pages} 个公开页面，被引用的 {msm_quoted:k} 个", en = "{msm_pages} public pages saved, {msm_quoted:k} of them quoted" },
]
summary = { zh = "给类目团队的招商“第一周作业”：行业洞察、本地品牌、经销商和连锁店的打分商家池、按品类的资质清单、入驻跟进表、头 30 天的 SQL 和触达模板。评的是这份材料里的每条事实：引文要在存档页面里，数字要在引文里，商家池的引文里还要有能当证据的词；对不上，构建就停下。", en = "A first-week recruiting pack for a category team: industry insight, a scored pool of local brands, distributors and retailers, a per-category approvals checklist, an onboarding tracker, first-30-days SQL and outreach templates. What is evaluated is every fact in the pack: the quote must be in the saved page, the number in the quote, and a pool quote must contain a word that counts as evidence; if not, the build stops." }
core_link = { zh = "每条事实都用 evidence-check 0.5.0 的核对脚本对回存档原文；头 30 天的 SQL 沿用有据经营分析的周指标做法。", en = "Every fact is checked against its saved page with the evidence-check 0.5.0 script; the first-30-days SQL follows Grounded Business Review's weekly metrics." }
models = { zh = "没有调用模型：读页面、打分、核对和出表都由脚本完成。", en = "No model is called: reading pages, scoring, checking and building the tables are all done by scripts." }
iteration = { zh = ["打分规则：第一版在填写任何一行之前就换成第二版，重点改成“在别处已经卖得好、内容电商上还没做大”的本地商家；变更记录写在规则文件里，规则一改，构建就拒绝打分。", "核对：引文不在页面里、数字不在引文里、引文里没有能当证据的词（例如认证要有 SIRIM、MCMC 或能源委员会），构建都会停下。"], en = ["Scoring rules: version one was replaced by version two before any row was filled, refocusing on local merchants that already sell well elsewhere but are not yet large on content commerce; the change log is in the rules file, and the build refuses to score if the rules change.", "Checks: the build stops when a quote is not in its page, a number is not in its quote, or a quote lacks a word that counts as evidence (a certification must name SIRIM, MCMC or the Energy Commission, for example)."] }
conclusion = { zh = "招商名单的每条理由都能当面翻到原文：先联系谁、为什么、要什么资质，都有公开出处。规则先写死再打分，排序就不会跟着手上的名单走；拿不到的信息照实写“公开来源里没找到”，第一次联系前再查。", en = "Every reason on the recruiting list opens to its source: who to contact first, why, and which approvals apply. Rules fixed before scoring keep the ranking from bending to the list at hand; what public sources lack is written as \"not found in public sources\" and checked before the first call." }
short_name = { zh = "招商样本", en = "Merchant sourcing" }
card_title = { zh = "先招哪些商家，每条理由都有出处", en = "Which merchants to recruit first, every reason sourced" }
assumed = { zh = "以为现成的店铺排行工具就能定招商名单", en = "Expected existing shop-ranking tools to settle the recruiting list" }
showed = { zh = "它们只排已在平台上的商家；公开来源补出 {msm_merchants} 家的打分商家池", en = "They rank only merchants already on a platform; public sources fill a scored pool of {msm_merchants}" }
result_line = { zh = "带出处的说法逐字对回原文 {msm_claims}；商家池 {msm_merchants} 家，{msm_cells} 个格子各有核对过的原文", en = "Sourced claims matched word for word: {msm_claims}; a pool of {msm_merchants} merchants, {msm_cells} cells each with a checked quote" }
key_numbers = [{ metric = "msm_claims", label = { zh = "带出处的说法对回存档原文", en = "Sourced claims matched to saved pages" } }, { metric = "msm_cells", label = { zh = "商家池里核对过原文的格子", en = "Pool cells with a checked quote" } }, { metric = "msm_local", label = { zh = "找到马来西亚公司或经销商的商家", en = "Merchants with a Malaysian company or distributor found" } }]
