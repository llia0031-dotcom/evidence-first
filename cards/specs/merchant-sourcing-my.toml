  id = "msm_cells"
  label = { zh = "有核对过原文的格子", en = "Cells with a checked quote" }
  extractor = "text_value"
  args = { path = "merchant-sourcing-my-public/results/SUMMARY.md", label = "- checked values (each with a quote found in the saved page):" }
  direction = "none"

  [[eval.metric]]
  id = "msm_merchants"
