[[eval]]
id = "regression"
name = { zh = "回归测试：分流提示词 v1 对 v2（332 个回放请求）", en = "Regression test: triage prompt v1 vs v2 (332 replayed requests)" }
date = "2026-11-15"
data = { zh = "有据审核的留出集、难题集和真实广告存下的答案，按请求回放；自己写的题，答案在写题时定好；真实广告的答案来自监管机构和法院的裁决。v2 的采用标准跑前预注册。", en = "Stored answers to Grounded Review's held-out, harder and real-ad items, replayed request by request; answers to the written items were fixed when they were written, and the real ads' answers come from regulators' and courts' rulings. v2's adoption criteria were preregistered." }
items = { zh = "332 个请求，每个版本 1 遍", en = "332 requests, 1 run per version" }
runs = { zh = "每个版本 1 遍", en = "1 run per version" }
setup = { zh = "claude-haiku-5-5，批量接口（半价）", en = "claude-haiku-5-5, Message Batches API (half price)" }
frozen = { zh = "`docs/PREREGISTRATION.md`", en = "`docs/PREREGISTRATION.md`" }
takeaway = { zh = "v2 少放过判错的广告，代价是送人工多得多；四条采用标准都满足。", en = "v2 lets fewer wrong decisions through at the cost of far more human review; all four adoption criteria are met." }

  [[eval.metric]]
  id = "v1_escaped"
  label = { zh = "判错又自动生效（v1）", en = "Wrong decisions that went live (v1)" }
  extractor = "pl_version"
  args = { path = "evidence-pipeline-public/data/versions.json", version = "v1", field = "escaped" }
  direction = "lower"

  [[eval.metric]]
  id = "v2_escaped"
  label = { zh = "判错又自动生效（v2）", en = "Wrong decisions that went live (v2)" }
  extractor = "pl_version"
  args = { path = "evidence-pipeline-public/data/versions.json", version = "v2", field = "escaped" }
  direction = "lower"

  [[eval.metric]]
  id = "v1_review"
  label = { zh = "送人工复核（v1）", en = "Sent to human review (v1)" }
  extractor = "pl_version"
  args = { path = "evidence-pipeline-public/data/versions.json", version = "v1", field = "queued" }
  direction = "none"

  [[eval.metric]]
  id = "v2_review"
  label = { zh = "送人工复核（v2）", en = "Sent to human review (v2)" }
  extractor = "pl_version"
  args = { path = "evidence-pipeline-public/data/versions.json", version = "v2", field = "queued" }
  direction = "none"

  [[eval.metric]]
  id = "v1_right"
  label = { zh = "判对（v1）", en = "Decisions right (v1)" }
  extractor = "pl_version"
  args = { path = "evidence-pipeline-public/data/versions.json", version = "v1", field = "decision_right" }

  [[eval.metric]]
  id = "v2_right"
  label = { zh = "判对（v2）", en = "Decisions right (v2)" }
  extractor = "pl_version"
  args = { path = "evidence-pipeline-public/data/versions.json", version = "v2", field = "decision_right" }

[[eval]]
id = "canary"
name = { zh = "灰度回放：按事先写好的回滚规则（回放，不是真实用户）", en = "Canary replay under the rules written beforehand (a replay, not real users)" }
date = "2026-11-15"
data = { zh = "同一批请求按周回放，按请求编号的哈希分给 v1（线上）和 v2（灰度）；回滚规则跑前写好：灰度组漏网比例更高、复核率高出 15 个百分点以上、判对率低 5 个百分点以上、费用比线上组高出百分之十五以上，任一条触发就回滚。", en = "The same requests replayed week by week, split between v1 (production) and v2 (canary) by a hash of the request id; rollback rules written beforehand: a higher share of wrong decisions let through, a review rate more than 15 points higher, accuracy more than 5 points lower, or cost more than fifteen percent higher." }
items = { zh = "四周，共 332 个请求", en = "Four weeks, 332 requests" }
runs = { zh = "回放 1 遍", en = "1 replay" }
setup = { zh = "不调用模型，回放存下的答案", en = "No model calls; stored answers replayed" }
frozen = { zh = "`docs/PREREGISTRATION.md` 和 `docs/CANARY-POSTMORTEM.md`", en = "`docs/PREREGISTRATION.md` and `docs/CANARY-POSTMORTEM.md`" }
