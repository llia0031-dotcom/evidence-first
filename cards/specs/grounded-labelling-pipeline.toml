frozen = { zh = "`docs/KBQA-PLAN.md`", en = "`docs/KBQA-PLAN.md`" }
takeaway = { zh = "多数题答对，库里没有的题大多说了“没有”，引文几乎全部核对通过。事先写好的预测里只有中文检索那一条没成立；库里有答案却说“没有”的，都是检索没找到条款，不是模型编造。", en = "Most questions were answered right, most questions the library cannot answer got \"not in the library\", and almost every quote passed the check. Of the predictions written beforehand only the one on Chinese retrieval failed; every \"not in the library\" on an answerable question came from retrieval missing the clause, not from an invented answer." }

