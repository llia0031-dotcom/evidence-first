[[eval]]
id = "regression"
name = { zh = "回归测试：分流提示词 v1 对 v2（332 个回放请求）", en = "Regression test: triage prompt v1 vs v2 (332 replayed requests)" }
date = "2026-11-15"
data = { zh = "有据审核的留出集、难题集和真实广告存下的答案，按请求回放；每个请求的答案在写题时定好。v2 的采用标准跑前预注册。", en = "Stored answers to Grounded Review's held-out, harder and real-ad items, replayed request by request; each request's answer was fixed when the item was written. v2's adoption criteria were preregistered." }
items = { zh = "332 个请求，每个版本 1 遍", en = "332 requests, 1 run per version" }
runs = { zh = "每个版本 1 遍", en = "1 run per version" }
setup = { zh = "claude-haiku-5-5，批量接口（半价）", en = "claude-haiku-5-5, Message Batches API (half price)" }
frozen = { zh = "`docs/PREREGISTRATION.md`", en = "`docs/PREREGISTRATION.md`" }
takeaway = { zh = "v2 少放过判错的广告，代价是送人工多得多；四条采用标准都满足。", en = "v2 lets fewer wrong decisions through at the cost of far more human review; all four adoption criteria are met." }

  [[eval.metric]]
  id = "v1_escaped"
  label = { zh = "判错又自动生效（v1）", en = "Wrong decisions that went live (v1)" }
  extractor = "pl_version"
  args = { path = "evidence-pipeline-public/data/versions.json", version = "v1", field = "escaped" }
  direction = "lower"

  [[eval.metric]]
  id = "v2_escaped"
  label = { zh = "判错又自动生效（v2）", en = "Wrong decisions that went live (v2)" }
  extractor = "pl_version"
  args = { path = "evidence-pipeline-public/data/versions.json", version = "v2", field = "escaped" }
  direction = "lower"

  [[eval.metric]]
  id = "v1_review"
  label = { zh = "送人工复核（v1）", en = "Sent to human review (v1)" }
  extractor = "pl_version"
  args = { path = "evidence-pipeline-public/data/versions.json", version = "v1", field = "queued" }
  direction = "none"

  [[eval.metric]]
  id = "v2_review"
  label = { zh = "送人工复核（v2）", en = "Sent to human review (v2)" }
  extractor = "pl_version"
  args = { path = "evidence-pipeline-public/data/versions.json", version = "v2", field = "queued" }
  direction = "none"

  [[eval.metric]]
  id = "v1_right"
  label = { zh = "判对（v1）", en = "Decisions right (v1)" }
  extractor = "pl_version"
  args = { path = "evidence-pipeline-public/data/versions.json", version = "v1", field = "decision_right" }

  [[eval.metric]]
  id = "v2_right"
  label = { zh = "判对（v2）", en = "Decisions right (v2)" }
  extractor = "pl_version"
  args = { path = "evidence-pipeline-public/data/versions.json", version = "v2", field = "decision_right" }

[[eval]]
id = "canary"
name = { zh = "灰度回放：按事先写好的回滚规则（回放，不是真实用户）", en = "Canary replay under the rules written beforehand (a replay, not real users)" }
date = "2026-11-15"
data = { zh = "同一批请求按周回放，按请求编号的哈希分给 v1（线上）和 v2（灰度）；回滚规则跑前写好：灰度组漏网比例更高、复核率高出 15 个百分点以上、判对率低 5 个百分点以上、费用比线上组高出百分之十五以上，任一条触发就回滚。", en = "The same requests replayed week by week, split between v1 (production) and v2 (canary) by a hash of the request id; rollback rules written beforehand: a higher share of wrong decisions let through, a review rate more than 15 points higher, accuracy more than 5 points lower, or cost more than fifteen percent higher." }
items = { zh = "四周，共 332 个请求", en = "Four weeks, 332 requests" }
runs = { zh = "回放 1 遍", en = "1 replay" }
setup = { zh = "不调用模型，回放存下的答案", en = "No model calls; stored answers replayed" }
frozen = { zh = "`docs/PREREGISTRATION.md` 和 `docs/CANARY-POSTMORTEM.md`", en = "`docs/PREREGISTRATION.md` and `docs/CANARY-POSTMORTEM.md`" }
takeaway = { zh = "第一步就触发了三条规则，回滚，线上留在 v1。复盘发现两条规则写错：复核率那一条和 v2 的目的矛盾，比例在灰度组只有 10 个请求时就比了。改好的规则是看过结果之后写的，在同一批请求上再回放能放到全量，但这证明不了什么，要在新流量上重新灰度。", en = "Three rules fired at the first step, it rolled back, and production stayed at v1. The review found two wrong rules: the review-rate rule contradicted v2's purpose, and rates were compared when the canary had only 10 requests. The fixed rules were written after seeing the results; replayed on the same requests they reach full release, which proves nothing; a canary on new traffic is needed." }

  [[eval.metric]]
  id = "canary_rollback_share"
  label = { zh = "触发回滚时的灰度比例", en = "Canary share when a rule fired" }
  extractor = "pl_canary_rollback_share"
  args = { path = "evidence-pipeline-public/data/canary.json" }
  direction = "none"

  [[eval.metric]]
  id = "canary_staging_escaped"
  label = { zh = "那一周灰度组判错又生效", en = "That week, canary: wrong decisions that went live" }
  extractor = "pl_canary_step"
  args = { path = "evidence-pipeline-public/data/canary.json", share = 10, arm = "staging", field = "escaped" }
  direction = "lower"

  [[eval.metric]]
  id = "canary_prod_escaped"
  label = { zh = "那一周线上组判错又生效", en = "That week, production: wrong decisions that went live" }
  extractor = "pl_canary_step"
  args = { path = "evidence-pipeline-public/data/canary.json", share = 10, arm = "production", field = "escaped" }
  direction = "lower"


[[eval]]
id = "round2"
name = { zh = "第二轮灰度：改好的规则，新写的广告（回放，不是真实用户）", en = "Canary round two: fixed rules on newly written ads (a replay, not real users)" }
date = "2026-11-16"
data = { zh = "新写 120 条文字广告（中英各 60），每条两遍，共 240 个请求；改好的回滚规则和预测跑前预注册。灰度分三步放到全量，灰度组从开始累计和线上组比。", en = "120 newly written text ads (60 Chinese, 60 English), two runs each, 240 requests; the fixed rollback rules and predictions were preregistered. The canary went to full release in three steps, comparing the canary's cumulative requests with production." }
items = { zh = "240 个请求", en = "240 requests" }
runs = { zh = "每条广告两遍，每个版本 1 遍", en = "Two runs per ad, 1 run per version" }
setup = { zh = "claude-haiku-5-5，批量接口（半价）", en = "claude-haiku-5-5, Message Batches API (half price)" }
frozen = { zh = "`docs/PREREGISTRATION-ROUND2.md`", en = "`docs/PREREGISTRATION-ROUND2.md`" }
takeaway = { zh = "三步都没触发回滚，v2 上线。两版在这批广告上都接近全对，所以这一轮只说明放量流程走通了；v2 少漏错判的证据仍来自第一轮。", en = "No rule fired at any step and v2 went live. Both versions were almost always right on these ads, so this round shows the release process works; the evidence that v2 lets fewer errors through still comes from round one." }

  [[eval.metric]]
  id = "r2_final_share"
  label = { zh = "没有回滚、最后放到的灰度比例", en = "Canary share reached without a rollback" }
  extractor = "pl_canary_final_share"
  args = { path = "evidence-pipeline-public/data/canary-round2.json" }
  direction = "none"


  [[eval.metric]]
  id = "r2_v1_right"
  label = { zh = "判对（v1）", en = "Decisions right (v1)" }
  extractor = "pl_version"
  args = { path = "evidence-pipeline-public/data/versions-round2.json", version = "v1", field = "decision_right" }

  [[eval.metric]]
  id = "r2_v2_right"
  label = { zh = "判对（v2）", en = "Decisions right (v2)" }
  extractor = "pl_version"
  args = { path = "evidence-pipeline-public/data/versions-round2.json", version = "v2", field = "decision_right" }

  [[eval.metric]]
  id = "r2_v2_review"
  label = { zh = "送人工复核（v2）", en = "Sent to human review (v2)" }
  extractor = "pl_version"
  args = { path = "evidence-pipeline-public/data/versions-round2.json", version = "v2", field = "queued" }
  direction = "none"

  [[eval.metric]]
  id = "r2_canary_escaped"
  label = { zh = "放到全量时，灰度组累计判错又生效", en = "At full release, canary: wrong decisions that went live (cumulative)" }
  extractor = "pl_canary_step"
  args = { path = "evidence-pipeline-public/data/canary-round2.json", share = 100, arm = "staging", field = "escaped" }
  direction = "lower"

  [[eval.metric]]
  id = "r2_prod_escaped"
  label = { zh = "放到全量时，线上组累计判错又生效", en = "At full release, production: wrong decisions that went live (cumulative)" }
  extractor = "pl_canary_step"
  args = { path = "evidence-pipeline-public/data/canary-round2.json", share = 100, arm = "production", field = "escaped" }
  direction = "lower"

  [[eval.metric]]
  id = "r2_cost_ratio"
  label = { zh = "v2 每个请求的费用，是 v1 的", en = "v2 cost per request, relative to v1" }
  extractor = "json_ratio"
  args = { path = "evidence-pipeline-public/data/versions-round2.json", num_at = ["stats", "v2", "cost_per_request"], den_at = ["stats", "v1", "cost_per_request"], unit = "x", decimals = 4 }
  direction = "lower"
  note = { zh = "预测是不超过 1.05 倍，这一条没成立", en = "predicted at most 1.05×; this prediction did not hold" }

[[eval]]
id = "lark"
name = { zh = "Lark 里的工作流：平台 AI Agent 步骤（25 条中文广告）", en = "The workflow in Lark: the platform AI Agent step (25 Chinese ads)" }
date = "2026-11-16"
data = { zh = "在 Lark 多维表格里加广告，平台自带的 AI Agent 步骤判断并写回表格，引文核对由脚本补；拿不准、核对没过的进复核队列。25 条中文文字广告，答案写题时定好；评测计划先写再跑。", en = "Ads added to a Lark Base are decided by the platform's AI Agent step and written back; quote checks are added by script, and unsure or failed answers go to the review queue. 25 Chinese text ads with answers fixed at writing; the plan was written before the run." }
items = { zh = "25 条广告，每条一遍", en = "25 ads, one run each" }
runs = { zh = "1 遍", en = "1 run" }
setup = { zh = "Lark 多维表格 AI Agent 步骤（Seed 1.8）", en = "Lark Base AI Agent step (Seed 1.8)" }
frozen = { zh = "`docs/LARK-AGENT-PLAN.md`", en = "`docs/LARK-AGENT-PLAN.md`" }
takeaway = { zh = "工作流在 Lark 里跑通：每条都写回、都判对；两条把条款里不相邻的几句拼成一句当引文，被脚本拦下送了人工。平台模型一次也没说拿不准，而分流用的模型在存档答案里常说，所以换模型后复核率要重新量。", en = "The workflow runs in Lark: every ad was written back and decided right; two answers stitched non-adjacent clause sentences into one quote and the script sent them to review. The platform model never said it was unsure, while the triage model often did in its stored answers, so the review rate must be measured again after a model change." }

  [[eval.metric]]
  id = "lark_written"
  label = { zh = "写回表格", en = "Written back to the table" }
  extractor = "json_counts"
  args = { path = "evidence-pipeline-public/data/lark-agent-eval1.json", at = ["stats"], num = "written", den = "requests" }

  [[eval.metric]]
  id = "lark_right"
  label = { zh = "判对", en = "Decisions right" }
  extractor = "json_counts"
  args = { path = "evidence-pipeline-public/data/lark-agent-eval1.json", at = ["stats"], num = "right", den = "requests" }

  [[eval.metric]]
  id = "lark_quote_failed"
  label = { zh = "引文核对没过、送了人工", en = "Quote check failed, sent to review" }
  extractor = "json_counts"
  args = { path = "evidence-pipeline-public/data/lark-agent-eval1.json", at = ["stats"], num = "quotes_failed", den = "requests" }
  direction = "none"

  [[eval.metric]]
  id = "lark_unsure"
  label = { zh = "平台模型说“拿不准”", en = "Platform model said it was unsure" }
  extractor = "json_counts"
  args = { path = "evidence-pipeline-public/data/lark-agent-eval1.json", at = ["stats"], num = "unsure", den = "requests" }
  direction = "none"

  [[eval.metric]]
  id = "ref_unsure"
  label = { zh = "参照：分流模型存档答案里说“拿不准”", en = "Reference: triage model's stored answers saying unsure" }
  extractor = "json_counts"
  args = { path = "evidence-pipeline-public/data/lark-agent-eval1.json", at = ["reference_v2_haiku"], num = "unsure", den = "requests" }
  direction = "none"

[[eval]]
id = "retrieval"
name = { zh = "政策库检索：正确条款进前三（124 条违规标注）", en = "Policy retrieval: right clause in the top three (124 labelled violations)" }
date = "2026-11-15"
data = { zh = "有据审核的 32 条政策条款，用它自带的 BM25 检索；每条违规标注一次查询，哪些条款算对写在标注里。比较用广告原文搜和用模型的答案搜。", en = "Grounded Review's 32 policy clauses searched with its BM25; one query per labelled violation, with the right clauses fixed in the labels. Searching with the ad text is compared with searching with the model's answer." }
items = { zh = "124 条违规标注", en = "124 labelled violations" }
runs = { zh = "确定性检索，1 遍", en = "Deterministic retrieval, 1 run" }
setup = { zh = "不调用模型，用 v1 第一遍存下的答案", en = "No model calls; v1's stored first-run answers" }

  [[eval.metric]]
  id = "ret_ad_hit3"
  label = { zh = "用广告原文搜，正确条款进前三", en = "Searching with the ad text: right clause in the top three" }
  extractor = "pl_retrieval"
  args = { path = "evidence-pipeline-public/data/retrieval.csv", query = "ad" }

  [[eval.metric]]
  id = "ret_answer_hit3"
  label = { zh = "用模型的答案搜，正确条款进前三", en = "Searching with the model's answer: right clause in the top three" }
  extractor = "pl_retrieval"
  args = { path = "evidence-pipeline-public/data/retrieval.csv", query = "answer" }

[[limitation]]
text = { zh = "流量是评测题的回放，不是真实用户；复核结论用的是题目定好的答案，没有真的审核员。", en = "Traffic replays test items rather than real users, and reviewer decisions are the items' fixed answers, not real reviewers." }
advice = { zh = "上线后按版本统计真实请求的漏网错判和复核量，抽检结果回流成回归题。", en = "After launch, track wrong decisions let through and review volume per version on real requests, and feed QA samples back as regression items." }

[[limitation]]
text = { zh = "v2 少放过判错，但送人工从 {v1_review} 涨到 {v2_review}，很多是清楚的广告也说“拿不准”。", en = "v2 lets fewer wrong decisions through, but human review rose from {v1_review} to {v2_review}, often on clear ads the model called unsure." }
advice = { zh = "下一版试着减少清楚广告上的“拿不准”，同样先过回归测试再灰度。", en = "Next, reduce \"unsure\" on clear ads, again through a regression test before a canary." }

[[limitation]]
text = { zh = "第二轮在新流量上放到全量，但两版在这批广告上都接近全对，没有再证明 v2 能少漏错判；v2 的好处仍来自第一轮。", en = "Round two reached full release on new traffic, but both versions were almost always right on those ads, so it did not show again that v2 lets fewer errors through; that evidence still comes from round one." }
advice = { zh = "再找 v1 会漏判的新广告（例如更长、更含糊的），在同样的规则下比一次。", en = "Find new ads that v1 misses (longer or vaguer ones) and compare again under the same rules." }

[[limitation]]
text = { zh = "Lark 里的平台模型一次也没说拿不准（{lark_unsure}），分流模型的存档答案里却有 {ref_unsure} 说了；聊天机器人只实测了一条。", en = "The Lark platform model never said it was unsure ({lark_unsure}), while the triage model did in {ref_unsure} stored answers; the chat bot was tested on one ad only." }
advice = { zh = "换模型后先重新量复核率，再调“拿不准”的门槛；机器人上线前用一批广告测。", en = "After a model change, measure the review rate again before tuning the unsure threshold; test the bot on a batch before launch." }

