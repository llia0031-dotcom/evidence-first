  id = "kb_zh_hit5"
  label = { zh = "中文问题：算对的条款进前 5（BM25）", en = "Chinese questions: right clause in the top five (BM25)" }
  extractor = "pl_retrieval_method"
  args = { path = "evidence-pipeline-public/data/retrieval-methods.csv", set = "questions", query = "question", lang = "zh", method = "bm25", col = "hit@5" }
  note = { zh = "预测是百分之九十以上，这一条没成立；按题数算，每道题两遍的检索结果相同", en = "predicted ninety percent or more; this prediction did not hold; counted per question, since retrieval is the same on both runs" }

[[eval]]
id = "retrieval2"
name = { zh = "英文条款检索换成本机向量模型（选方法时没用过的标注）", en = "English clause retrieval on a local embedding model (labels not used to choose it)" }
date = "2026-11-17"
data = { zh = "先在第一轮的标注上比较几种检索方式选定，再在选的时候没用过的第二轮、第三轮标注上验；用模型的答案去搜，只算英文。中文还用 BM25。", en = "Several retrieval methods were compared on the round-one labels to choose one, then checked on the round-two and round-three labels that were not used for the choice; queries are the model's answers, English only. Chinese stays on BM25." }
items = { zh = "第二轮 40 条、第三轮 23 条英文违规标注", en = "40 round-two and 23 round-three English violation labels" }
runs = { zh = "确定性检索，1 遍", en = "Deterministic retrieval, 1 run" }
setup = { zh = "Qwen3-Embedding-0.6B（量化版，fastembed），本机运行，不调用接口", en = "Qwen3-Embedding-0.6B (quantised, fastembed), run locally, no API calls" }
takeaway = { zh = "两批没用过的标注上，英文正确条款进前三都提高了；第一轮是选方法用的，数字偏乐观，不拿来报告。", en = "On both sets of unused labels the right English clause reached the top three more often; round one was used to choose the method, so its numbers are optimistic and not reported." }

  [[eval.metric]]
  id = "ret_r2_en_bm25"
  label = { zh = "第二轮英文：正确条款进前三（BM25）", en = "Round two, English: right clause in the top three (BM25)" }
  extractor = "pl_retrieval_method"
  args = { path = "evidence-pipeline-public/data/retrieval-methods.csv", set = "round2 (held out)", query = "answer", lang = "en", method = "bm25" }

  [[eval.metric]]
  id = "ret_r2_en_dense"
  label = { zh = "第二轮英文：正确条款进前三（向量）", en = "Round two, English: right clause in the top three (embedding)" }
  extractor = "pl_retrieval_method"
  args = { path = "evidence-pipeline-public/data/retrieval-methods.csv", set = "round2 (held out)", query = "answer", lang = "en", method = "dense", model = "Qwen3-Embedding-0.6B-Q" }

  [[eval.metric]]
  id = "ret_r3_en_bm25"
  label = { zh = "第三轮英文：正确条款进前三（BM25）", en = "Round three, English: right clause in the top three (BM25)" }
  extractor = "pl_retrieval_method"
  args = { path = "evidence-pipeline-public/data/retrieval-methods.csv", set = "round3 (held out)", query = "answer", lang = "en", method = "bm25" }

  [[eval.metric]]
  id = "ret_r3_en_dense"
  label = { zh = "第三轮英文：正确条款进前三（向量）", en = "Round three, English: right clause in the top three (embedding)" }
  extractor = "pl_retrieval_method"
  args = { path = "evidence-pipeline-public/data/retrieval-methods.csv", set = "round3 (held out)", query = "answer", lang = "en", method = "dense", model = "Qwen3-Embedding-0.6B-Q" }

[[eval]]
id = "lark2"
name = { zh = "Lark 两条工作流：判断和复核（60 条中文广告，两遍）", en = "Two Lark workflows: judging and review (60 Chinese ads, two passes)" }
date = "2026-11-17"
data = { zh = "第一条工作流判断、逐段核对引文、分流并写明原因；第二条把复核结论写回广告，分歧记进回归题。用第二轮的 60 条中文文字广告跑两遍：第一遍照跑之前写好的计划，第二遍是看过第一遍、改了引文核对之后再跑的，不算预注册。脚本核对和平台核对并排比。", en = "The first workflow judges, checks every quote, routes the ad and records why; the second writes the review back and records disagreements as regression items. 60 Chinese round-two text ads ran twice: the first pass followed the plan written beforehand, the second ran after seeing the first and fixing the quote check, so it is not preregistered. The script's check and the platform's check are compared side by side." }
items = { zh = "60 条广告", en = "60 ads" }
runs = { zh = "2 遍（第二遍改过才跑）", en = "2 passes (the second after the fix)" }
setup = { zh = "Lark 多维表格工作流；AI Agent 步骤用平台模型 Seed 1.8，平台免费额度", en = "Lark Base workflows; the AI Agent step uses the platform model Seed 1.8 on the free allowance" }
frozen = { zh = "`docs/LARK-AGENT-PLAN.md` 第 8 节（第一遍）", en = "`docs/LARK-AGENT-PLAN.md` section 8 (first pass)" }
takeaway = { zh = "第一遍平台的逐字查找被条款里的换行挡住，两种核对有不一致的，不一致的都是多送了人工，没有漏送；把换行处理好以后，第二遍两种核对和去向全部一致，复核结论都写回了。第二遍是看过第一遍才改的，只说明改法有效，不算事先的预测。", en = "On the first pass line breaks in the clauses blocked the platform's exact-text search, so the two checks disagreed on some ads, each time sending an extra ad to people and never letting one through; with line breaks handled, the second pass agreed on every check and route, and every review was written back. The second pass came after seeing the first, so it shows the fix works rather than testing a prediction." }

  [[eval.metric]]
  id = "lark2_agree"
  label = { zh = "第一遍：两种引文核对一致", en = "First pass: the two quote checks agree" }
  extractor = "json_counts"
  args = { path = "evidence-pipeline-public/data/lark-agent-eval2.json", at = ["stats"], num = "quote_checks_agree", den = "requests" }

  [[eval.metric]]
  id = "lark2_escaped"
  label = { zh = "第一遍：判错又没送人工", en = "First pass: wrong decisions not sent to people" }
  extractor = "json_counts"
  args = { path = "evidence-pipeline-public/data/lark-agent-eval2.json", at = ["stats"], num = "escaped", den = "requests" }
  direction = "lower"

  [[eval.metric]]
  id = "lark3_agree"
  label = { zh = "第二遍：两种引文核对一致", en = "Second pass: the two quote checks agree" }
  extractor = "json_counts"
  args = { path = "evidence-pipeline-public/data/lark-agent-eval3.json", at = ["stats"], num = "quote_checks_agree", den = "requests" }

  [[eval.metric]]
  id = "lark3_routes"
  label = { zh = "第二遍：平台的去向和规则一致", en = "Second pass: the platform's route matches the rules" }
  extractor = "json_counts"
  args = { path = "evidence-pipeline-public/data/lark-agent-eval3.json", at = ["stats"], num = "routes_agree", den = "requests" }

  [[eval.metric]]
  id = "lark3_written_back"
  label = { zh = "第二遍：复核结论写回广告", en = "Second pass: reviews written back to the ad" }
  extractor = "json_counts"
  args = { path = "evidence-pipeline-public/data/lark-agent-eval3.json", at = ["stats"], num = "written_back", den = "reviewed" }

[[limitation]]
text = { zh = "流量是评测题的回放，不是真实用户；复核结论用的是题目定好的答案，没有真的审核员。", en = "Traffic replays test items rather than real users, and reviewer decisions are the items' fixed answers, not real reviewers." }
advice = { zh = "上线后按版本统计真实请求的漏网错判和复核量，抽检结果回流成回归题。", en = "After launch, track wrong decisions let through and review volume per version on real requests, and feed QA samples back as regression items." }

[[limitation]]
text = { zh = "v2 少放过判错，但送人工从 {v1_review} 涨到 {v2_review}，很多是清楚的广告也说“拿不准”。", en = "v2 lets fewer wrong decisions through, but human review rose from {v1_review} to {v2_review}, often on clear ads the model called unsure." }
advice = { zh = "第 3 版放宽“拿不准”，要人来定的也少送了；第 4 版两头都好了，判错时却更常说“确定”。下一版要同时守住三头：清楚的少送、要人定的不少送、判错的不放过，同样先过回归和新题再灰度。", en = "Version 3 relaxed \"unsure\" and sent fewer ads that need a human to people; version 4 improved both ends but was more often sure when wrong. The next version has to hold all three: fewer clear ads sent, no fewer ads that need a human, and no wrong decisions let through, again through a regression and new items before a canary." }

[[limitation]]
text = { zh = "第二轮在新流量上放到全量，但两版在这批广告上都接近全对，没有再证明 v2 能少漏错判；v2 的好处仍来自第一轮。", en = "Round two reached full release on new traffic, but both versions were almost always right on those ads, so it did not show again that v2 lets fewer errors through; that evidence still comes from round one." }
advice = { zh = "再找 v1 会漏判的新广告（例如更长、更含糊的），在同样的规则下比一次。", en = "Find new ads that v1 misses (longer or vaguer ones) and compare again under the same rules." }

[[limitation]]
text = { zh = "Lark 里的平台模型一次也没说拿不准（{lark_unsure}），分流模型的存档答案里却有 {ref_unsure} 说了；机器人问答只有测试，没有真实使用量。", en = "The Lark platform model never said it was unsure ({lark_unsure}), while the triage model did in {ref_unsure} stored answers; the bot's Q&A has only been tested, with no real usage." }
advice = { zh = "换模型后先重新量复核率，再调“拿不准”的门槛；机器人先用一批问题测，再看真实的使用记录。", en = "After a model change, measure the review rate again before tuning the unsure threshold; test the bot on a batch of questions, then read its real usage log." }

[[limitation]]
text = { zh = "中文问题的检索偏弱：算对的条款进前 5 只有 {kb_zh_hit5}，库里有答案却说“没有”的都出在检索没找到。", en = "Retrieval for Chinese questions is weak: the right clause was in the top five for only {kb_zh_hit5}, and every \"not in the library\" on an answerable question came from retrieval missing it." }
advice = { zh = "中文检索也试本机向量或混合检索，先在选方法时没用过的问题上验。", en = "Try embedding or hybrid retrieval for Chinese too, checked first on questions not used to choose the method." }

