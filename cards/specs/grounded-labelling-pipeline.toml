team = "Liang Liyuan"
stack = { zh = "Python、Pandas、BM25、evidence-check、Lark 多维表格（AI Agent 步骤）、批量接口", en = "Python, Pandas, BM25, evidence-check, Lark Base (AI Agent step), Message Batches API" }
did = { zh = "我把有据审核做成一条四步审核工作流：模型判断，evidence-check 核对引文，核对没过或模型拿不准的进人工复核队列，复核结果回流成回归题；另加政策库检索评测、提示词版本、灰度和回滚规则、每周报告和上线检查清单，复核队列可以同步到 Lark 多维表格。", en = "I turned Grounded Review into a four-step review workflow: the model decides, evidence-check verifies the quotes, ads that fail the check or that the model is unsure of go to a human review queue, and reviewed ads come back as regression items; plus a policy retrieval evaluation, prompt versions, canary and rollback rules, weekly reports and a launch checklist, with the review queue syncable to Lark Base." }
name = { zh = "有据标注流水线", en = "Grounded Labelling Pipeline" }
problem = { zh = "能核对的回答，怎么变成团队每天用的审核工作流：拿不准的交给人复核，提示词能灰度、能回滚", en = "How checkable answers become a review workflow a team runs daily: unsure cases go to people, and prompts ship with canary release and rollback" }
primary_metric = { zh = "漏网错判（判错又自动生效）；送人工复核的比例；判对率", en = "Wrong decisions that went live; share sent to human review; decisions right" }
headline = [
  { zh = "判错又自动生效：v1 {v1_escaped} → v2 {v2_escaped}；送人工复核 {v1_review} → {v2_review}", en = "Wrong decisions that went live: v1 {v1_escaped} → v2 {v2_escaped}; sent to review {v1_review} → {v2_review}" },
  { zh = "第一轮按事先写好的规则，灰度放到 {canary_rollback_share} 就回滚了；规则写错两处，已复盘", en = "Round one rolled back at {canary_rollback_share} under the rules written beforehand; two rules were wrong, now reviewed" },
  { zh = "第二轮用改好的规则，在新写的广告上放到 {r2_final_share}，没有回滚，v2 上线", en = "Round two, with the fixed rules on newly written ads, reached {r2_final_share} without a rollback; v2 is live" },
]
summary = { zh = "一条围绕有据审核搭的审核和标注工作流。每条广告先由模型判断并引原文，再用 evidence-check 核对引文，核对没过、读不出或模型拿不准的进人工复核队列，复核结果和模型不同的变成新的回归题。提示词按版本管理，新版本先做回归测试，再按事先写好的规则灰度放量，触发就回滚。流量是有据审核评测题的回放，不是真实用户；回放里的复核结论就是题目定好的答案。", en = "A review and labelling workflow built around Grounded Review. Each ad is decided by the model with quotes, the quotes are checked by evidence-check, and ads that fail the check, cannot be read or that the model is unsure of go to a human review queue; reviewed ads that differ from the model become new regression items. Prompts are versioned; a new version passes a regression test, then a canary release under rules written beforehand, and rolls back when a rule fires. Traffic is a replay of Grounded Review's test items, not real users; reviewer decisions in the replay are the items' fixed answers." }
core_link = { zh = "每段引文都过 evidence-check 的核对脚本；只读地引用有据审核的代码，回放它存下的答案。", en = "Every quote goes through the evidence-check script; it imports Grounded Review's code read-only and replays its stored answers." }
models = { zh = "分流用 claude-haiku-5-5，批量接口；Lark 工作流里的 AI Agent 步骤用平台模型 Seed 1.8，聊天机器人用 claude-haiku-5-5；检索用政策库自带的 BM25。", en = "Triage uses claude-haiku-5-5 through the Message Batches API; the AI Agent step in the Lark workflow uses the platform model Seed 1.8, and the chat bot uses claude-haiku-5-5; retrieval uses the policy library's BM25." }
iteration = { zh = ["v1：四步工作流跑通，但判错的 {v1_escaped} 全部自动生效，引文核对拦不住看错的判断。", "v2：让模型说“拿不准”，拿不准的交人工；判错又自动生效的降到 {v2_escaped}，四条采用标准都满足。", "第一轮灰度：按事先写好的回滚规则，放到 {canary_rollback_share} 就回滚了；复盘发现两条规则写错（和改动目的矛盾、样本太小就比比例）。", "第二轮灰度：改好的规则跑前预注册，在新写的广告上三步放量都没回滚，v2 上线；但两版在这批广告上都接近全对，没有再证明 v2 能少漏错判。", "Lark：在多维表格里搭了同样的工作流，用平台自带的 AI Agent 步骤判断、写回，拿不准的自己进复核队列，引文核对由脚本补；另有一个聊天机器人，实测一条。"], en = ["v1: the four-step workflow runs, but all {v1_escaped} wrong decisions went live; quote checks cannot stop a misread decision.", "v2: the model may say it is unsure, and unsure ads go to people; wrong decisions that went live fell to {v2_escaped}, meeting all four adoption criteria.", "Canary round one: under the rules written beforehand it rolled back at {canary_rollback_share}; the review found two wrong rules (at odds with the change's purpose, and comparing rates on too few requests).", "Canary round two: the fixed rules were preregistered, and on newly written ads all three release steps passed without a rollback, so v2 went live; but both versions were almost always right on these ads, so this did not show again that v2 lets fewer errors through.", "Lark: the same workflow built in a Lark Base, with the platform's AI Agent step deciding and writing back, unsure answers queued for review, and quote checks added by script; plus a chat bot, tested once."] }
conclusion = { zh = "让模型说“拿不准”能减少判错又生效，代价是多送人工；第一轮灰度按规则回滚，暴露的是规则本身写错；改好的规则在新流量上放到全量，v2 上线。v2 少漏错判的证据仍来自第一轮。", en = "Letting the model say it is unsure reduces wrong decisions that go live at the cost of more human review; the first canary rolled back because the rules themselves were wrong; with fixed rules the second canary on new traffic reached full release and v2 went live. The evidence that v2 lets fewer errors through still comes from round one." }
short_name = { zh = "标注流水线", en = "Labelling pipeline" }
card_title = { zh = "把广告审核做成能灰度、能回滚的工作流", en = "Ad review as a workflow with canary release and rollback" }
assumed = { zh = "以为四条采用标准都满足，灰度就能顺利放量", en = "Expected a version meeting all four adoption criteria to roll out smoothly" }
showed = { zh = "第一轮放到 {canary_rollback_share} 就回滚：毛病在规则本身；改好后在新流量上放到了全量", en = "Round one rolled back at {canary_rollback_share} because the rules were wrong; with fixed rules it reached full release on new traffic" }
result_line = { zh = "让模型说“拿不准”后，判错又自动生效的从 {v1_escaped} 降到 {v2_escaped}", en = "Letting the model say it is unsure cut wrong decisions that went live from {v1_escaped} to {v2_escaped}" }
key_numbers = [{ metric = "v2_escaped", label = { zh = "判错又自动生效的（v1 是 {v1_escaped}）", en = "Wrong decisions that went live (v1: {v1_escaped})" } }, { metric = "canary_rollback_share", label = { zh = "第一轮按事先写好的规则，放到这里就回滚了", en = "Round one: share where the written rules rolled it back" } }, { metric = "r2_final_share", label = { zh = "第二轮在新写的广告上灰度，放到了全量", en = "Fixed rules, new ads: share reached without a rollback" } }]
timeline = [
  { date = "2026-11-15", label = { zh = "v1", en = "v1" }, text = { zh = "四步工作流跑通，判错全部自动生效", en = "Workflow runs; every wrong decision went live" }, after = "v1_escaped", adopted = true },
  { date = "2026-11-15", label = { zh = "v2", en = "v2" }, text = { zh = "让模型说“拿不准”，交人工复核", en = "Model may say unsure; people review" }, before = "v1_escaped", after = "v2_escaped", adopted = false },
  { date = "2026-11-15", label = { zh = "灰度回放", en = "Canary replay" }, text = { zh = "按事先写好的规则，第一步就回滚", en = "Rolled back at the first step, by the rules" }, after = "canary_rollback_share", adopted = false },
  { date = "2026-11-15", label = { zh = "复盘", en = "Post-mortem" }, text = { zh = "两条回滚规则写错，已改", en = "Two rollback rules were wrong; fixed" } },
  { date = "2026-11-16", label = { zh = "第二轮灰度", en = "Canary round two" }, text = { zh = "新写的广告上三步都没回滚，v2 上线", en = "No rollback on new ads; v2 went live" }, after = "r2_final_share", adopted = true },
  { date = "2026-11-16", label = { zh = "Lark 工作流", en = "Lark workflow" }, text = { zh = "多维表格里搭好，平台模型判断并写回", en = "Built in a Lark Base; platform model decides" }, after = "lark_right" },
]

