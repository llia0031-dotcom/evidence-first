did = { zh = "我把有据审核做成一条四步审核工作流：模型判断，evidence-check 核对引文，核对没过或模型拿不准的进人工复核队列，复核结果回流成回归题；另加政策库检索评测、只按政策库回答的知识库问答、提示词版本、灰度和回滚规则、用 SQL 取数的每周报告和上线检查清单，并在 Lark 多维表格里搭了判断和复核两条工作流。", en = "I turned Grounded Review into a four-step review workflow: the model decides, evidence-check verifies the quotes, ads that fail the check or that the model is unsure of go to a human review queue, and reviewed ads come back as regression items; plus a policy retrieval evaluation, a knowledge-base Q&A that answers only from the policy library, prompt versions, canary and rollback rules, weekly reports computed in SQL and a launch checklist, with judging and review workflows built in a Lark Base." }
name = { zh = "有据标注流水线", en = "Grounded Labelling Pipeline" }
problem = { zh = "能核对的回答，怎么变成团队每天用的审核工作流：拿不准的交给人复核，提示词能灰度、能回滚", en = "How checkable answers become a review workflow a team runs daily: unsure cases go to people, and prompts ship with canary release and rollback" }
primary_metric = { zh = "漏网错判（判错又自动生效）；送人工复核的比例；判对率", en = "Wrong decisions that went live; share sent to human review; decisions right" }
headline = [
  { zh = "判错又自动生效：v1 {v1_escaped} → v2 {v2_escaped}；送人工复核 {v1_review} → {v2_review}", en = "Wrong decisions that went live: v1 {v1_escaped} → v2 {v2_escaped}; sent to review {v1_review} → {v2_review}" },
  { zh = "第一轮按事先写好的规则，灰度放到 {canary_rollback_share} 就回滚了；规则写错两处，已复盘", en = "Round one rolled back at {canary_rollback_share} under the rules written beforehand; two rules were wrong and have been fixed" },
  { zh = "第二轮用改好的规则，在新写的广告上放到 {r2_final_share}，没有回滚，回放里 v2 转为正式版本", en = "Round two, with the fixed rules on newly written ads, reached {r2_final_share} without a rollback; in the replay v2 became the production version" },
]
summary = { zh = "一条围绕有据审核搭的审核和标注工作流。每条广告先由模型判断并引原文，再用 evidence-check 核对引文，核对没过、读不出或模型拿不准的进人工复核队列，复核结果和模型不同的变成新的回归题。提示词按版本管理，新版本先做回归测试，再按事先写好的规则灰度放量，触发就回滚。另有一个只按政策库回答的知识库问答，库里没有管这件事的条款就说没有。流量是有据审核评测题的回放，不是真实用户；回放里的复核结论就是题目定好的答案。", en = "A review and labelling workflow built around Grounded Review. Each ad is decided by the model with quotes, the quotes are checked by evidence-check, and ads that fail the check, cannot be read or that the model is unsure of go to a human review queue; reviewed ads that differ from the model become new regression items. Prompts are versioned; a new version passes a regression test, then a canary release under rules written beforehand, and rolls back when a rule fires. A knowledge-base Q&A answers only from the policy library and says so when no clause covers the question. Traffic is a replay of Grounded Review's test items, not real users; reviewer decisions in the replay are the items' fixed answers." }
core_link = { zh = "每段引文都过 evidence-check 的核对脚本；只读地引用有据审核的代码，回放它存下的答案。", en = "Every quote goes through the evidence-check script; it imports Grounded Review's code read-only and replays its stored answers." }
models = { zh = "分流和知识库问答用 claude-haiku-5-5（评测走批量接口）；Lark 工作流里的 AI Agent 步骤用平台模型 Seed 1.8，聊天机器人用 claude-haiku-5-5；中文条款检索用政策库自带的 BM25，英文用本机向量模型 Qwen3-Embedding-0.6B。", en = "Triage and the knowledge-base Q&A use claude-haiku-5-5 (evaluations through the Message Batches API); the AI Agent step in the Lark workflows uses the platform model Seed 1.8, and the chat bot uses claude-haiku-5-5; Chinese clause retrieval uses the policy library's BM25, English uses the local embedding model Qwen3-Embedding-0.6B." }
iteration = { zh = ["v1：四步工作流跑通，但判错的 {v1_escaped} 全部自动生效，引文核对拦不住看错的判断。", "v2：让模型说“拿不准”，拿不准的交人工；判错又自动生效的降到 {v2_escaped}，四条采用标准都满足。", "第一轮灰度：按事先写好的回滚规则，放到 {canary_rollback_share} 就回滚了；复盘发现两条规则写错（和改动目的矛盾、样本太小就比比例）。", "第二轮灰度：改好的规则跑前预注册，在新写的广告上三步放量都没回滚，v2 转为正式版本；但两版在这批广告上都接近全对，没有再证明 v2 能少漏错判。", "Lark：在多维表格里搭了同样的工作流，用平台自带的 AI Agent 步骤判断、写回，拿不准的自己进复核队列，引文核对由脚本补；另有一个聊天机器人，测试时发过几条广告和几个政策问题，只是测试、没有使用量。", "v3：重写“拿不准”的规则，想让答案清楚的广告少送人工；清楚广告的多余复核从 {r3_v2_clear} 降到 {r3_v3_clear}，但要人来定的广告送人工也从 {r3_v2_handoff} 降到 {r3_v3_handoff}，超过事先写好的上限，不采用，production 留在 v2。", "v4：两头都比 v2 好，清楚广告的多余复核 {r4_v2_clear} → {r4_v4_clear}，要人来定的送人工 {r4_v2_handoff} → {r4_v4_handoff}；但判错时更常说“确定”，清楚广告判错又自动生效 {r4_v2_clear_escaped} → {r4_v4_clear_escaped}，回归漏网 {r4_reg_v2_escaped} → {r4_reg_v4_escaped}，不采用。", "知识库问答：只按检索到的条款回答，库里没有就说没有；答对 {kb_right}，库里没有的题说了“没有” {kb_none}。", "英文条款检索换成本机向量模型：在选方法时没用过的标注上，正确条款进前三从 {ret_r3_en_bm25} 到 {ret_r3_en_dense}；中文还用 BM25。", "每周指标改用 SQL 取数，和原来的数逐个比过：整数全同，少数小数只在最末几位有差别（求和顺序不同），周报页面一字不差。", "Lark 两条工作流：第一遍条款里的换行挡住了平台的逐字查找，两种引文核对一致 {lark2_agree}，不一致的都是多送了人工；改好后第二遍 {lark3_agree}（看过第一遍才改，不算预注册）。"], en = ["v1: the four-step workflow runs, but all {v1_escaped} wrong decisions went live; quote checks cannot stop a misread decision.", "v2: the model may say it is unsure, and unsure ads go to people; wrong decisions that went live fell to {v2_escaped}, meeting all four adoption criteria.", "Canary round one: under the rules written beforehand it rolled back at {canary_rollback_share}; the review found two wrong rules (at odds with the change's purpose, and comparing rates on too few requests).", "Canary round two: the fixed rules were preregistered, and on newly written ads all three release steps passed without a rollback, so v2 was promoted to production; but both versions were almost always right on these ads, so this did not show again that v2 lets fewer errors through.", "Lark: the same workflow built in a Lark Base, with the platform's AI Agent step deciding and writing back, unsure answers queued for review, and quote checks added by script; plus a chat bot, tried with a few ads and policy questions as tests, with no real usage.", "v3: the rule on when to be unsure was rewritten so that clear ads go to people less often; needless reviews of clear ads fell from {r3_v2_clear} to {r3_v3_clear}, but ads that need a human were also sent to people less often, {r3_v2_handoff} to {r3_v3_handoff}, past the limit set beforehand, so it was not adopted and production stays on v2.", "v4: better than v2 at both ends, needless reviews of clear ads {r4_v2_clear} → {r4_v4_clear} and ads that need a human sent to people {r4_v2_handoff} → {r4_v4_handoff}; but more often sure when wrong, with clear ads decided wrongly and gone live {r4_v2_clear_escaped} → {r4_v4_clear_escaped} and regression escapes {r4_reg_v2_escaped} → {r4_reg_v4_escaped}, so it was not adopted.", "Knowledge-base Q&A: answers only from retrieved clauses and says so when the library has none; answered right {kb_right}, and said \"not in the library\" {kb_none} when it was not.", "English clause retrieval switched to a local embedding model: on labels not used to choose it, the right clause in the top three went from {ret_r3_en_bm25} to {ret_r3_en_dense}; Chinese stays on BM25.", "Weekly metrics are now computed in SQL and were compared one by one with the earlier numbers: every integer is the same, a few decimals differ only in their last digits (sums added in a different order), and the report pages are identical.", "Two Lark workflows: on the first pass, line breaks in the clauses blocked the platform's exact-text search, so the two quote checks agreed on {lark2_agree}, every disagreement sending an extra ad to people; after the fix the second pass agreed on {lark3_agree} (changed after seeing the first pass, so not preregistered)."] }
conclusion = { zh = "让模型说“拿不准”能减少判错又生效，代价是多送人工；第一轮灰度按规则回滚，暴露的是规则本身写错；改好的规则在新流量上放到全量，v2 转为正式版本。v2 少漏错判的证据仍来自第一轮。第 3 版在清楚广告上少了多余复核，却把要人来定的广告也少送了人工；第 4 版两头都好了，判错时却更常说“确定”。两版都按事先写好的标准没采用；假如照样放量，灰度规则都拦不下，拦下它们的是题目设计和采用标准。", en = "Letting the model say it is unsure reduces wrong decisions that go live at the cost of more human review; the first canary rolled back because the rules themselves were wrong; with fixed rules the second canary on new traffic reached full release and v2 was promoted to production. The evidence that v2 lets fewer errors through still comes from round one. Version 3 cut needless reviews of clear ads but also sent fewer ads that need a human to people; version 4 improved both but was more often sure when wrong. Neither met the standard written beforehand; a canary would not have stopped either, the item design and the adoption standard did." }
short_name = { zh = "标注流水线", en = "Labelling pipeline" }
