data = { zh = "80 道题，中英各一半，其中一部分库里没有答案；答案写题时定好；每道题两遍，共 160 个请求。计划和预测跑前写好。答对要结论对、引了对的条款、引文核对通过；库里没有的题要说“没有”且不引条款。", en = "80 questions, half Chinese and half English, some not answerable from the library; answers fixed when the questions were written; two runs each, 160 requests. The plan and predictions were written before the run. A right answer has the right verdict, cites the right clause and passes the quote check; for a question the library cannot answer it must say so and cite nothing." }
items = { zh = "160 个请求", en = "160 requests" }
runs = { zh = "每道题 2 遍", en = "2 runs per question" }
