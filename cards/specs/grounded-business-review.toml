[[eval]]
id = "test"
name = { zh = "测试集：埋好答案的题（脚本、一次提示词、Agent）", en = "Test set: known-answer cases (script, one prompt, agent)" }
date = "2026-11-17"
data = { zh = "合成到店团购数据上 36 道题，每道题是一个由自己的随机种子生成的“世界”，在分析周里埋一个或两个事件，答案出题时写进题目文件：单原因单维度 20 道、单原因两个维度交叉 6 道、两个原因 4 道、对照 6 道。开发集 16 道用来写规则和提示词，和测试集不共用种子。", en = "36 cases on synthetic local-services data, each a world generated from its own seed with one or two events planted in the analysis week and the answer written into the case file: one cause in one dimension 20, one cause across two dimensions 6, two causes 4, controls 6. A 16-case development set, sharing no seeds with the test set, was used to write the rules and prompts." }
items = { zh = "36 道题", en = "36 cases" }
runs = { zh = "每种做法每题 1 遍", en = "1 run per case per approach" }
setup = { zh = "claude-haiku-5-5，effort medium，批量接口；脚本不调用模型", en = "claude-haiku-5-5, effort medium, Message Batches API; the script makes no model calls" }
frozen = { zh = "`eval/PREREGISTRATION.md`；跑前冻结的文件指纹在 `eval/frozen.json`，跑完核对都没变", en = "`eval/PREREGISTRATION.md`; file fingerprints frozen before the run in `eval/frozen.json`, all unchanged afterwards" }
takeaway = { zh = "Agent 原因找得最准，按题配对明显好过一次提示词；和脚本只差几题，分不出高下。一次提示词拿到的固定材料只按单个维度拆，两个维度交叉的原因一道也没对。改一次以内，三种做法的周报大多放行；第一次交卷就放行的比例比预测低。", en = "The agent finds causes best and clearly beats the one prompt case by case; against the script it differs by a few cases, too close to call. The one prompt's fixed pack breaks metrics down one dimension at a time, so it got none of the two-dimension causes. After at most one revision most reviews were released; first drafts passed less often than predicted." }

