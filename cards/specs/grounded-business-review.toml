  { date = "2026-11-17", label = { zh = "测试集", en = "Test set" }, text = { zh = "Agent 找对最多，比一次提示词多对", en = "The agent finds the most causes" }, before = "oneshot_all", after = "agent_all", adopted = true },
  { date = "2026-11-17", label = { zh = "数字核对", en = "Number check" }, text = { zh = "逐段核对，卡住的只有中文数字", en = "Every paragraph checked; only number words held reviews back" }, after = "agent_released" },
  { date = "2026-11-17", label = { zh = "Dify 版", en = "Dify version" }, text = { zh = "同一条流程搭成 Dify 工作流", en = "The same flow as a Dify workflow" } },
