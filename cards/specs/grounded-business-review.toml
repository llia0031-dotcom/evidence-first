[[limitation]]
text = { zh = "数据、埋的事件、监控和三种做法都出自同一个项目；埋的事件干净，都落在现有维度里，真实的原因常常不是这样。", en = "The data, the planted events, the monitor and all three approaches come from the same project; the events are clean and sit inside existing dimensions, which real causes often do not." }
advice = { zh = "换到真实数据前，先拿历史上已经查清原因的周做一批题再测。", en = "Before real data, build cases from past weeks whose causes are already known and test again." }

[[limitation]]
text = { zh = "Agent 和脚本只差几题（p = {pair_script_p}），这批题分不出高下。", en = "The agent and the script differ by a few cases (p = {pair_script_p}); these cases cannot separate them." }
advice = { zh = "要分出高下得加题，尤其是两个原因和两个维度交叉的题。", en = "Separating them needs more cases, especially two-cause and two-dimension ones." }

[[limitation]]
text = { zh = "数字核对对中文数字太严：最后没放行的周报里没有一个错数，没过的段落都卡在“这两项”“前一天”这类词上。", en = "The number check is too strict on Chinese number words: the reviews held back in the end had no wrong number, and their failing paragraphs failed on words like 这两项 (\"these two\") or 前一天 (\"the day before\")." }
advice = { zh = "把计数词和数量分开处理，或给计数词单独的规则；严到什么程度是产品上的取舍，要和使用的人一起定。", en = "Treat counting words apart from quantities, or give them their own rule; how strict to be is a product decision to make with the people who use it." }

[[limitation]]
text = { zh = "Agent 第一稿引了不在引用行里的数的段落有 {agent_bad_rows} 段，靠退回改一次才全部改好；没有核对就会发出去。", en = "The agent's first drafts had {agent_bad_rows} paragraphs quoting a number not in the cited row, all fixed only by the one revision; without the check they would have gone out." }
advice = { zh = "核对放在发出之前，不能省。", en = "Keep the check before anything goes out." }

[[limitation]]
text = { zh = "建议没有打分。", en = "Recommended actions are not scored." }
advice = { zh = "给建议定评分规则，再在同一批题上测。", en = "Write scoring rules for the actions and test them on the same cases." }

