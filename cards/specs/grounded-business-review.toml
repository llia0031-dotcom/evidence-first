did = { zh = "我在合成的到店团购数据上搭了指标字典、一条 SQL 的周监控、贡献度和率效应拆解、带数字核对的经营周报，比较固定脚本、一次提示词和 Agent 三种找原因的做法；埋好答案的测试题和评测计划在跑之前冻结；另把同一条流程搭成 Dify 工作流。", en = "On synthetic local-services group-buying data I built a metric dictionary, a one-query weekly monitor, contribution and rate-mix breakdowns and number-checked weekly reviews, and compared three ways of finding the cause: a fixed-rule script, a one-prompt approach and an agent; the known-answer test cases and the evaluation plan were frozen before the run; the same flow was also built as a Dify workflow." }
name = { zh = "有据经营分析", en = "Grounded Business Review" }
problem = { zh = "每周看经营数据的人要知道哪些指标异动、原因在哪；让模型找原因、写周报，原因找得准不准，周报里的数字能不能都对回查询结果", en = "Whoever reads the weekly numbers needs to know which metrics moved and why; when a model finds the cause and writes the review, is the cause right, and does every number trace back to a query result?" }
primary_metric = { zh = "埋好的原因全找对（不多报、不答粗）；改一次以内放行的周报；每题费用", en = "Every planted cause found (nothing extra, nothing too coarse); reviews released after at most one revision; cost per case" }
headline = [
  { zh = "埋好的原因全找对：脚本 {script_all}，一次提示词 {oneshot_all}，Agent {agent_all}", en = "All planted causes right: script {script_all}, one prompt {oneshot_all}, agent {agent_all}" },
  { zh = "按题配对，Agent 比一次提示词多对 {pair_agent_only} 题、少对 {pair_oneshot_only} 题（p = {pair_p}）；和脚本比分不出高下（p = {pair_script_p}）", en = "Case by case the agent beat the one prompt {pair_agent_only} to {pair_oneshot_only} (p = {pair_p}); against the script it is too close to call (p = {pair_script_p})" },
  { zh = "改一次以内放行：一次提示词 {oneshot_released}，Agent {agent_released}；没放行的都卡在中文数字上，没有一个错数", en = "Released after at most one revision: one prompt {oneshot_released}, agent {agent_released}; every review held back failed on Chinese number words, none on a wrong number" },
]
summary = { zh = "在一份合成的到店团购数据上，把“每周监控 → 按维度拆解 → 写经营周报 → 数字核对”做成一条可以重跑的线，并比较三种找原因的做法：固定规则的脚本、把固定查询结果交给模型的一次提示词、让模型自己用工具查数的 Agent。周报里每段带数字的话都要引用查询结果的行，用 evidence-check 逐段核对，对不上就退回改一次，再不过就不放行。数据由脚本按随机种子生成，不是任何平台的真实经营数据。", en = "On synthetic local-services group-buying data, \"weekly monitor → breakdown by dimension → weekly review → number check\" runs as one repeatable line, and three ways of finding the cause are compared: a fixed-rule script, a one-prompt approach that hands the model a fixed pack of query results, and an agent that queries with tools. Every paragraph with a number must cite the query-result row it comes from and is checked with evidence-check; a review that fails goes back for one revision and is held back if it fails again. The data is generated by script from random seeds and is not any platform's real business data." }
core_link = { zh = "周报的数字核对直接调用 evidence-check 0.4.0 的脚本，项目自己另加三条结构规则。", en = "The review's number check calls the evidence-check 0.4.0 script directly, with three project rules on top." }
models = { zh = "评测里两种模型做法都用 claude-haiku-5-5（effort medium，批量接口）；脚本不调用模型。Dify 版的模型节点默认用平台额度里的 gpt-5-mini，只用来确认流程在平台上能跑通，不在评测里。", en = "Both model approaches in the evaluation use claude-haiku-5-5 (effort medium, Message Batches API); the script makes no model calls. The Dify version's model nodes default to gpt-5-mini from the platform's allowance and only show the flow runs there; they are not in the evaluation." }
iteration = { zh = ["先把指标字典、周监控、拆解和数字核对搭成一条线，三种做法共用。", "脚本的下钻规则在开发集上重写一次：先定环节再定分组，已找到的原因能解释的分组不再报。", "提示词 v1 到 v4：有的稿子删掉数字来过核对，第 3 版起要求“发现”段必须有数字、“原因”段必须引用行；第 4 版写明中文数字也会被核对。", "开发集上第 4 版：脚本 {dev_script}，一次提示词 {dev_oneshot}，Agent {dev_agent}；随后冻结文件指纹，再跑测试集。", "测试集：Agent {agent_all}，脚本 {script_all}，一次提示词 {oneshot_all}；两个维度交叉的原因，一次提示词 {oneshot_2d}。", "Dify 版：同一条“一次提示词”流程搭成 Dify 工作流，几个场景周试跑过，不在评测里。"], en = ["First the metric dictionary, weekly monitor, breakdowns and number check were built as one line shared by all three approaches.", "The script's drill-down was rewritten once on the development set: stage first, then segment, and segments the found cause already explains are dropped.", "Prompts v1 to v4: some drafts passed the check by dropping their numbers, so from v3 a finding must contain a number and a cause must cite a row; v4 says Chinese number words are checked too.", "Version 4 on the development set: script {dev_script}, one prompt {dev_oneshot}, agent {dev_agent}; then the file fingerprints were frozen and the test set ran.", "Test set: agent {agent_all}, script {script_all}, one prompt {oneshot_all}; on causes that cross two dimensions the one prompt got {oneshot_2d}.", "Dify version: the same one-prompt flow built as a Dify workflow and tried on a few scenario weeks; not in the evaluation."] }
conclusion = { zh = "让模型自己决定查什么，原因找得最准，两个维度交叉的原因尤其明显；代价是第一稿更常引错行，费用约是一次提示词的 {cost_ratio}。固定脚本在单一原因上不差，这批题分不出它和 Agent 的高下。数字核对拦住了引错行的数，但对中文数字太严，把没有错数的周报也拦下了。", en = "Letting the model decide what to query finds causes best, most clearly when a cause crosses two dimensions; the price is first drafts that cite the wrong row more often and about {cost_ratio} the one prompt's cost. The fixed script does well on single causes, and these cases cannot separate it from the agent. The number check stopped every number quoted from the wrong row, but it is too strict on Chinese number words and also held back reviews with no wrong number." }
short_name = { zh = "经营分析", en = "Business review" }
card_title = { zh = "经营周报：找异动原因，每个数字都对回查询结果", en = "Weekly review: find the cause, trace every number" }
assumed = { zh = "以为一次提示词第一次交卷大多能过数字核对", en = "Expected most one-prompt first drafts to pass the number check" }
showed = { zh = "第一次交卷只过了 {oneshot_first}；最后没放行的都卡在中文数字上，没有一个错数", en = "First drafts passed only {oneshot_first}; reviews held back in the end failed on Chinese number words, never on a wrong number" }
result_line = { zh = "按题配对，Agent 比一次提示词多对 {pair_agent_only} 题、少对 {pair_oneshot_only} 题（p = {pair_p}）", en = "Case by case, the agent beat the one prompt {pair_agent_only} to {pair_oneshot_only} (exact p = {pair_p})" }
key_numbers = [{ metric = "agent_all", label = { zh = "Agent 原因全找对（一次提示词 {oneshot_all}）", en = "Agent named every planted cause (one prompt: {oneshot_all})" } }, { metric = "oneshot_2d", label = { zh = "两个维度交叉的原因，一次提示词答对的题", en = "Two-dimension causes the one prompt got right" } }, { metric = "agent_bad_rows", label = { zh = "Agent 第一稿数字对不上引用行的段落", en = "Agent first-draft paragraphs citing a number not in the row" } }]
