[[eval]]
id = "base"
name = { zh = "基线：三个 Agent 照原样运行", en = "Base: three agents run unchanged" }
date = "2026-11-18"
data = { zh = "广告审核（中英文广告，含三轮对话：审核、给修改建议、再审新版本）、经营分析（合成的本地生活平台数据，埋好的原因、平静的周、节假日、只问一件事的请求）、创作流程（同一段对话里热点选题、拆分镜、对字幕）。答案在出题时定好，用各 Agent 项目自己的校验和打分代码。", en = "Ad review (Chinese and English ads, including three-turn reviews: review, advice, review of the next version), business review (a synthetic local-services platform with planted causes, quiet weeks, holidays and scoped requests) and a creator workflow (trend topics, a shot list and a subtitle check in one conversation). Answers fixed when the tasks were written, with each agent project's own validators and scorers." }
items = { zh = "46 道题：广告审核 20、经营分析 18、创作流程 8", en = "46 tasks: 20 ad review, 18 business review, 8 creator workflow" }
runs = { zh = "每题 3 次", en = "3 trials per task" }
setup = { zh = "claude-haiku-5-5，effort medium；第一次走普通接口，第二、三次走批量接口", en = "claude-haiku-5-5, effort medium; trial 1 standard API, trials 2 and 3 Message Batches API" }
frozen = { zh = "`eval/PREREGISTRATION.md`、`eval/frozen.json`", en = "`eval/PREREGISTRATION.md`, `eval/frozen.json`" }
takeaway = { zh = "三类任务的成功率接近，失败大多出在结果这一步：同一句话贴了两个类别、门店下线定位得太粗、把普通产品参数判成违规。过程上的毛病在答对的试验里也常见：广告审核多数试验在审核那一轮还顺手调了建议工具。", en = "The three families succeed at similar rates, and most failures start at the result: one phrase under two categories, a store closure located too coarsely, an ordinary specification rejected. Process faults are common even in successful trials: most ad review trials also called the advice tool in a review turn." }

  [[eval.metric]]
  id = "ate_ad_success"
  label = { zh = "广告审核：任务成功", en = "Ad review: task success" }
  extractor = "md_cell"
  args = { path = "agent-trace-eval-public/eval/results/summary.md", section = "Run `base`", row = "Task success (pass^1)", col = "Ad review" }

  [[eval.metric]]
  id = "ate_biz_success"
  label = { zh = "经营分析：任务成功", en = "Business review: task success" }
  extractor = "md_cell"
  args = { path = "agent-trace-eval-public/eval/results/summary.md", section = "Run `base`", row = "Task success (pass^1)", col = "Business review" }

  [[eval.metric]]
  id = "ate_cr_success"
  label = { zh = "创作流程：任务成功", en = "Creator workflow: task success" }
  extractor = "md_cell"
  args = { path = "agent-trace-eval-public/eval/results/summary.md", section = "Run `base`", row = "Task success (pass^1)", col = "Creator workflow" }

  [[eval.metric]]
  id = "ate_ad_pass3"
  label = { zh = "广告审核：三次都成功（pass^3）", en = "Ad review: all three trials succeed (pass^3)" }
  extractor = "md_value"
  args = { path = "agent-trace-eval-public/eval/results/summary.md", section = "Run `base`", row = "pass^3 (all three trials succeed)", col = "Ad review", unit = "pct", decimals = 0 }

  [[eval.metric]]
  id = "ate_biz_pass3"
  label = { zh = "经营分析：三次都成功（pass^3）", en = "Business review: all three trials succeed (pass^3)" }
  extractor = "md_value"
  args = { path = "agent-trace-eval-public/eval/results/summary.md", section = "Run `base`", row = "pass^3 (all three trials succeed)", col = "Business review", unit = "pct", decimals = 0 }

  [[eval.metric]]
  id = "ate_cr_pass3"
  label = { zh = "创作流程：三次都成功（pass^3）", en = "Creator workflow: all three trials succeed (pass^3)" }
  extractor = "md_value"
  args = { path = "agent-trace-eval-public/eval/results/summary.md", section = "Run `base`", row = "pass^3 (all three trials succeed)", col = "Creator workflow", unit = "pct", decimals = 0 }

  [[eval.metric]]
  id = "ate_ad_tools"
  label = { zh = "广告审核：工具调用正确", en = "Ad review: tool calls correct" }
  extractor = "md_cell"
  args = { path = "agent-trace-eval-public/eval/results/summary.md", section = "Run `base`", row = "Tool calls correct", col = "Ad review" }

  [[eval.metric]]
  id = "ate_ad_refused"
  label = { zh = "广告审核：审核那一轮还调了建议工具", en = "Ad review: advice tool called in a review turn" }
  extractor = "text_fraction"
  args = { path = "agent-trace-eval-public/eval/results/facts.md", label = "`base`: trials with submit_advice called in a review turn" }
  direction = "lower"
  note = { zh = "被运行框架拒掉，没有影响任务成功", en = "refused by the harness; it never failed a task" }

  [[eval.metric]]
  id = "ate_biz_held"
  label = { zh = "经营分析：被数字核对拦下、要人确认", en = "Business review: held by the number check for a person" }
  extractor = "md_cell"
  args = { path = "agent-trace-eval-public/eval/results/summary.md", section = "Run `base`", row = "Needs human confirmation (an automatic gate held it)", col = "Business review" }
  direction = "none"

[[eval]]
id = "gates"
name = { zh = "上线前的自动关卡和失败归因（基线）", en = "Release gates and failure attribution (base)" }
date = "2026-11-18"
data = { zh = "关卡是上线前会跑的检查：引文核对、数字核对、Skill 自带的检查脚本，拦下的要人确认。每个失败的试验，最早没过的那条检查定阶段；原因来自每条检查的规则，或读完过程记录后写下的说明。", en = "The gates are the checks a deployment runs before release: quote checks, number checks and the skills' own checking scripts; what they hold goes to a person. For each failed trial the earliest failing check gives the stage, and the cause comes from a rule per check or a note written after reading the trace." }
items = { zh = "基线 138 次试验里失败的那些", en = "The failed trials among 138 base trials" }
runs = { zh = "每题 3 次", en = "3 trials per task" }
setup = { zh = "claude-haiku-5-5，effort medium", en = "claude-haiku-5-5, effort medium" }
frozen = { zh = "`eval/PREREGISTRATION.md`", en = "`eval/PREREGISTRATION.md`" }
takeaway = { zh = "关卡几乎什么也没拦下：广告审核每次失败引的原话和条款都是真的，错在结论；经营分析的数字核对拦下的多是对的报告，反而加了复核量。失败里有一部分是题目或答案本身的问题，照实留在分数里并写明原因。", en = "The gates caught almost nothing: every failed ad review cites real words and real clauses, and the reading is what is wrong; the business number check held more correct reports than failures, adding review load. Some failures are problems of the tasks or answer keys; they stay in the scores, with the reason stated." }

  [[eval.metric]]
  id = "ate_failed"
  label = { zh = "基线失败的试验", en = "Failed base trials" }
  extractor = "text_value"
  args = { path = "agent-trace-eval-public/eval/results/facts.md", label = "Base failed trials", nth = 0 }
  direction = "lower"

  [[eval.metric]]
  id = "ate_gate_caught"
  label = { zh = "失败里被关卡拦下的", en = "Failures the gates caught" }
  extractor = "text_count_ratio"
  args = { path = "agent-trace-eval-public/eval/results/facts.md", label = "Base failed trials", k_nth = 1, n_nth = 0 }

  [[eval.metric]]
  id = "ate_gate_through"
  label = { zh = "失败里关卡放过去的", en = "Failures the gates let through" }
  extractor = "text_count_ratio"
  args = { path = "agent-trace-eval-public/eval/results/facts.md", label = "Base failed trials", k_nth = 2, n_nth = 0 }
  direction = "lower"

  [[eval.metric]]
  id = "ate_cause_task"
  label = { zh = "失败里属于题目或答案本身的问题", en = "Failures caused by the task or its answer key" }
  extractor = "text_count_ratio"
  args = { path = "agent-trace-eval-public/eval/results/facts.md", label = "Base failed trials", k_nth = 3, n_nth = 0 }
  direction = "none"

[[eval]]
id = "skills"
name = { zh = "装 Skill 和不装（创作流程）", en = "Skills against no skills (creator workflow)" }
date = "2026-11-18"
data = { zh = "同样的 8 道创作流程题，一组装上三个创作者 Skill 和它们的检查工具，一组不装；按题配对，用精确符号检验。", en = "The same 8 creator-workflow tasks, once with the three creator skills and their checking tools loaded and once without; paired by task, exact sign test." }
items = { zh = "8 道题", en = "8 tasks" }
runs = { zh = "每题 3 次", en = "3 trials per task" }
