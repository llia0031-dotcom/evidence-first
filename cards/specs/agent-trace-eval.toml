stack = { zh = "Python、批量接口、过程记录和逐步规则检查、evidence-check、agentevals、Inspect AI 日志", en = "Python, Message Batches API, step traces with rule checks, evidence-check, agentevals, Inspect AI logs" }
did = { zh = "我给三个已有的、会调工具的 Agent 新写了 46 道题，每题跑三次，把每一步记下来；评分按理解、规划、工具调用、知识引用、结果五个阶段写成规则，再加上线前的自动关卡和失败归因表。看完基线后，跑之前先写下两个修复的预测，再在整组题上做回归重测。", en = "I wrote 46 new tasks for three existing tool-using agents, ran each three times and recorded every step; scoring is written as rules over five stages (understanding, planning, tool calls, knowledge and citation, result), with release gates and a failure attribution table on top. After the base run, two fixes were registered with predictions before they ran, then re-tested on every task of their family." }
name = { zh = "Agent 评测台", en = "Agent Trace Eval" }
problem = { zh = "会调工具的 Agent 只看最后答案对不对不够：它每一步做了什么，上线前的检查能拦住哪些错，失败从哪一步开始，改了以后会不会把别处弄坏", en = "Grading only the final answer of a tool-using agent is not enough: what did each step do, which errors do release checks stop, where does a failure start, and does a fix break something else?" }
primary_metric = { zh = "任务成功率（pass^1）和三次都成功（pass^3）；五个阶段的通过率；关卡拦下和放过的失败", en = "Task success (pass^1) and all three trials succeeding (pass^3); pass rate per stage; failures the gates caught and let through" }
headline = [
  { zh = "基线任务成功：广告审核 {ate_ad_success}、经营分析 {ate_biz_success}、创作流程 {ate_cr_success}；三次都成功 {ate_ad_pass3}、{ate_biz_pass3}、{ate_cr_pass3}", en = "Base task success: ad review {ate_ad_success}, business review {ate_biz_success}, creator workflow {ate_cr_success}; all three trials {ate_ad_pass3}, {ate_biz_pass3}, {ate_cr_pass3}" },
  { zh = "关卡管得住格式，管不住判断：基线失败 {ate_failed} 次，关卡拦下 {ate_gate_caught:k} 次、放过 {ate_gate_through:k} 次", en = "The gates guard form, not judgement: of {ate_failed} failed base trials, the gates caught {ate_gate_caught:k} and let {ate_gate_through:k} through" },
  { zh = "装 Skill 和不装：创作流程成功 {ate_cr_success} 对 {ate_cr_noskills}（符号检验 p = {ate_sign_p}）", en = "Skills against none: creator workflow success {ate_cr_success} against {ate_cr_noskills} (sign test p = {ate_sign_p})" },
  { zh = "预注册的修复：审核轮误调建议工具 {ate_ad_refused} → {ate_fixad_refused}；门店下线定位到商家 {ate_closure_base} → {ate_closure_fix}，回归重测查出另一道题变差", en = "Registered fixes: advice tool called in a review turn {ate_ad_refused} → {ate_fixad_refused}; store closures located at the merchant {ate_closure_base} → {ate_closure_fix}, and the regression run caught another task getting worse" },
]
summary = { zh = "评一个会调工具的 Agent 每一步做了什么，不只看最后的答案。三个已有的 Agent 照原样运行（有据审核、有据经营分析、创作者 Skill），46 道新题：广告审核 20、经营分析 18、创作流程 8，从一步就能答的题到多轮对话、要拿捏分寸的题分成三档，每题三次。题目和答案在出题时定好，题目、答案、评分代码和配置跑前记下指纹。评分是对过程记录的规则检查，分五个阶段；任务成功只看结果检查，过程检查用来说明它怎么走到这一步。另有上线前的自动关卡（引文核对、数字核对、Skill 自带的检查脚本），关卡拦下的要人确认；失败归因记下每个失败从哪一步开始、为什么、怎么改。", en = "Evaluates what a tool-using agent does at every step, not only its final answer. Three existing agents run unchanged (Grounded Review, Grounded Business Review, Creator Skills) on 46 new tasks: 20 ad review, 18 business review and 8 creator workflow, in three tiers from one-step tasks to multi-turn ones that need judgement, three trials each. Answers were fixed when the tasks were written, and tasks, answers, rubric code and configurations were hashed before the runs. Scoring is rule checks over the recorded steps in five stages; task success uses the result checks only, and process checks explain how the agent got there. Release gates (quote checks, number checks, the skills' own checking scripts) hold results for a person; the attribution table records where each failure starts, why, and how to fix it." }
core_link = { zh = "引文和数字用 evidence-check 的脚本核对；评的是有据审核、有据经营分析和创作者 Skill 三个项目的 Agent，不改它们的代码，补的是它们各自评测没量的过程和关卡。", en = "Quotes and numbers are checked with evidence-check's script; the agents are those of Grounded Review, Grounded Business Review and Creator Skills, run without code changes, and this adds what their own evaluations did not measure: the steps and the gates." }
models = { zh = "三个 Agent 和判官都用 claude-haiku-5-5（effort medium）；基线第一次试验走普通接口量时延，第二、三次和修复、对照都走批量接口。", en = "claude-haiku-5-5 (effort medium) for all three agents and the judge; the first base trial used the standard API to measure latency, the other trials, fixes and comparisons the Message Batches API." }
iteration = { zh = ["基线任务成功：广告审核 {ate_ad_success}、经营分析 {ate_biz_success}、创作流程 {ate_cr_success}；广告审核引的原话和条款每次都对，错在结论和类别。", "关卡：事先预测关卡能拦下大多数失败，结果只拦下 {ate_gate_caught}；经营分析的数字核对拦下的大多是对的报告。", "不装 Skill：创作流程成功率从 {ate_cr_success} 掉到 {ate_cr_noskills}；给致死火灾做营销选题这种错，来源核对也放过了。", "修复广告审核：审核轮误调建议工具从 {ate_ad_refused} 降到 {ate_fixad_refused}，输出 token {ate_fixad_tokens}；任务成功没测出差别，提升在过程上。", "修复经营分析：门店下线定位到商家 {ate_closure_base} → {ate_closure_fix}，按事先的规则采用；回归重测发现另一道退款题被定位得过细，下一步把规则从提示词搬进代码。"], en = ["Base task success: ad review {ate_ad_success}, business review {ate_biz_success}, creator workflow {ate_cr_success}; ad review quotes and clauses were always right, its errors are decisions and categories.", "Gates: they were predicted to catch most failures and caught {ate_gate_caught}; most reports the business number check held were correct ones.", "Without skills: creator workflow success fell from {ate_cr_success} to {ate_cr_noskills}; promotional cards on a fatal fire passed the source check.", "Ad fix: the advice tool called in a review turn went from {ate_ad_refused} to {ate_fixad_refused}, output tokens {ate_fixad_tokens}; no measured change in task success, the gain is in the process.", "Business fix: store closures located at the merchant {ate_closure_base} → {ate_closure_fix}, adopted by the registered rule; the regression run found a refund task now located too finely, so the next step moves the rules from the prompt into code."] }
conclusion = { zh = "上线前的自动关卡查的是形式：引文是不是原话、数字有没有出处、时长对不对；它们放过的，正是判断上的错。会调工具的 Agent 要按步骤评，才能看清失败从哪里开始、哪些是题目本身的问题。照失败写的修复要先写下预测，再在整组题上回归重测，否则修好一处、弄坏另一处也看不出来。", en = "Release gates check form: quotes are the item's own words, numbers have a source, timings fit; what they let through is errors of judgement. A tool-using agent needs scoring by step to see where a failure starts and which failures belong to the task itself. A fix written from a failure needs predictions first and a regression run over the whole family; otherwise one fix breaking something else goes unseen." }
short_name = { zh = "Agent 评测", en = "Agent trace eval" }
card_title = { zh = "会调工具的 Agent，每一步做对了吗", en = "Did a tool-using agent get each step right?" }
assumed = { zh = "以为上线前的自动关卡能拦下大多数失败", en = "Expected the release gates to catch most failures" }
showed = { zh = "基线失败 {ate_failed} 次，关卡只拦下 {ate_gate_caught:k} 次", en = "Of {ate_failed} failed base trials, the gates caught {ate_gate_caught:k}" }
result_line = { zh = "关卡只拦下 {ate_gate_caught} 的失败；不装 Skill，成功 {ate_cr_success} → {ate_cr_noskills}", en = "The release gates caught {ate_gate_caught} of failures; without skills, creator success {ate_cr_success} → {ate_cr_noskills}" }
key_numbers = [{ metric = "ate_gate_caught", label = { zh = "基线失败里被关卡拦下的", en = "Failed base trials the gates caught" } }, { metric = "ate_cr_noskills", label = { zh = "不装 Skill 的创作流程成功（装上 {ate_cr_success}）", en = "Creator workflow success without skills (with them {ate_cr_success})" } }, { metric = "ate_fixad_refused", label = { zh = "修复后审核轮误调建议工具（原来 {ate_ad_refused}）", en = "Advice tool called in a review turn after the fix (before {ate_ad_refused})" } }]
timeline = [
  { date = "2026-11-18", label = { zh = "基线", en = "Base run" }, text = { zh = "三类任务成功率接近", en = "Similar success in all three families" }, after = "ate_ad_success" },
  { date = "2026-11-18", label = { zh = "关卡", en = "Gates" }, text = { zh = "预测拦下大多数失败，只拦下一次", en = "Predicted to catch most failures; caught one" }, after = "ate_gate_caught" },
  { date = "2026-11-18", label = { zh = "不装 Skill", en = "No skills" }, text = { zh = "创作流程成功率大幅下降", en = "Creator workflow success falls sharply" }, before = "ate_cr_success", after = "ate_cr_noskills" },
  { date = "2026-11-18", label = { zh = "修复广告审核", en = "Ad fix" }, text = { zh = "误调建议工具降到零，采用", en = "Stray advice calls gone; adopted" }, before = "ate_ad_refused", after = "ate_fixad_refused", adopted = true },
  { date = "2026-11-18", label = { zh = "修复经营分析", en = "Business fix" }, text = { zh = "门店定位全对，回归查出副作用", en = "Closures all located; regression found a side effect" }, before = "ate_closure_base", after = "ate_closure_fix", adopted = true },
]

judge = { zh = [
  "规则查不了的 7 条标准（建议是否讲清、建议是否从原因出发、选题是否贴合账号等）按写好的指南判两遍；判官用 claude-haiku-5-5，和被测的三个 Agent 是同一个模型。",
