[[eval]]
id = "fixes"
name = { zh = "预注册的两个修复和回归重测", en = "Two registered fixes and the regression run" }
date = "2026-11-18"
data = { zh = "看完基线后，两个修复各在 Agent 的说明里加两条规则，跑之前写下预测和采用规则。广告审核：一句话只记一处违规、归到最具体的类别；每个请求只用它要的那个收尾工具。经营分析：门店下线的原因定位到商家；只把监控报警的切片当原因。各在整组题上重跑三次，这就是回归测试。", en = "After the base run, each fix adds two rules to the agent's instructions, with predictions and an adoption rule written before it ran. Ad review: one violation per phrase, under the most specific category; finish each request with the one tool it asks for. Business review: locate a store-closure cause at the merchant; name only slices the monitor flagged as causes. Each re-ran its whole family three times: the regression test." }
items = { zh = "广告审核 20 道；经营分析 18 道", en = "20 ad review tasks; 18 business review tasks" }
runs = { zh = "每题 3 次", en = "3 trials per task" }
setup = { zh = "claude-haiku-5-5，effort medium，批量接口", en = "claude-haiku-5-5, effort medium, Message Batches API" }
frozen = { zh = "`eval/PREREGISTRATION.md`（变更记录，2026-11-18 20:48）、`eval/frozen-changes.json`", en = "`eval/PREREGISTRATION.md` (change log, 2026-11-18 20:48), `eval/frozen-changes.json`" }
takeaway = { zh = "两个修复都按事先的规则采用。广告审核的预测全部成立，提升在过程上，任务成功没测出差别。经营分析门店定位全对，但“只认报警切片”那条没管住，还让一道退款题被定位到某一家连锁、比实际更细：照失败写的规则会带出副作用，下一步把两条规则从提示词搬进代码。", en = "Both fixes were adopted by the registered rule. Every ad prediction held; the gain is in the process, with no measured change in task success. The business fix located every store closure, but the flagged-slice rule did not hold, and a refund task was narrowed to one chain, finer than the event: a rule written from a failure has side effects, so the next step moves both rules from the prompt into code." }

  [[eval.metric]]
  id = "ate_fixad_refused"
  label = { zh = "修复后：审核那一轮还调了建议工具", en = "After the fix: advice tool called in a review turn" }
  extractor = "text_fraction"
  args = { path = "agent-trace-eval-public/eval/results/facts.md", label = "`fix-ad`: trials with submit_advice called in a review turn" }
  direction = "lower"

  [[eval.metric]]
  id = "ate_fixad_tokens"
  label = { zh = "修复后：每次试验的输出 token 变化", en = "After the fix: change in output tokens per trial" }
  extractor = "text_value"
  args = { path = "agent-trace-eval-public/eval/results/facts.md", label = "fix-ad against base: output tokens per trial", nth = 2, unit = "pct", signed = true }
  direction = "lower"

  [[eval.metric]]
  id = "ate_fixad_success"
  label = { zh = "广告审核修复后：任务成功", en = "Ad review after the fix: task success" }
  extractor = "md_cell"
  args = { path = "agent-trace-eval-public/eval/results/summary.md", section = "Run `fix-ad`", row = "Task success (pass^1)", col = "Ad review" }

  [[eval.metric]]
  id = "ate_fixad_tools"
  label = { zh = "广告审核修复后：工具调用正确", en = "Ad review after the fix: tool calls correct" }
  extractor = "md_cell"
  args = { path = "agent-trace-eval-public/eval/results/summary.md", section = "Run `fix-ad`", row = "Tool calls correct", col = "Ad review" }

  [[eval.metric]]
  id = "ate_closure_base"
  label = { zh = "修复前：门店下线定位到商家", en = "Before the fix: store closures located at the merchant" }
  extractor = "text_fraction"
  args = { path = "agent-trace-eval-public/eval/results/facts.md", label = "`base`: store closures located at the merchant" }

  [[eval.metric]]
  id = "ate_closure_fix"
  label = { zh = "修复后：门店下线定位到商家", en = "After the fix: store closures located at the merchant" }
  extractor = "text_fraction"
  args = { path = "agent-trace-eval-public/eval/results/facts.md", label = "`fix-biz`: store closures located at the merchant" }

  [[eval.metric]]
  id = "ate_fixbiz_success"
  label = { zh = "经营分析修复后：任务成功", en = "Business review after the fix: task success" }
  extractor = "md_cell"
  args = { path = "agent-trace-eval-public/eval/results/summary.md", section = "Run `fix-biz`", row = "Task success (pass^1)", col = "Business review" }

  [[eval.metric]]
  id = "ate_fixbiz_pass3"
  label = { zh = "经营分析修复后：三次都成功（pass^3）", en = "Business review after the fix: all three trials succeed (pass^3)" }
  extractor = "md_value"
  args = { path = "agent-trace-eval-public/eval/results/summary.md", section = "Run `fix-biz`", row = "pass^3 (all three trials succeed)", col = "Business review", unit = "pct", decimals = 0 }

  [[eval.metric]]
  id = "ate_fixbiz_worse"
  label = { zh = "经营分析修复后：按题看变差的题数", en = "Business review after the fix: tasks that got worse" }
  extractor = "text_value"
  args = { path = "agent-trace-eval-public/eval/results/summary.md", label = "Per task, fix-biz better on", nth = 1 }
  direction = "lower"

[[eval]]
id = "judge"
name = { zh = "判官校准和总花费", en = "Judge calibration and total spend" }
date = "2026-11-18"
data = { zh = "规则查不了的 7 条标准，按写好的指南每个答案判两遍；先在 12 条写好结论的校准答案上检验，再判基线的答案。判断项不影响任务成功。", en = "The 7 criteria rules cannot check are judged twice per answer against a written guide, first on 12 calibration answers with written verdicts, then on the base answers. Judged items do not affect task success." }
items = { zh = "校准答案 12 条；基线答案 88 条", en = "12 calibration answers; 88 base answers" }
runs = { zh = "每个答案判 2 遍", en = "2 judgements per answer" }
setup = { zh = "claude-haiku-5-5，effort medium", en = "claude-haiku-5-5, effort medium" }
frozen = { zh = "`eval/PREREGISTRATION.md`", en = "`eval/PREREGISTRATION.md`" }
takeaway = { zh = "两遍判断大多一致。判断项补出了规则看不见的两件事：改好的广告新加了需要证明的卖点词，规则检查却通过了；平静的周里“继续观察”被判不合格，是指南本身没写到这种情况，不是 Agent 的问题。", en = "The two passes mostly agree. The judged items add two things rules cannot see: corrected ads that add new selling words needing proof pass the rule checks; and \"keep watching\" in quiet weeks fails, a gap in the guide rather than in the agent." }

  [[eval.metric]]
  id = "ate_judge_calib"
  label = { zh = "校准答案：和写好的结论一致（更正后）", en = "Calibration: agreement with the written verdicts (after the correction)" }
  extractor = "text_count_ratio"
  args = { path = "agent-trace-eval-public/eval/results/facts.md", label = "Judge calibration:", k_nth = 3, n_nth = 4 }

  [[eval.metric]]
  id = "ate_judge_calib_raw"
  label = { zh = "校准答案：和写好的结论一致（原样）", en = "Calibration: agreement with the written verdicts (as written)" }
  extractor = "text_count_ratio"
  args = { path = "agent-trace-eval-public/eval/results/facts.md", label = "Judge calibration:", k_nth = 1, n_nth = 2 }
  direction = "none"

  [[eval.metric]]
  id = "ate_judge_agree"
  label = { zh = "基线答案：两遍判断一致", en = "Base answers: the two passes agree" }
  extractor = "text_count_ratio"
  args = { path = "agent-trace-eval-public/eval/results/facts.md", label = "Judge on base:", k_nth = 1, n_nth = 2 }

  [[eval.metric]]
  id = "ate_cost_total"
  label = { zh = "全部花费（所有运行、判官和试跑）", en = "Total spend (all runs, the judge and the smoke test)" }
  extractor = "text_value"
  args = { path = "agent-trace-eval-public/eval/results/facts.md", label = "Total spend, all runs, the judge and the smoke test:", unit = "usd", decimals = 2 }
  direction = "lower"

[[limitation]]
text = { zh = "每题只跑三次，题目是为这套评测新写的，区间很宽：经营分析任务成功 {ate_biz_success:full}；按题比较只靠三次试验。", en = "Three trials per task over tasks written for this bench, so intervals are wide: business review task success {ate_biz_success:full}; per-task comparisons rest on three trials each." }
advice = { zh = "重要的结论多跑几次、加新题再确认。", en = "Confirm the important findings with more trials and new tasks." }

[[limitation]]
text = { zh = "题目是合成或虚构的，出自运行它的同一个项目；有两道题的题目或答案本身有问题，照实留在分数里。", en = "The tasks are synthetic or fictional and come from the same project that runs them; two have a problem in the task or the key, kept in the scores." }
advice = { zh = "给那两道题改名或重建后重跑，并用真实业务里已有结论的样本另建一组题。", en = "Fix and re-run those two tasks, and build another set from real work with settled outcomes." }

[[limitation]]
text = { zh = "判官和被测的 Agent 是同一个模型，指南在平静的周上有漏洞；判断项不影响任务成功，也没有另做人工评分。", en = "The judge is the model under evaluation, and its guide has a gap on quiet weeks; judged items do not affect task success, and no human ratings were collected." }
advice = { zh = "补上指南的漏洞，换一个不同的模型做第二判官对照。", en = "Close the gap in the guide and add a second judge from a different model." }

[[limitation]]
text = { zh = "两个修复只在写它们的那组题上验证过；时延只来自基线第一次走普通接口的试验，每题一次。", en = "The fixes were checked only on the tasks they were written for; latency comes from the base standard-API trials only, one per task." }
advice = { zh = "用新题检验修复能不能推广，再把规则搬进代码后重测退款类的题。", en = "Test the fixes on new tasks, and re-test the refund tasks after the rules move into code." }

