items = { zh = "10 个热点，每组 20 次", en = "10 trends, 20 runs per arm" }
runs = { zh = "每个每组 2 遍", en = "2 runs per case per arm" }
setup = { zh = "claude-haiku-5-5，effort medium，批量接口", en = "claude-haiku-5-5, effort medium, Message Batches API" }
frozen = { zh = "`eval/trend-topic-check/PREREGISTRATION.md`", en = "`eval/trend-topic-check/PREREGISTRATION.md`" }
takeaway = { zh = "两组的出处大多核对得上；差别在有伤亡的事件和数字：不装 Skill 时给伤亡事件出了营销卡，也有数字不在引文里。", en = "Most sources check out in both arms; the difference is in casualty events and numbers: without the skill the model made marketing cards for casualty events, and some numbers were not in their quotes." }

