[[limitation]]
text = { zh = "题目都是合成的，写题时就想着 Skill 能查出来的问题；真实音频、口音、背景音乐和多人说话都没覆盖。", en = "All items are synthetic and written with the skills' checks in mind; real audio, accents, music and several speakers are not covered." }
advice = { zh = "上线前拿真实视频的自动字幕和真实热点再测一批。", en = "Before release, test again on real auto-captions and real trends." }

[[limitation]]
text = { zh = "一个模型，每题每组两遍，差一两题算噪声。", en = "One model and two runs per item per arm; a difference of one or two items is noise." }
advice = { zh = "换模型或改 effort 时重新跑同一套题。", en = "Run the same items again after a model or effort change." }

[[limitation]]
text = { zh = "分镜的差别只在请求不写语速时出现：写明语速时不装 Skill 也有 {shot_v1_plain}。", en = "The shot-list gap appears only when the request gives no rates: with the rates stated, even without the skill {shot_v1_plain} passed." }
advice = { zh = "看用户平时怎么提需求，决定这个 Skill 值不值得默认装上。", en = "Look at how users actually ask before deciding whether to install this skill by default." }

[[limitation]]
text = { zh = "热点选题只查事实的出处和伤亡事件，不评选题的创意和是否适合账号。", en = "Trend topics checks only the sources of facts and casualty events, not the quality of the ideas or their fit to the account." }
advice = { zh = "创意和账号是否合适另定评分规则再测。", en = "Write separate scoring rules for ideas and account fit, then test." }

