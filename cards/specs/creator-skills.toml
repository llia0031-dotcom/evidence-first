  [[eval.metric]]
  id = "trend_numq_skill"
  label = { zh = "数字不在引文里的事实（装 Skill）", en = "Facts with a number not in the quote (with the skill)" }
  extractor = "json_counts"
  args = { path = "creator-skills-public/eval/trend-topic-check/results/scores.json", at = ["arms", "skill"], num = "number_not_in_quote", den = "facts" }
  direction = "lower"

  [[eval.metric]]
