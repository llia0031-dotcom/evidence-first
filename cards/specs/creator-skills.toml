did = { zh = "我做了三个给短视频创作者用的 Agent Skill：字幕对稿、分镜核对、热点选题。每个都带一个核对脚本，结果交出去之前先查一遍。每个都和不装 Skill 的同一个模型在事先定好答案的题上比较，计划和预测跑前冻结。", en = "I built three Agent Skills for short-video creators: subtitle checking, shot-list checking and trend topics. Each carries a checking script that runs before anything is handed back. Each was compared with the same model without the skill on items whose answers were fixed in advance, with plans and predictions frozen before the runs." }
name = { zh = "创作者 Skill 合集", en = "Creator skills" }
problem = { zh = "创作者每周都要对字幕、排分镜、追热点；交给 AI 助手做时，字幕会不会被改错、分镜里的口播念不念得完、热点选题卡上的事实站不站得住", en = "Creators fix subtitles, plan shot lists and chase trends every week; when an assistant does it, are the subtitles changed wrongly, can each shot's voiceover be spoken in time, and do the facts on a trend card hold up?" }
primary_metric = { zh = "字幕：改好的文件完全正确；分镜：四项检查全过；热点：有伤亡的事件处理得当", en = "Subtitles: corrected files fully right; shot lists: all four checks pass; trends: events with casualties handled correctly" }
headline = [
  { zh = "改好的字幕文件完全正确：装 Skill {sub_perfect_skill}，不装 {sub_perfect_plain}", en = "Corrected subtitle files fully right: with the skill {sub_perfect_skill}, without {sub_perfect_plain}" },
  { zh = "请求里不写语速时，分镜四项全过：装 Skill {shot_v2_skill}，不装 {shot_v2_plain}；写明语速时不装也有 {shot_v1_plain}", en = "Shot lists passing all four checks when the request gives no rates: with the skill {shot_v2_skill}, without {shot_v2_plain}; with the rates stated, even without it {shot_v1_plain}" },
  { zh = "有伤亡的热点事件不出营销选题卡：装 Skill {trend_sensitive_skill}，不装 {trend_sensitive_plain}", en = "Trends involving casualties get no marketing cards: with the skill {trend_sensitive_skill}, without {trend_sensitive_plain}" },
]
summary = { zh = "三个给短视频创作者用的 Agent Skill，各带一个只用 Python 标准库的核对脚本：字幕对稿把自动字幕逐条和口播稿比、按阅读速度和时间轴标准查；分镜核对查每个镜头的口播念不念得完、稿子一句不少、总时长对得上；热点选题查每张选题卡上的事实，链接打得开、标题对得上、引文在页面里、数字在引文里、文章够新。每个都和不装 Skill 的同一个模型比较，题目和答案在写题时定好，都是虚构的创作场景。", en = "Three Agent Skills for short-video creators, each with a checking script that uses only the Python standard library. Subtitle checking compares every auto-caption with the script and checks reading speed and timing; shot-list checking checks that each shot's voiceover can be spoken in time, that no line of the script is lost and that the total length fits; trend topics checks every fact on a topic card: the link opens, the title matches, the quote is on the page, the numbers are in the quote and the page is recent. Each is compared with the same model without the skill, on fictional creator scenarios whose answers were fixed when they were written." }
core_link = { zh = "热点选题的引文匹配复制自 evidence-check 的核对脚本，规则相同：引文要逐字出自页面，数字要在引文里。", en = "Trend topics copies its quote matching from the evidence-check script, with the same rules: a quote must come word for word from the page, and the numbers must be in the quote." }
models = { zh = "两组都用 claude-haiku-5-5（effort medium），同一条用户消息；评测走批量接口。", en = "Both arms use claude-haiku-5-5 (effort medium) with the same user message; evaluations go through the Message Batches API." }
iteration = { zh = ["字幕对稿：两组都能改对听错的字；差别在别的地方，不装 Skill 时常改动时间轴、把口播时临时改的话改回原稿，装了以后两样都不碰。", "分镜核对第一轮（请求里写明语速和计数方法）：不装 Skill 也几乎全过（{shot_v1_plain}），预测的“最多一半”没成立，题目到顶了。", "分镜核对第二轮（新写的题，请求里不写语速，像创作者平时那样问）：不装 Skill 一张都没过（{shot_v2_plain}），装了全过（{shot_v2_skill}）。", "热点选题：两组的出处大多核对得上；不装 Skill 时会给有伤亡的事件出营销卡，数字也偶尔不在引文里。"], en = ["Subtitles: both arms fix the misheard words; the difference lies elsewhere, as without the skill the model often moves timings or turns ad-libs back into the script, and with it does neither.", "Shot lists, round one (the request states the rates and how to count): even without the skill almost every list passed ({shot_v1_plain}); the predicted \"at most half\" did not hold, a ceiling.", "Shot lists, round two (new items, the request gives no rates, as creators usually ask): without the skill none passed ({shot_v2_plain}), with it all did ({shot_v2_skill}).", "Trend topics: most sources check out in both arms; without the skill the model makes marketing cards for events with casualties, and a number is sometimes missing from its quote."] }
conclusion = { zh = "三个 Skill 的作用都在核对这一步：字幕不再被改动时间轴和口播原话；分镜的差别要到请求不写语速时才显出来；热点选题遇到有伤亡的事件不出营销卡。代价是多调用几次模型，热点选题的费用约是不装的 {trend_cost_ratio}。", en = "In all three skills the value is in the check: subtitles no longer lose their timings or the speaker's own words; the shot-list difference only shows when the request gives no rates; trend topics make no marketing cards for events with casualties. The price is a few more model calls; trend topics cost about {trend_cost_ratio} as much as without the skill." }
short_name = { zh = "创作者 Skill", en = "Creator skills" }
card_title = { zh = "给短视频创作者的三个 Skill，交出去前先核对", en = "Three creator skills that check before they hand back" }
assumed = { zh = "以为不装 Skill 的分镜最多一半能过", en = "Expected at most half of the shot lists without the skill to pass" }
showed = { zh = "写明语速时几乎都过（{shot_v1_plain}）；不写语速时一张都没过（{shot_v2_plain}）", en = "With the rates stated almost all passed ({shot_v1_plain}); with no rates given none did ({shot_v2_plain})" }
result_line = { zh = "装上 Skill 后，改好的字幕文件 {sub_perfect_skill} 完全正确，不装只有 {sub_perfect_plain}", en = "With the skill, corrected subtitle files were fully right {sub_perfect_skill}; without it, {sub_perfect_plain}" }
key_numbers = [{ metric = "sub_perfect_skill", label = { zh = "改好的字幕文件全对（不装 {sub_perfect_plain}）", en = "Corrected subtitle files fully right (without the skill: {sub_perfect_plain})" } }, { metric = "shot_v2_skill", label = { zh = "不写语速时分镜全过（不装 {shot_v2_plain}）", en = "Shot lists passing with no rates given (without: {shot_v2_plain})" } }, { metric = "trend_sensitive_skill", label = { zh = "伤亡事件不出营销卡（不装 {trend_sensitive_plain}）", en = "No marketing cards for casualty events (without: {trend_sensitive_plain})" } }]
timeline = [
  { date = "2026-11-17", label = { zh = "字幕对稿", en = "Subtitles" }, text = { zh = "不再改时间轴和口播原话", en = "Timings and spoken words left alone" }, before = "sub_perfect_plain", after = "sub_perfect_skill", adopted = true },
  { date = "2026-11-17", label = { zh = "分镜第一轮", en = "Shot lists, round one" }, text = { zh = "写明语速时不装也几乎全过", en = "With rates stated, near ceiling without it" }, before = "shot_v1_plain", after = "shot_v1_skill" },
  { date = "2026-11-17", label = { zh = "分镜第二轮", en = "Shot lists, round two" }, text = { zh = "不写语速时差别才出来", en = "The gap shows when no rates are given" }, before = "shot_v2_plain", after = "shot_v2_skill", adopted = true },
  { date = "2026-11-17", label = { zh = "热点选题", en = "Trend topics" }, text = { zh = "有伤亡的事件不出营销卡", en = "No marketing cards for casualty events" }, before = "trend_sensitive_plain", after = "trend_sensitive_skill", adopted = true },
]

