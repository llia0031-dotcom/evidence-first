[[eval]]
id = "subtitle"
name = { zh = "字幕对稿：自动字幕对回口播稿", en = "Subtitle checking: auto-captions against the script" }
date = "2026-11-17"
data = { zh = "10 段口播稿（中文 6、英文 4）切成自动字幕，埋了听错的字、临时改说的话、漏念的句子和时间轴错误；答案写题时定好。请求里写明“字幕要和我实际说的一致、不要改时间轴”。", en = "10 voiceover scripts (6 Chinese, 4 English) cut into auto-captions, with misheard words, ad-libs, skipped sentences and timing errors planted; answers fixed when the cases were built. The request says the subtitles must match what was said and the timings must not change." }
items = { zh = "10 段字幕，每组 20 次", en = "10 subtitle files, 20 runs per arm" }
runs = { zh = "每段每组 2 遍", en = "2 runs per case per arm" }
setup = { zh = "claude-haiku-5-5，effort medium，批量接口", en = "claude-haiku-5-5, effort medium, Message Batches API" }
frozen = { zh = "`eval/subtitle-check/PREREGISTRATION.md`", en = "`eval/subtitle-check/PREREGISTRATION.md`" }
takeaway = { zh = "两组都能改对听错的字；不装 Skill 时常动时间轴、把临时改说的话改回原稿，所以改好的文件很少完全正确。", en = "Both arms fix the misheard words; without the skill the model often moves timings and turns ad-libs back into the script, so few corrected files are fully right." }

  [[eval.metric]]
  id = "sub_perfect_plain"
  label = { zh = "改好的字幕文件完全正确（不装 Skill）", en = "Corrected files fully right (without the skill)" }
  extractor = "md_cell"
  args = { path = "creator-skills-public/eval/subtitle-check/results/run-2026-11-17.summary.md", row = "Perfect corrected files", col = "plain" }

  [[eval.metric]]
  id = "sub_perfect_skill"
  label = { zh = "改好的字幕文件完全正确（装 Skill）", en = "Corrected files fully right (with the skill)" }
  extractor = "md_cell"
  args = { path = "creator-skills-public/eval/subtitle-check/results/run-2026-11-17.summary.md", row = "Perfect corrected files", col = "skill" }

  [[eval.metric]]
  id = "sub_timing_plain"
  label = { zh = "时间轴没被改动（不装 Skill）", en = "Timings kept (without the skill)" }
  extractor = "md_cell"
  args = { path = "creator-skills-public/eval/subtitle-check/results/run-2026-11-17.summary.md", row = "Timings kept (same cues, same times)", col = "plain" }

  [[eval.metric]]
  id = "sub_timing_skill"
  label = { zh = "时间轴没被改动（装 Skill）", en = "Timings kept (with the skill)" }
  extractor = "md_cell"
  args = { path = "creator-skills-public/eval/subtitle-check/results/run-2026-11-17.summary.md", row = "Timings kept (same cues, same times)", col = "skill" }

  [[eval.metric]]
  id = "sub_said_plain"
  label = { zh = "临时改说的话照实保留（不装 Skill）", en = "Ad-libs kept as said (without the skill)" }
  extractor = "md_cell"
  args = { path = "creator-skills-public/eval/subtitle-check/results/run-2026-11-17.summary.md", row = "Said-differently cues kept as said", col = "plain" }

  [[eval.metric]]
  id = "sub_said_skill"
  label = { zh = "临时改说的话照实保留（装 Skill）", en = "Ad-libs kept as said (with the skill)" }
  extractor = "md_cell"
  args = { path = "creator-skills-public/eval/subtitle-check/results/run-2026-11-17.summary.md", row = "Said-differently cues kept as said", col = "skill" }

