[[limitation]]
text = { zh = "自己写的题到顶了：留出集两组都接近满分，难题集两组都全对，分不出 Agent 和单个提示词谁更好。", en = "Written items hit the ceiling: both arms are near-perfect on the held-out set and fully right on the harder set, so they cannot separate the agent from the single prompt." }
advice = { zh = "要分高低，用不是自己写的题：更多真实裁决、更长的视频，或模型没见过的规则。", en = "To separate them, use items the author did not write: more real rulings, longer videos, or rules the model has not seen." }

[[limitation]]
text = { zh = "Agent 比单个提示词更容易误拒陷阱：留出集陷阱放行 {heldout_traps_agent}，单个提示词 {heldout_traps_oneshot}；Agent 的费用也更高。", en = "The agent rejects more traps: traps approved {heldout_traps_agent} against {heldout_traps_oneshot} for the single prompt, and it costs more." }
advice = { zh = "合规但像违规的广告（送达保证、文化遗产名录、定价）要给 Agent 补正面例子或条款说明。", en = "Add positive examples or clause notes for compliant ads that look like violations (delivery guarantees, heritage listings, set prices)." }

[[limitation]]
text = { zh = "真实广告上的错大多来自规则不同：英国判不违规的酒类广告，按 TikTok 政策要写酒精度，两组都拒了。", en = "Most errors on real ads come from different rules: alcohol ads the ASA cleared lack the alcohol-content line TikTok requires, and both arms rejected them." }
advice = { zh = "上线时政策库要和执行规则的那一方一致；跨市场时按市场分库。", en = "Keep the policy library identical to the rules being enforced; split it by market." }

[[limitation]]
text = { zh = "多轮改稿的题只有 12 条短文字广告、一个模型；相差一两段对话属于噪声。", en = "Each multi-turn check uses 12 short text ads and one model; a difference of one or two conversations is noise." }
advice = { zh = "下一版改稿提示词上线前，用图片广告和更长的文案再测一轮。", en = "Before the next advice prompt ships, test it on image ads and longer captions." }

[[limitation]]
text = { zh = "开源审核模型一张图要几分钟，不给条款和原话；SafeGuard-VL-RL 每张图约 {img_safeguard_latency}。", en = "The open-source moderation model takes minutes per image and gives no clause or quote; SafeGuard-VL-RL takes about {img_safeguard_latency} per image." }
advice = { zh = "开源模型适合当便宜的第一道筛子，拿不准的再交给带依据的审核。", en = "Use open-source models as a cheap first filter and pass uncertain ads to the grounded review." }

