[[eval]]
id = "real_en"
name = { zh = "真实广告（英文）：英国广告标准局 30 份公开裁决", en = "Real ads (English): 30 published UK ASA rulings" }
date = "2026-11-14"
data = { zh = "答案由监管机构定：裁决“违规”或“不违规”。模型读的是裁决里对广告的文字描述，不是广告本身；监管规则和本项目的政策库不完全一样。", en = "Answers come from the regulator: upheld or not upheld. The arms read the ruling's description of the ad, not the ad, and the regulator's code differs from this project's policy library." }
items = { zh = "30 份裁决（7 份判不违规），每组 2 遍", en = "30 rulings (7 not upheld), 2 runs per arm" }
runs = { zh = "每组 2 遍", en = "2 runs per arm" }
setup = { zh = "claude-haiku-5-5，批量接口（半价）", en = "claude-haiku-5-5, Message Batches API (half price)" }
frozen = { zh = "`eval/PREREGISTRATION.md` 真实广告一节；题目原文不公开，只公开汇总", en = "`eval/PREREGISTRATION.md`, real-ads section; item text is not published, only the summary" }
takeaway = { zh = "两组不再满分但仍接近；Agent 更严：违规抓得更全，也多拒了合法的。大部分错来自监管规则和政策库不同。", en = "Neither arm is perfect, and they stay close; the agent is stricter, catching more violations and rejecting more compliant ads. Most errors come from the regulator's rules differing from the policy library." }

  [[eval.metric]]
  id = "real_en_oneshot"
  label = { zh = "判对（单个提示词）", en = "Decisions right (single prompt)" }
  extractor = "json_counts"
  args = { path = "grounded-review-public/eval/results/real-2026-11-14.summary.json", arm = "oneshot", num = ["tp", "tn"], den = "items" }

  [[eval.metric]]
  id = "real_en_agent"
