id = "grounded-review"
order = 6
layer = "judgement"
status = "public"
card_version = "1.1"
updated = "2026-11-15"
period = "2026-11-13 – 2026-11-15"
team = "Liang Liyuan"
stack = { zh = "Python、RapidOCR、BM25、evidence-check、Transformers（对比组）、批量接口", en = "Python, RapidOCR, BM25, evidence-check, Transformers (baselines), Message Batches API" }
did = { zh = "我从官方原文整理了 32 条政策条款，写了带陷阱的留出集，做了能查条款、引原文、多轮改稿和复审的 Agent，并和单个提示词、违禁词表、开源审核模型比较；改稿建议从 v1 迭代到 v1.3；最后换成监管机构和法院定答案的真实广告。", en = "I extracted 32 policy clauses from official sources, wrote a held-out set with traps, built an agent that looks up clauses, quotes them, revises and re-reviews over several turns, and compared it with a single prompt, a banned-word list and open-source moderation models; iterated the advice from v1 to v1.3; then switched to real ads judged by regulators and courts." }
name = { zh = "有据审核（广告审核 Agent）", en = "Grounded Review (ad-review agent)" }
problem = { zh = "广告审核要说得出违反哪一条、是哪几个字违反的，而不只是给“通过 / 拒绝”", en = "An ad decision should name the rule and the exact words that break it, not just approve or reject" }
primary_metric = { zh = "判对率（放行和拒绝都算）；违规拦截率；条款引对率", en = "Decisions right (approve and reject); violations caught; clauses cited correctly" }
headline = [
  { zh = "留出集判对：单个提示词 {heldout_oneshot}，Agent {heldout_agent}", en = "Held-out decisions right: single prompt {heldout_oneshot}, agent {heldout_agent}" },
  { zh = "真实广告（英国 ASA 裁决）：{real_en_oneshot} 和 {real_en_agent}", en = "Real ads (UK ASA rulings): {real_en_oneshot} and {real_en_agent}" },
  { zh = "改稿字段写错：{mt4_v11_fault} → {mt4_v13_fault}（v1.3）", en = "Advice fields filled wrongly: {mt4_v11_fault} → {mt4_v13_fault} (v1.3)" },
]
links = [
  { label = { zh = "代码和报告", en = "Code and report" }, url = "https://github.com/Jason-d-e/grounded-review" },
]
summary = { zh = "审核广告的 Agent：读文案和图片里的字，在 32 条政策条款里查依据，给出放行或拒绝；每处违规附类别、条款、违规原话和条款原文，引文先过 evidence-check 的核对脚本才算数。广告主追问时，它写修改后的版本，再复审广告主自己改的版本。评测对比两组：把材料一次交给模型的单个提示词，和带工具的 Agent。", en = "An agent that reviews ads: it reads the caption and the words in the image, looks up 32 policy clauses, and approves or rejects. Every violation carries a category, the clause, the offending words and the clause text, and every quote must pass the evidence-check script before it counts. When the advertiser asks, it writes a corrected version and re-reviews the advertiser's own revision. The evaluation compares two arms: a single prompt with all material, and a tool-using agent." }
core_link = { zh = "每段广告引文和条款引文都交给 evidence-check 的核对脚本；不是逐字出自原文的引文在回答给出之前就被拦下。", en = "Every ad quote and clause quote goes through the evidence-check script; a quote that is not word for word in its source is stopped before the answer is shown." }
models = { zh = "两组都用 claude-haiku-5-5（effort medium），同一份输出格式。对比组：违禁词表、CLIP、SigLIP 2、SafeGuard-VL-RL（本机运行）。", en = "Both arms use claude-haiku-5-5 (effort medium) with one output format. Baselines: a banned-word list, CLIP, SigLIP 2 and SafeGuard-VL-RL (run locally)." }

iteration = { zh = ["改稿建议 v1.1：改后版本不再留模板占位符，{mt2_v1_placeholder} → {mt2_v11_placeholder}。", "v1.2：字段填错就退回重交，没用（{mt3_v11_field} 对 {mt3_v12_field}），不采用。", "v1.3：先填修改后的文案再写说明，字段写错 {mt4_v11_fault} → {mt4_v13_fault}，费用不变，采用。", "题目来源：自己写的留出集和难题集两组都到顶，换成监管机构和法院定答案的真实广告后才分出差别。"], en = ["Advice v1.1: no template placeholders left in corrected versions, {mt2_v1_placeholder} → {mt2_v11_placeholder}.", "v1.2: sending malformed advice back did not help ({mt3_v11_field} vs {mt3_v12_field}) and was dropped.", "v1.3: corrected caption before the explanation; advice fields filled wrongly {mt4_v11_fault} → {mt4_v13_fault} at the same cost; adopted.", "Item sources: both arms hit the ceiling on written items, and only real ads judged by regulators and courts separated them."] }

conclusion = { zh = "自己写的题两组都到顶；换成真实广告后，Agent 比单个提示词更严，大部分错来自监管规则和政策库不同。", en = "Both arms hit the ceiling on written items; on real ads the agent is stricter than the single prompt, and most errors come from the regulator's rules differing from the policy library." }

short_name = { zh = "有据审核", en = "Grounded Review" }
card_title = { zh = "广告审核说清违反哪一条、是哪几个字", en = "Ad review that names the rule and the exact words" }
assumed = { zh = "以为会漏在小字、小国旗和画出来的喝酒场景上", en = "Expected misses on small print, small flags and drawn drinking scenes" }
showed = { zh = "这些一次都没漏；自己写的题到顶，换成真实广告才分出差别", en = "None was missed; written items hit the ceiling and only real ads separated the arms" }
result_line = { zh = "对照英国监管机构的真实裁决判对 {real_en_agent}，并指出违反哪条规定、哪几个字", en = "Matched the UK regulator's real rulings on {real_en_agent} ads, naming the rule and the exact words" }
key_numbers = [{ metric = "heldout_caught_agent", label = { zh = "违规广告全部拦下（自己写的题）", en = "Violating ads stopped (written test ads)" } }, { metric = "real_en_agent", label = { zh = "对照英国监管机构的真实裁决，判对", en = "Agreed with the UK regulator's real rulings" } }, { metric = "mt4_v13_fault", label = { zh = "改稿时文案填错位置（改进前 {mt4_v11_fault}）", en = "Corrected copy put in the wrong field (before: {mt4_v11_fault})" } }]
timeline = [
  { date = "2026-11-13", label = { zh = "v1.1", en = "v1.1" }, text = { zh = "改后版本不留模板占位符", en = "No template placeholders left" }, before = "mt2_v1_placeholder", after = "mt2_v11_placeholder", adopted = true },
  { date = "2026-11-13", label = { zh = "v1.2", en = "v1.2" }, text = { zh = "填错退回重交，没用", en = "Sending it back did not help" }, before = "mt3_v11_field", after = "mt3_v12_field", adopted = false },
  { date = "2026-11-14", label = { zh = "v1.3", en = "v1.3" }, text = { zh = "先填修改后的文案，再写说明", en = "Corrected caption before the explanation" }, before = "mt4_v11_fault", after = "mt4_v13_fault", adopted = true },
  { date = "2026-11-14", label = { zh = "真实广告", en = "Real ads" }, text = { zh = "换成监管机构和法院定答案的广告", en = "Ads judged by regulators and courts" } },
]

[uses]
zh = [
  "给审核员一个带依据的初判：违反哪一条、哪几个字，审核员对照原文就能确认。",
  "给广告主解释为什么被拒、怎么改，并复审改后的版本。",
  "当作“带工具的 Agent 和单个提示词谁更好”的对照评测样例。",
]
en = [
  "Give a reviewer a first decision with its grounds: which clause and which words, checkable against the source.",
  "Explain a rejection to the advertiser, suggest a fix and re-review the revision.",
  "Serve as a worked comparison of a tool-using agent against a single prompt.",
]

[out_of_scope]
zh = [
  "不能代替平台的完整政策：政策库是 32 条的节选，TikTok 各市场的专门规则没有收。",
  "不是线上流量的测量：留出集和难题集都是自己写的题，真实广告只有公开裁决的文字描述。",
  "不判断证据本身真不真：广告里“经临床验证”这类说法，要看广告主的证据，模型看不到。",
]
en = [
  "Not a platform's full policy set: the library is a 32-clause excerpt and leaves out market-specific TikTok rules.",
  "Not a measurement on live traffic: the held-out and hard sets are written for the project, and the real ads are published descriptions in regulator rulings.",
  "Does not judge the advertiser's evidence: claims such as \"clinically proven\" depend on documents the model never sees.",
]

[judge]
zh = [
  "判对、拦截、条款是否引对都是按事先定好的答案用脚本算的，没有用评分器。",
  "多轮任务里“改后的版本能不能通过”由另一次单个提示词复审来判；这个复审没有单独校准过，参考依据是同一组在留出集上的判对 {heldout_oneshot}。",
]
en = [
  "Decisions, catches and clause citations are scored by script against answers fixed in advance; no grader is used.",
  "In the multi-turn task, whether a corrected version passes is judged by a separate single-prompt review. That review was not calibrated on its own; the nearest evidence is the same arm's {heldout_oneshot} on the held-out set.",
]

[[eval]]
id = "heldout"
name = { zh = "留出集 v1（96 条自己写的广告）", en = "Held-out set v1 (96 written ads)" }
date = "2026-11-13"
data = { zh = "中英各半的图文广告，含专门写来骗模型的“陷阱”（看着像违规、其实合规）。答案在写题时定好；跑之前冻结题目、代码和打分脚本的哈希。", en = "Image and text ads, half Chinese and half English, including traps that look like violations but comply. Answers were fixed when the items were written; item, code and scorer hashes were frozen before the run." }
items = { zh = "96 条广告，每组跑两遍，共 {heldout_oneshot:n} 次判断", en = "96 ads, two runs per arm, {heldout_oneshot:n} decisions per arm" }
runs = { zh = "每组 2 遍；比例按两遍合并算，同一题两遍不独立，区间偏窄", en = "2 runs per arm; proportions pool both runs, which are not independent, so intervals are too narrow" }
setup = { zh = "claude-haiku-5-5，普通接口", en = "claude-haiku-5-5, standard API" }
frozen = { zh = "`eval/PREREGISTRATION.md`（计划、预期、文件哈希）", en = "`eval/PREREGISTRATION.md` (plan, expectations, file hashes)" }
takeaway = { zh = "两组都接近满分，说明自己写的题已经到顶；差别在 Agent 多拒了陷阱。", en = "Both arms are near the ceiling on written items; the difference is that the agent rejected more traps." }

  [[eval.metric]]
  id = "heldout_oneshot"
  label = { zh = "判对（单个提示词）", en = "Decisions right (single prompt)" }
  extractor = "json_counts"
  args = { path = "grounded-review-public/eval/results/test-2026-11-13.summary.json", arm = "oneshot", num = ["tp", "tn"], den = "items" }

  [[eval.metric]]
  id = "heldout_agent"
  label = { zh = "判对（Agent）", en = "Decisions right (agent)" }
  extractor = "json_counts"
  args = { path = "grounded-review-public/eval/results/test-2026-11-13.summary.json", arm = "agent", num = ["tp", "tn"], den = "items" }

  [[eval.metric]]
  id = "heldout_caught_oneshot"
  label = { zh = "违规拦下（单个提示词）", en = "Violations caught (single prompt)" }
  extractor = "json_counts"
  args = { path = "grounded-review-public/eval/results/test-2026-11-13.summary.json", arm = "oneshot", num = "tp", den = "items", minus_den = ["tn", "fp"] }

  [[eval.metric]]
  id = "heldout_caught_agent"
  label = { zh = "违规拦下（Agent）", en = "Violations caught (agent)" }
  extractor = "json_counts"
  args = { path = "grounded-review-public/eval/results/test-2026-11-13.summary.json", arm = "agent", num = "tp", den = "items", minus_den = ["tn", "fp"] }

  [[eval.metric]]
  id = "heldout_traps_oneshot"
  label = { zh = "陷阱正确放行（单个提示词）", en = "Traps correctly approved (single prompt)" }
  extractor = "json_counts"
  args = { path = "grounded-review-public/eval/results/test-2026-11-13.summary.json", arm = "oneshot", num = "traps_approved", den = "traps" }

  [[eval.metric]]
  id = "heldout_traps_agent"
  label = { zh = "陷阱正确放行（Agent）", en = "Traps correctly approved (agent)" }
  extractor = "json_counts"
  args = { path = "grounded-review-public/eval/results/test-2026-11-13.summary.json", arm = "agent", num = "traps_approved", den = "traps" }

  [[eval.metric]]
  id = "heldout_clause_oneshot"
  label = { zh = "条款引对（单个提示词）", en = "Clauses cited correctly (single prompt)" }
  extractor = "json_counts"
  args = { path = "grounded-review-public/eval/results/test-2026-11-13.summary.json", arm = "oneshot", num = "clause_right", den = "clause_checked" }

  [[eval.metric]]
  id = "heldout_clause_agent"
  label = { zh = "条款引对（Agent）", en = "Clauses cited correctly (agent)" }
  extractor = "json_counts"
  args = { path = "grounded-review-public/eval/results/test-2026-11-13.summary.json", arm = "agent", num = "clause_right", den = "clause_checked" }

  [[eval.metric]]
  id = "heldout_policyq_oneshot"
  label = { zh = "条款引文通过核对（单个提示词）", en = "Clause quotes passing the check (single prompt)" }
  extractor = "json_counts"
  args = { path = "grounded-review-public/eval/results/test-2026-11-13.summary.json", arm = "oneshot", num = "policy_quotes_ok", den = "policy_quotes" }

  [[eval.metric]]
  id = "heldout_policyq_agent"
  label = { zh = "条款引文通过核对（Agent）", en = "Clause quotes passing the check (agent)" }
  extractor = "json_counts"
  args = { path = "grounded-review-public/eval/results/test-2026-11-13.summary.json", arm = "agent", num = "policy_quotes_ok", den = "policy_quotes" }

  [[eval.metric]]
  id = "heldout_cost_oneshot"
  label = { zh = "每条广告的费用（单个提示词）", en = "Cost per ad (single prompt)" }
  extractor = "json_value"
  args = { path = "grounded-review-public/eval/results/test-2026-11-13.summary.json", keys = ["oneshot", "cost_per_item"], unit = "usd", decimals = 4 }
  direction = "lower"

  [[eval.metric]]
  id = "heldout_cost_agent"
  label = { zh = "每条广告的费用（Agent）", en = "Cost per ad (agent)" }
  extractor = "json_value"
  args = { path = "grounded-review-public/eval/results/test-2026-11-13.summary.json", keys = ["agent", "cost_per_item"], unit = "usd", decimals = 4 }
  direction = "lower"

