[[eval]]
id = "forms"
name = { zh = "表单：在填表界面里逐张填写", en = "Forms: filled in through the form interface" }
date = "2026-11-23"
data = { zh = "四张表单用 KoboToolbox 和 ODK Central 用的转换器 pyxform 转换，并过 ODK Validate；再在本机的 ODK Web Forms 里，用英文和法文、按手机和电脑宽度逐张填写，存下的提交和每月程序读的字段名逐项比对。", en = "The four forms are converted with pyxform, the converter KoboToolbox and ODK Central use, and pass ODK Validate; then each is filled in through ODK Web Forms on a local computer, in English and French, at phone and desktop width, and the saved submissions are compared with the field names the monthly run reads." }
items = { zh = "四张表单的全部题目", en = "Every question of the four forms" }
runs = { zh = "每张表、每种语言和宽度各一遍", en = "Once per form, language and width" }
setup = { zh = "填表脚本；不调用模型", en = "A form-filling script; no model called" }
frozen = { zh = "`forms/xlsform/`", en = "`forms/xlsform/`" }
takeaway = { zh = "每张表都能在填表界面里填完，存下的提交和每月程序读的字段对得上。", en = "Every form can be completed in the form interface, and the saved submissions match the fields the monthly run reads." }

  [[eval.metric]]
  id = "pmk_walk"
  label = { zh = "填表检查通过", en = "Form walk-through checks passed" }
  extractor = "text_count_ratio"
  args = { path = "placement-monitoring-kit-public/results/SUMMARY.md", label = "- form walk-through checks:", k_nth = 0, n_nth = 1 }

  [[eval.metric]]
  id = "pmk_subs"
  label = { zh = "存下的提交和表单、字段对得上", en = "Saved submissions matching the forms and fields" }
  extractor = "text_count_ratio"
  args = { path = "placement-monitoring-kit-public/results/SUMMARY.md", label = "- form walk-through submissions matching the forms and the contract:", k_nth = 0, n_nth = 1 }

  [[eval.metric]]
  id = "pmk_questions"
  label = { zh = "四张表单的题目", en = "Questions in the four forms" }
  extractor = "text_value"
  args = { path = "placement-monitoring-kit-public/results/SUMMARY.md", label = "- questions in all forms:" }
  direction = "none"

  [[eval.metric]]
  id = "pmk_tests"
  label = { zh = "自动测试", en = "Automated tests" }
  extractor = "text_value"
  args = { path = "placement-monitoring-kit-public/results/SUMMARY.md", label = "- tests:" }
  direction = "none"

[[limitation]]
text = { zh = "样例是构造的；还没在真实的项目、真实的 KoboToolbox 或 ODK Central 服务器和 ODK Collect 手机端上用过，只在 Windows 上跑过。", en = "The sample is constructed; the kit has not yet run in a live programme, against a live KoboToolbox or ODK Central server or in ODK Collect, and has run only on Windows." }
advice = { zh = "上线前在团队自己的服务器上建一个测试项目，用几份测试提交把每月流程跑通一次。", en = "Before going live, set up a test project on the team's own server and run the monthly cycle once with a few test submissions." }

[[limitation]]
text = { zh = "法文文字还要请当地讲法语的同事通读一遍；每月回访和接收单位反馈的部分题目没有公认的现成问卷，是这套工具自己的写法，在表里注明了。", en = "The French text still needs a read by a French-speaking colleague in the country; some check-in and host-feedback questions have no recognised instrument and use the kit's own wording, marked as such." }
advice = { zh = "通读后把改动写回表单的 xlsx 再生成；用过一两个月后，照回答情况改题。", en = "Write the changes back into the forms' xlsx and rebuild; after a month or two, revise questions by how they are answered." }

[[version]]
id = "1.0"
date = "2026-11-26"
text = { zh = "第一张卡，照公开仓库 placement-monitoring-kit 的结果文件写。", en = "First card, from the result files in the public placement-monitoring-kit repository." }
