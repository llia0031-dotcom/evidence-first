  "只测了 Seedream 三个版本，不代表别家模型；走的是接口，不是网页版。",
  "每个任务只生成一次；只比较汉字、字母和数字，不比较符号；艺术字体的漏检率没有测。",
  "只有简体中文；没有做买家调研。",
]
en = [
  "Only three Seedream versions were tested, not other vendors' models, and through the API rather than the web app.",
  "One generation per task; only Chinese characters, letters and digits are compared, not symbols; misses on artistic fonts were not measured.",
  "Simplified Chinese only; no buyer research.",
]


[[eval]]
id = "main"
name = { zh = "主评测：16 个图片任务、4 个视频任务", en = "Main evaluation: 16 image tasks and 4 video tasks" }
date = "2026-11-12"
data = { zh = "任务分三档难度（短标题、多行带数字、长文案），任务和评分表在生成前冻结。每个版本每个任务生成一次。", en = "Tasks in three tiers (short title, several lines with numbers, long copy); tasks and rubric frozen before generation. One generation per version per task." }
items = { zh = "每个图片版本 16 张，视频 4 段", en = "16 images per image version, 4 videos" }
runs = { zh = "每个任务生成 1 次；观感评分 3 次", en = "1 generation per task; 3 ratings" }
setup = { zh = "BytePlus 接口，免费额度", en = "BytePlus API, free quota" }
frozen = { zh = "`data/freeze.json`（任务和评分表的哈希）", en = "`data/freeze.json` (task and rubric hashes)" }
takeaway = { zh = "图片里的字基本都写对，4.0 错了一处数字；视频里的字保不住。观感上 4.5 和 4.0 差不多，5.0 lite 明显低。", en = "Image text is almost always right, with one wrong digit from 4.0; video text does not hold. In appearance 4.5 and 4.0 are close and 5.0 lite is clearly lower." }

  [[eval.metric]]
  id = "img_exact_45"
  label = { zh = "文字全对的图片（Seedream 4.5）", en = "Images with exactly right text (Seedream 4.5)" }
  extractor = "ai_tool"
  args = { path = "aigc-scene-eval/report/results.json", section = "image", tool = "seedream45", what = "text_exact" }

  [[eval.metric]]
  id = "img_exact_40"
  label = { zh = "文字全对的图片（Seedream 4.0）", en = "Images with exactly right text (Seedream 4.0)" }
  extractor = "ai_tool"
  args = { path = "aigc-scene-eval/report/results.json", section = "image", tool = "seedream40", what = "text_exact" }

  [[eval.metric]]
  id = "img_exact_50"
  label = { zh = "文字全对的图片（Seedream 5.0 lite）", en = "Images with exactly right text (Seedream 5.0 lite)" }
  extractor = "ai_tool"
  args = { path = "aigc-scene-eval/report/results.json", section = "image", tool = "seedream50lite", what = "text_exact" }

  [[eval.metric]]
  id = "video_exact"
  label = { zh = "文字全对的视频（Seedance 1.0 pro）", en = "Videos with exactly right text (Seedance 1.0 pro)" }
  extractor = "ai_tool"
  args = { path = "aigc-scene-eval/report/results.json", section = "video", tool = "seedance10pro", what = "text_exact" }

  [[eval.metric]]
  id = "rate_45"
  label = { zh = "观感总分（Seedream 4.5，5 分制）", en = "Overall rating (Seedream 4.5, out of 5)" }
  extractor = "ai_tool"
  args = { path = "aigc-scene-eval/report/results.json", section = "image", tool = "seedream45", what = "overall" }

  [[eval.metric]]
  id = "rate_40"
  label = { zh = "观感总分（Seedream 4.0）", en = "Overall rating (Seedream 4.0)" }
  extractor = "ai_tool"
  args = { path = "aigc-scene-eval/report/results.json", section = "image", tool = "seedream40", what = "overall" }

  [[eval.metric]]
  id = "rate_50"
  label = { zh = "观感总分（Seedream 5.0 lite）", en = "Overall rating (Seedream 5.0 lite)" }
  extractor = "ai_tool"
  args = { path = "aigc-scene-eval/report/results.json", section = "image", tool = "seedream50lite", what = "overall" }

  [[eval.metric]]
  id = "usable_45"
  label = { zh = "评为“能直接用”（Seedream 4.5）", en = "Rated usable as is (Seedream 4.5)" }
  extractor = "ai_tool"
  args = { path = "aigc-scene-eval/report/results.json", section = "image", tool = "seedream45", what = "usable" }

  [[eval.metric]]
  id = "usable_50"
  label = { zh = "评为“能直接用”（Seedream 5.0 lite）", en = "Rated usable as is (Seedream 5.0 lite)" }
  extractor = "ai_tool"
  args = { path = "aigc-scene-eval/report/results.json", section = "image", tool = "seedream50lite", what = "usable" }

  [[eval.metric]]
  id = "ocr_self"
  label = { zh = "OCR 自检：已知文字里认错的字", en = "OCR self-check: characters misread in known text" }
  extractor = "json_counts"
  args = { path = "aigc-scene-eval/report/results.json", at = ["ocr_selfcheck"], num = "distance", den = "length" }
  direction = "lower"

  [[eval.metric]]
  id = "ocr_inject"
  label = { zh = "OCR 抓到植入的错字", en = "Planted text errors caught by OCR" }
  extractor = "json_counts"
  args = { path = "aigc-scene-eval/report/results.json", at = ["ocr_inject"], num = "caught", den = "n" }

[[limitation]]
text = { zh = "样本小：16 个图片任务、4 个视频任务，每个只生成一次；视频只有 {video_exact} 段字全对。", en = "Small sample: 16 image and 4 video tasks, one generation each; only {video_exact} videos have exactly right text." }
advice = { zh = "视频里的字后期再叠，不靠模型生成。", en = "Add text to videos in editing rather than relying on generation." }

[[limitation]]
text = { zh = "观感评分没有和人工评分对照；三次评分来自同一种评分方式。", en = "Ratings were not compared with human ratings; all three come from the same rating method." }
advice = { zh = "上线前请几位真实买家盲评一小组作品，看和评分表的结论是否一致。", en = "Before launch, have a few real buyers blind-rate a small set and compare with the rubric." }

[[limitation]]
text = { zh = "提示词小实验只有几张图：写明字色有效，“大号标题、上方留白”不一定管用。", en = "The prompt mini-experiment has only a few images: stating the text colour worked, asking for a large title with top margin did not reliably help." }
advice = { zh = "生成后看一眼标题有没有被裁掉，被裁就重新生成。", en = "After generation, check whether the title was clipped and regenerate if so." }

