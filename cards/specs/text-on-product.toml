id = "text-on-product"
order = 7
layer = "generation"
status = "public"
card_version = "1.1"
updated = "2026-11-15"
period = "2026-11-12 – 2026-11-14"
team = "Liang Liyuan"
stack = { zh = "BytePlus 接口上的 Seedream 和 Seedance、RapidOCR、浏览器端 OCR", en = "Seedream and Seedance through the BytePlus API, RapidOCR, in-browser OCR" }
did = { zh = "我定了 20 个固定任务、生成前冻结评分表，用 OCR 逐字核对画面里的字，并按评分表独立评三次；把结论写成给商家的创作指南，另做了一个在浏览器里查错字、不上传图片的上线前核对工具。", en = "I fixed 20 tasks and froze the rubric before generation, checked the text in every image character by character with OCR and rated each work three times against the rubric; turned the findings into a guide for merchants and built an in-browser pre-listing checker that never uploads the image." }
name = { zh = "AI 生图创作指南：电商主图上的中文字", en = "Text on Product: Chinese copy on AI product images" }
problem = { zh = "用 Seedream 做中文电商主图时，画面里的卖点文字能不能一字不差；怎么写提示词、怎么排版，字最稳；上架前怎么核对", en = "When Seedream makes Chinese product images, does the selling-point text come out exactly; how to write and lay it out so the text holds; how to check before listing" }
primary_metric = { zh = "画面文字全对的图片比例（OCR 逐字核对）；按评分表的观感分", en = "Images whose text is exactly right (character-by-character OCR check); rubric rating" }
headline = [
  { zh = "图片文字全对：Seedream 4.5 {img_exact_45}，4.0 {img_exact_40}，5.0 lite {img_exact_50}", en = "Images with exactly right text: Seedream 4.5 {img_exact_45}, 4.0 {img_exact_40}, 5.0 lite {img_exact_50}" },
  { zh = "图生视频里的字全对：{video_exact}", en = "Image-to-video clips with exactly right text: {video_exact}" },
]
links = [
  { label = { zh = "创作指南", en = "Guide" }, url = "https://llia0031-dotcom.github.io/text-on-product/" },
  { label = { zh = "上线前核对工具", en = "Pre-listing checker" }, url = "https://llia0031-dotcom.github.io/text-on-product/check/" },
  { label = { zh = "代码", en = "Code" }, url = "https://github.com/llia0031-dotcom/text-on-product" },
]
summary = { zh = "用 20 个固定任务（16 张图、4 段视频）测 Seedream 4.0、4.5、5.0 lite 和 Seedance 1.0 pro 画中文卖点文字稳不稳。每张图的文字用 OCR 逐字核对，可疑处对照原图复看；每个作品按评分表独立打 3 次分。结果写成给商家的创作指南，另做了一个浏览器里的上线前核对工具：放进商品图和要求的文字，逐行查哪里不一样、哪里多了字，图片不上传。", en = "Twenty fixed tasks (16 images, 4 videos) test how reliably Seedream 4.0, 4.5 and 5.0 lite and Seedance 1.0 pro render Chinese selling-point text. Text in every image is checked character by character with OCR, with doubtful cases compared against the image; every work is rated three times, independently, against a rubric. The results became a guide for merchants plus an in-browser pre-listing checker: drop in a product image and the required text, and it lists line by line what differs or was added, without uploading the image." }
core_link = { zh = "生成类场景：同样的“逐字核对”思路，用在画面里的字上。它有自己的 OCR 核对，没有调用 evidence-check 的脚本。", en = "The generation scenario: the same word-for-word idea applied to text inside images. It has its own OCR check and does not call the evidence-check script." }
models = { zh = "生成用 BytePlus 接口上的 Seedream 4.0、4.5、5.0 lite 和 Seedance 1.0 pro（免费额度）；OCR 用 RapidOCR（PP-OCRv6）。", en = "Generation with Seedream 4.0, 4.5, 5.0 lite and Seedance 1.0 pro through the BytePlus API (free quota); OCR with RapidOCR (PP-OCRv6)." }

judge = { zh = [
  "文字对不对不靠打分：OCR 逐字比较。OCR 先在已知文字的样张上自检（字错 {ocr_self}），再往正确的图里植入错字检验能不能抓到（{ocr_inject}）。",
  "观感按评分表独立打 3 次，作品顺序打乱、不显示是哪个版本；三次之间的一致性写在项目报告里。没有和人工评分对照，这是局限。",
], en = [
  "Text correctness is not rated: OCR compares character by character. OCR was first self-checked on known text ({ocr_self} characters wrong) and then on images with planted errors ({ocr_inject} caught).",
  "Appearance is rated three times, independently, against a rubric, with works shuffled and versions hidden; agreement between the three is in the project report. There is no comparison with human ratings, which is a limit.",
] }

iteration = { zh = ["主评测之后做了提示词小实验：写明字的颜色有效，被采用；“大号标题、上方留白”不一定管用，改成“生成后看一眼标题有没有被裁”。", "视频里的字三种改法都保不住，指南统一写成“视频里的字后期再叠”。", "对外定位从“版本评测”改成给商家的创作指南，数据不变；另做了上线前核对工具。"], en = ["After the main evaluation, a prompt mini-experiment: stating the text colour worked and was adopted; asking for a large title with top margin did not reliably help, so the guide says to check whether the title was clipped.", "None of three changes kept video text stable, so the guide says to add video text in editing.", "The public framing moved from a version comparison to a guide for merchants, with the same data; a pre-listing checker was added."] }

conclusion = { zh = "图片里的字基本都写对，视频里的字保不住；观感上 4.5 和 4.0 差不多，5.0 lite 明显低。", en = "Image text is almost always right and video text does not hold; in appearance 4.5 and 4.0 are close and 5.0 lite is clearly lower." }

short_name = { zh = "AI 生图指南", en = "Text on Product" }
card_title = { zh = "电商主图上的中文卖点，怎么写字最稳", en = "How to keep Chinese copy right on AI product images" }
assumed = { zh = "以为写明“大号标题、上方留白”，标题就不会被裁掉", en = "Expected a large title with top margin to stop titles being clipped" }
showed = { zh = "写了也不一定管用，标题反而变小；生成后要看一眼", en = "It did not reliably help and titles got smaller; check after generating" }
result_line = { zh = "Seedream 4.5 生成的主图，中文字全写对的 {img_exact_45}；视频里只有 {video_exact}", en = "Seedream 4.5 got every Chinese character right in {img_exact_45} product images; only {video_exact} videos did" }
key_numbers = [{ metric = "img_exact_45", label = { zh = "Seedream 4.5 主图里的字全对", en = "Seedream 4.5 images with every character right" } }, { metric = "video_exact", label = { zh = "图生视频里字全对的片段", en = "Videos with every character right" } }, { metric = "ocr_inject", label = { zh = "故意改错的字，核对时全部抓到", en = "Deliberately wrong characters, all caught" } }]
timeline = [
  { date = "2026-11-12", label = { zh = "主评测", en = "Main evaluation" }, text = { zh = "三个版本、图和视频，生成前冻结", en = "Three versions, rubric frozen first" } },
  { date = "2026-11-14", label = { zh = "写明字色", en = "Text colour" }, text = { zh = "写明字的颜色，对比度明显提高", en = "Stating the colour raised contrast" }, adopted = true },
  { date = "2026-11-14", label = { zh = "大号标题留白", en = "Large title, margin" }, text = { zh = "不一定管用，改成生成后检查", en = "Unreliable; check after generating" }, adopted = false },
  { date = "2026-11-14", label = { zh = "视频里的字", en = "Video text" }, text = { zh = "三种改法都保不住，改为后期叠字", en = "Three tries failed; add text in editing" }, adopted = false },
]

[uses]
zh = [
  "商家写中文主图提示词时参考：哪些写法字最稳，哪些要生成后再看一眼。",
  "上架前用核对工具查图上的字和要求的文字是否一字不差。",
]
en = [
  "Guide merchants writing prompts for Chinese product images: which wording keeps text stable and what to recheck after generation.",
  "Check before listing that the text in the image matches the required copy exactly.",
]

[out_of_scope]
