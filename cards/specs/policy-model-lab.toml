result_line = { zh = "看 16 帧时违规全抓到（{vid_haiku_f16_caught}），只给文案只抓到 {vid_haiku_text_caught}", en = "With 16 frames every violation was caught ({vid_haiku_f16_caught}); with the caption only, {vid_haiku_text_caught}" }
key_numbers = [{ metric = "vid_haiku_f16_caught", label = { zh = "看 16 帧时违规全抓到（只看文案 {vid_haiku_text_caught}）", en = "Violations caught with 16 frames (caption only: {vid_haiku_text_caught})" } }, { metric = "vid_qwen_ocr16", label = { zh = "本机小模型只读帧上的字，判对", en = "Local model reading frame text only: right" } }, { metric = "ft_lora_gr", label = { zh = "合成数据微调的小模型（大模型 {ft_haiku_gr}）", en = "Small model tuned on synthetic ads (large model: {ft_haiku_gr})" } }]
timeline = [
  { date = "2026-11-17", label = { zh = "看什么", en = "What to show" }, text = { zh = "只给文案时违规大多漏掉", en = "Caption only misses most violations" }, before = "vid_haiku_text_caught", after = "vid_haiku_f16_caught", adopted = true },
  { date = "2026-11-17", label = { zh = "本机模型", en = "Local models" }, text = { zh = "读帧上的字和看视频一样准", en = "Frame text as good as the video" }, before = "vid_qwen_video", after = "vid_qwen_ocr16", adopted = true },
  { date = "2026-11-17", label = { zh = "微调", en = "Fine-tuning" }, text = { zh = "小模型追上大模型，离合成数据越远越差", en = "Catches up, weaker far from the synthetic data" }, before = "ft_haiku_gr", after = "ft_lora_gr" },
  { date = "2026-11-17", label = { zh = "真实视频", en = "Real videos" }, text = { zh = "另一平台的真实短视频上核对", en = "Checked on another platform's videos" }, after = "km_qwen" },
]

