team = "Liang Liyuan"
stack = { zh = "Python、PyTorch、LoRA 微调（Qwen3）、本机视觉语言模型（Qwen3.5、Qwen3-VL）、SigLIP 2、mmBERT、OCR、批量接口", en = "Python, PyTorch, LoRA fine-tuning (Qwen3), local vision-language models (Qwen3.5, Qwen3-VL), SigLIP 2, mmBERT, OCR, Message Batches API" }
did = { zh = "我在一台笔记本显卡上按预注册的方案做了三组实验：一条短视频广告要让模型看到什么（文案、封面、抽帧、整段视频、帧上识别的文字）才审得准；用合成广告微调的小模型能不能比得上大模型；再拿 300 条另一平台的真实短视频核对。最后对照近一年的研究写了一份调研报告。", en = "On a laptop GPU I ran three preregistered experiments: what a model needs to see of a short video ad (caption, cover, sampled frames, the whole video, text read off the frames) to review it well; whether small models fine-tuned on synthetic ads match a large model; and a check on 300 real short videos from another platform. A survey of the past year's research closes it." }
name = { zh = "审核模型实验", en = "Policy Model Lab" }
problem = { zh = "按广告政策审核短视频广告，模型要看到什么才够；用合成广告训练的小模型能不能胜任", en = "To review a short video ad against policy, what must a model see, and can a small model trained on synthetic ads do the job?" }
primary_metric = { zh = "判断正确率；违规抓到的比例；合规广告被错拒的比例", en = "Decision accuracy; violations caught; compliant ads wrongly rejected" }
headline = [
  { zh = "视频广告：claude-haiku-5-5 看 16 帧判对 {vid_haiku_f16}，违规全抓到（{vid_haiku_f16_caught}）；只给文案时违规只抓到 {vid_haiku_text_caught}", en = "Video ads: claude-haiku-5-5 with 16 frames was right on {vid_haiku_f16} and caught every violation ({vid_haiku_f16_caught}); with the caption only it caught {vid_haiku_text_caught}" },
  { zh = "本机 Qwen3.5-4B 只看 16 帧上识别出的文字判对 {vid_qwen_ocr16}，和看整段视频（{vid_qwen_video}）一样，每条只要 {vid_qwen_ocr16_s}，看视频要 {vid_qwen_video_s}", en = "Locally, Qwen3.5-4B reading only the text from 16 frames was right on {vid_qwen_ocr16}, the same as watching the whole video ({vid_qwen_video}), in {vid_qwen_ocr16_s} per item against {vid_qwen_video_s}" },
  { zh = "用合成广告微调的 Qwen3-1.7B 在有据审核的测试题上判对 {ft_lora_gr}，和 claude-haiku-5-5（{ft_haiku_gr}）分不出高下（配对差 {ft_diff_haiku} 个百分点）", en = "Qwen3-1.7B fine-tuned on synthetic ads was right on {ft_lora_gr} of Grounded Review's test items, too close to call against claude-haiku-5-5 ({ft_haiku_gr}; paired difference {ft_diff_haiku} points)" },
]
summary = { zh = "按广告政策审核短视频广告的三组实验，都在一台笔记本显卡上跑，方案和预测跑前预注册。第一组比较同一段广告给模型看文案、封面、抽帧、整段视频或帧上识别出的文字时审得准不准；第二组用合成广告微调小模型，在有据审核的测试题、视频文字和真实案例上和大模型比；第三组拿另一平台 300 条真实短视频核对“违不违规”。真实视频和真实案例只公开汇总数字。", en = "Three experiments on reviewing short video ads against policy, all on one laptop GPU, with plans and predictions preregistered. The first compares what a model is shown of the same ad: caption, cover, sampled frames, the whole video, or text read off the frames. The second fine-tunes small models on synthetic ads and compares them with a large model on Grounded Review's test items, video text and real cases. The third checks 300 real short videos from another platform for a yes/no violation call. For the real videos and real cases only totals are published." }
core_link = { zh = "第二组用有据审核的测试题和政策类别做测试集；结论接到有据标注流水线的分流环节上。", en = "The second experiment tests on Grounded Review's items and policy categories; its findings feed the triage step of the Grounded Labelling Pipeline." }
models = { zh = "大模型用 claude-haiku-5-5（批量接口）；本机跑 Qwen3.5-4B、Qwen3-VL-2B、SigLIP 2、mmBERT 和 LoRA 微调的 Qwen3-0.6B、Qwen3-1.7B。", en = "The large model is claude-haiku-5-5 (Message Batches API); locally Qwen3.5-4B, Qwen3-VL-2B, SigLIP 2, mmBERT and LoRA-tuned Qwen3-0.6B and Qwen3-1.7B." }
iteration = { zh = ["看什么：只给文案时违规大多漏掉；抽帧越多抓得越全；claude-haiku-5-5 看 16 帧时违规全抓到。", "本机的 Qwen3.5-4B 只读帧上识别出的文字，和看整段视频一样准，快得多；Qwen3-VL-2B 看 8 帧时把大多数合规广告错拒（{vid_2b_f8_fp}）。", "微调：Qwen3-1.7B 加 LoRA 比不微调高 {ft_diff_zs_gr} 个百分点（有据审核的测试题），和 claude-haiku-5-5 分不出高下；mmBERT 在合成验证集上 {ft_mmbert_val}，到真实案例只剩 {ft_mmbert_real}。", "真实短视频：Qwen3.5-4B 看画面加文字判对 {km_qwen}，claude-haiku-5-5 {km_haiku}；后者把更多正常视频标成违规。"], en = ["What to show: with the caption only most violations are missed; more frames catch more; claude-haiku-5-5 with 16 frames caught every violation.", "Locally, Qwen3.5-4B reading only the text off the frames is as accurate as watching the video and much faster; Qwen3-VL-2B with 8 frames rejected most compliant ads ({vid_2b_f8_fp}).", "Fine-tuning: Qwen3-1.7B with LoRA gains {ft_diff_zs_gr} points over the untuned model on Grounded Review's items and is too close to call against claude-haiku-5-5; mmBERT scores {ft_mmbert_val} on the synthetic validation set but {ft_mmbert_real} on real cases.", "Real short videos: Qwen3.5-4B with frames and text was right on {km_qwen}, claude-haiku-5-5 on {km_haiku}; the latter flagged more fine videos."] }
conclusion = { zh = "审视频广告，关键是让模型看到画面里的字，不一定要看整段视频：帧上识别出的文字就够，而且快得多。用合成广告微调的小模型在相近的题上能追上大模型，但离合成数据越远掉得越多；真实视频上的结论只能算参考，因为题目和标准都来自另一个平台。", en = "For video ads the key is letting the model see the words in the picture, not necessarily the whole video: the text read off the frames is enough and much faster. Small models fine-tuned on synthetic ads catch up with the large model on similar items but fall further behind the further they are from the synthetic data; the real-video results are indicative only, since the items and the standard come from another platform." }
short_name = { zh = "审核模型实验", en = "Policy Model Lab" }
card_title = { zh = "审视频广告，模型要看什么、小模型够不够", en = "What a model must see to review a video ad" }
assumed = { zh = "以为看整段视频才审得最准，帧上的字不够用", en = "Expected watching the whole video to be needed; text from frames to fall short" }
