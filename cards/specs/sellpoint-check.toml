[[eval]]
id = "v1"
name = { zh = "构造测试集 v1（60 条卖点，答案已知）", en = "Constructed set v1 (60 claims, known answers)" }
date = "2026-11-12"
data = { zh = "12 个虚构商品、433 条评价，答案在写题时定好，其中有专门的陷阱评价（看着像证据、其实不是）。题目在真实数据跑完之后由同一作者写成；跑前冻结。", en = "12 fictional products and 433 reviews, answers fixed at writing, with trap reviews that look like evidence but are not. Written after the real-data run by the same author; frozen before the run." }
items = { zh = "60 条卖点", en = "60 claims" }
runs = { zh = "每种做法 1 遍", en = "1 run per method" }
setup = { zh = "claude-haiku-5-5，普通接口", en = "claude-haiku-5-5, standard API" }
frozen = { zh = "`testset/PREREGISTRATION.md`（题目指纹、预期）", en = "`testset/PREREGISTRATION.md` (item fingerprint, expectations)" }

  [[eval.metric]]
  id = "v1_c"
  label = { zh = "判对：全部评价一次给（C，采用）", en = "Correct: all reviews in one call (C, adopted)" }
  extractor = "json_counts"
  args = { path = "sellpoint-check/results/score-testset.json", at = ["arms", "allinone", "all"], num = "correct", den = "n" }

  [[eval.metric]]
  id = "v1_b"
  label = { zh = "判对：逐条判断再汇总（B）", en = "Correct: per-review judging (B)" }
  extractor = "json_counts"
  args = { path = "sellpoint-check/results/score-testset.json", at = ["arms", "praise", "all"], num = "correct", den = "n" }

  [[eval.metric]]
  id = "v1_a"
  label = { zh = "判对：先检索再判断（A）", en = "Correct: retrieve then judge (A)" }
  extractor = "json_counts"
  args = { path = "sellpoint-check/results/score-testset.json", at = ["arms", "retrieval", "all"], num = "correct", den = "n" }

  [[eval.metric]]
  id = "v1_traps_c"
  label = { zh = "陷阱评价被当成证据（C）", en = "Trap reviews cited as evidence (C)" }
  extractor = "json_counts"
  args = { path = "sellpoint-check/results/score-testset.json", at = ["arms", "allinone", "traps"], num = "cited", den = "total" }
  direction = "lower"

[[eval]]
id = "real"
name = { zh = "真实数据（30 个商品，没有标准答案）", en = "Real data (30 products, no answer key)" }
date = "2026-11-12"
data = { zh = "公开研究数据集里的 30 个美妆商品、538 条评价、210 条卖点。没有标准答案，所以比较费用、调用次数，并对每条证据做第二次独立判断。", en = "30 beauty products, 538 reviews and 210 claims from a public research dataset. There is no answer key, so the comparison covers cost and calls, and every piece of evidence gets a second, independent judgement." }
items = { zh = "30 个商品、210 条卖点", en = "30 products, 210 claims" }
runs = { zh = "每种做法 1 遍；A 和 C 另各重跑 1 遍看一致率", en = "1 run per method; A and C were run a second time to measure repeatability" }
setup = { zh = "claude-haiku-5-5，普通接口", en = "claude-haiku-5-5, standard API" }

  [[eval.metric]]
  id = "real_calls_share"
  label = { zh = "调用次数：C 占 B 的比例", en = "Calls: C as a share of B" }
  extractor = "json_ratio"
  args = { path = "sellpoint-check/results/compare-run.json", num_at = ["arms", "allinone", "calls"], den_at = ["arms", "praise", "calls"], decimals = 1 }
  direction = "lower"

  [[eval.metric]]
  id = "real_cost_share"
  label = { zh = "费用：C 占 B 的比例", en = "Cost: C as a share of B" }
  extractor = "json_ratio"
  args = { path = "sellpoint-check/results/compare-run.json", num_at = ["arms", "allinone", "cost_usd"], den_at = ["arms", "praise", "cost_usd"] }
  direction = "lower"

  [[eval.metric]]
  id = "real_audit_c_support"
  label = { zh = "第二次独立判断同意：C 的支持证据", en = "Second judgement agrees: C's supporting evidence" }
  extractor = "json_counts"
  args = { path = "sellpoint-check/results/audit-run.json", at = ["per_arm", "allinone", "support"], num = "agree", den = "n" }

  [[eval.metric]]
  id = "real_audit_c_refute"
  label = { zh = "第二次独立判断同意：C 的反驳证据", en = "Second judgement agrees: C's refuting evidence" }
  extractor = "json_counts"
  args = { path = "sellpoint-check/results/audit-run.json", at = ["per_arm", "allinone", "refute"], num = "agree", den = "n" }

  [[eval.metric]]
  id = "real_audit_a_support"
  label = { zh = "第二次独立判断同意：A 的支持证据", en = "Second judgement agrees: A's supporting evidence" }
  extractor = "json_counts"
  args = { path = "sellpoint-check/results/audit-run.json", at = ["per_arm", "retrieval", "support"], num = "agree", den = "n" }

  [[eval.metric]]
  id = "real_repeat_c"
  label = { zh = "C 跑两遍标签一致", en = "C labels identical across two runs" }
  extractor = "json_value"
  args = { path = "sellpoint-check/results/repeat-run.json", keys = ["rows", 1, "same_label_pct"], unit = "pct", decimals = 1, n_keys = ["rows", 1, "claims"] }

  [[eval.metric]]
  id = "audit_vs_gold"
  label = { zh = "参照：第二次判断在答案已知的题上和答案一致", en = "Reference: the second judgement against known answers" }
  extractor = "json_value"
  args = { path = "sellpoint-check/results/audit-testset.json", keys = ["auditor_vs_gold", "accuracy_pct"], unit = "pct", decimals = 1, n_keys = ["auditor_vs_gold", "items"] }
  direction = "higher"

