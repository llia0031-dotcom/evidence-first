  { date = "2026-11-14", label = { zh = "建议第 4 版", en = "Advice v4" }, text = { zh = "删得太多，总分下降", en = "Removed too much; score fell" }, before = "adv_v4_mixed2_v3", after = "adv_v4_mixed2_v4", adopted = false },
