did = { zh = "我把卖点核对设计成平台和商家一起用的功能：买家只看被证实的卖点，其余私下交给商家；比较三种找证据的做法的准确率和费用；给商家的修改建议迭代了六版，每版先在新写的冻结题上测，再决定用不用。", en = "I designed claim checking as a feature the platform and merchants share: buyers see only confirmed claims, the rest go privately to the merchant; compared three evidence-finding methods on accuracy and cost; and iterated the merchant advice six times, testing each version on new frozen items before deciding." }
name = { zh = "卖点体检", en = "Sellpoint Check" }
problem = { zh = "商品页的卖点有没有被买家评价证实：买家只看到被证实的卖点和原话，其余卖点私下交给商家，附修改建议", en = "Which listing claims do buyer reviews confirm: buyers see only confirmed claims with quotes, and the rest go privately to the merchant with suggested rewrites" }
primary_metric = { zh = "卖点判对率（证实、反驳、有争议、没提到）；每个商品的调用次数和费用", en = "Claims labelled correctly (supported, refuted, mixed, not mentioned); calls and cost per product" }
headline = [
  { zh = "答案已知的 60 条卖点：采用的做法 {v1_c}，逐条判断 {v1_b}，先检索 {v1_a}", en = "60 claims with known answers: adopted method {v1_c}, per-review judging {v1_b}, retrieval first {v1_a}" },
  { zh = "真实数据：调用次数是逐条判断的 {real_calls_share}，费用是 {real_cost_share}", en = "Real data: {real_calls_share} of the calls and {real_cost_share} of the cost of per-review judging" },
  { zh = "修改建议第 5 版，真实数据两次独立评分：{adv_v5_real_g1}、{adv_v5_real_g2}", en = "Rewrite advice v5 on real data, two independent gradings: {adv_v5_real_g1}, {adv_v5_real_g2}" },
]
summary = { zh = "把商品页的卖点拆开，在买家评价里找支持或反驳的原话，每段原话用 evidence-check 的脚本逐字核对，再给每条卖点贴上“证实、反驳、有争议、没提到”。买家页只展示被证实的卖点和原话；没被证实的进商家后台的“卖点体检”，附原话和修改建议，只有商家本人看得到。评测比较三种找证据的做法：先检索再判断（A）、逐条评价判断再汇总（B，照 PRAISE 论文的做法）、全部评价一次交给模型（C，采用）。", en = "The listing's claims are split out, buyer reviews are searched for quotes that support or refute each one, every quote is checked word for word by the evidence-check script, and each claim is labelled supported, refuted, mixed or not mentioned. The buyer page shows only supported claims with their quotes; the rest go to the merchant's private claim check with quotes and a suggested rewrite. The evaluation compares three ways of finding evidence: retrieve then judge (A), judge review by review and aggregate (B, after the PRAISE paper), and all reviews in one call (C, adopted)." }
core_link = { zh = "直接调用 evidence-check 的核对脚本：引文没通过就丢掉，不算证据。", en = "Calls the evidence-check script directly: a quote that fails is dropped and does not count as evidence." }
models = { zh = "claude-haiku-5-5（effort medium）；先检索的做法用本机的检索模型和 Orama 混合检索（来自 Cairn）。", en = "claude-haiku-5-5 (effort medium); the retrieval arms use local embedding models and Orama hybrid search (from Cairn)." }

judge = { zh = [
  "卖点判对按写题时定好的答案用脚本算，没有用评分器。",
  "真实数据没有标准答案，所以每条证据另做一次独立判断：先在答案已知的题上检验这个判断，和答案一致 {audit_vs_gold}。",
  "修改建议由评分器按评分表独立评两次。评分器先在事先写好、已知好坏的建议上校准：两次分别判对 {adv_cal_1}、{adv_cal_2}。评分器和生成建议用的是同一个模型（claude-haiku-5-5），这是局限。",
], en = [
  "Claim labels are scored by script against answers fixed when the items were written; no grader is used.",
  "Real data has no answer key, so every piece of evidence gets a second, independent judgement. That judgement was first checked on items with known answers: {audit_vs_gold} agree.",
  "Rewrite advice is graded twice, independently, by a rubric grader. The grader was first calibrated on advice written in advance with known quality: {adv_cal_1} and {adv_cal_2} right. The grader and the advice generator use the same model (claude-haiku-5-5), which is a limit.",
] }

iteration = { zh = ["找证据的做法：三种比较下来，全部评价一次交给模型（C）最准，费用远低于逐条判断（B），采用。", "检索改进 A2：在 A 没见过的题上 {a2_a} → {a2_a2}，仍不如 C 的 {a2_c}，留作评价太多时的备选。", "修改建议：六版，第 2、3、5 版采用，第 4、6 版测完不采用；第 5 版让新文案不再出现“买家说”（{adv_v3_review_talk} → {adv_v5_review_talk}）。每一版见 Prompt 资产库。"], en = ["Evidence finding: of the three methods, all reviews in one call (C) was the most accurate and far cheaper than per-review judging (B), and was adopted.", "Retrieval upgrade A2: on claims A had not seen, {a2_a} → {a2_a2}, still below C's {a2_c}; kept as the fallback when there are too many reviews.", "Rewrite advice: six versions; v2, v3 and v5 adopted, v4 and v6 dropped after testing; v5 removed \"buyers say\" phrasing from new copy ({adv_v3_review_talk} → {adv_v5_review_talk}). Every version is in the prompt registry."] }

conclusion = { zh = "全部评价一次交给模型最准、费用远低于逐条判断；给商家的修改建议停在第 5 版。", en = "Giving the model all reviews in one call is the most accurate and far cheaper than per-review judging; the merchant advice stays at version 5." }

