[[limitation]]
text = { zh = "测试集的评价比真实评价短、干净；测试题在真实数据跑完之后由同一作者写成。", en = "Test reviews are shorter and cleaner than real ones, and the items were written by the same author after the real-data run." }
advice = { zh = "上线前用平台自己的、有许可的评价数据重做一遍真实数据的评测。", en = "Before launch, repeat the real-data evaluation on the platform's own licensed reviews." }

[[limitation]]
text = { zh = "真实数据没有标准答案：第二次独立判断和第一次的一致率（C 的支持证据 {real_audit_c_support:pct}、反驳证据 {real_audit_c_refute:pct}）只说明两次判断接近，不等于判对。", en = "Real data has no answer key: agreement between the first and second judgements (C: {real_audit_c_support:pct} for supporting and {real_audit_c_refute:pct} for refuting evidence) shows consistency, not correctness." }
advice = { zh = "上线时抽一部分请人工复核，复核结果回流成新的评测题。", en = "Sample cases for human review at launch and turn the reviewed cases into new test items." }

[[limitation]]
text = { zh = "修改建议的评分器和生成建议用的是同一个模型；两次评分之间的一致性中等。", en = "The advice grader uses the same model as the generator, and agreement between the two gradings is moderate." }
advice = { zh = "换一个不同厂家的模型当第二评分方，或抽样人工评分。", en = "Use a model from another provider as a second grader, or grade a sample by hand." }

[[limitation]]
text = { zh = "evidence-check 对中文引文要求至少 4 个字，两条完整的 3 个字的标题评价被挡下。", en = "evidence-check requires Chinese quotes of at least four characters, which blocked two complete three-character review titles." }
advice = { zh = "核对脚本对“整条评价就是这几个字”的情况放行。", en = "Let the checker accept a short quote when it is the whole review." }

