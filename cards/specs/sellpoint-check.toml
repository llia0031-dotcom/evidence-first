[[eval]]
id = "a2"
name = { zh = "检索改进 A2：A 没跑过的 180 条卖点", en = "Retrieval upgrade A2: 180 claims A had not seen" }
date = "2026-11-14"
data = { zh = "A2 换用 Orama 混合检索和句子窗口。在四套新写的测试集（混合、混合二、口语、口语二）上和 A、C 比较；计划和判断标准跑前写好。", en = "A2 switches to Orama hybrid search with sentence windows. It is compared with A and C on four newly written sets (mixed, mixed 2, spoken, spoken 2); plan and decision rule written before the run." }
items = { zh = "四套共 180 条卖点", en = "180 claims across four sets" }
runs = { zh = "每种做法 1 遍", en = "1 run per method" }
setup = { zh = "claude-haiku-5-5，大部分走批量接口", en = "claude-haiku-5-5, mostly Message Batches API" }
frozen = { zh = "`testset/ARM_A2_PLAN.md`", en = "`testset/ARM_A2_PLAN.md`" }
takeaway = { zh = "A2 比 A 好，但采用的仍是 C；A2 留作评价太多、一次放不下时的备选。", en = "A2 beats A, but C stays adopted; A2 is the fallback when there are too many reviews for one call." }

  [[eval.metric]]
  id = "a2_a"
