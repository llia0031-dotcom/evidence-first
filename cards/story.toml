[[scene]]
title = { zh = "一句话有没有出处", en = "Does a sentence have a source?" }
projects = ["tracedesk", "cairn", "evidence-check"]
purpose = { zh = "按资料回答问题时，AI 会悄悄改掉截止时间、数字，或者多出资料里没有的话。", en = "Answering from documents, an AI quietly shifts deadlines and numbers or adds what no document says." }
did = { zh = "两次黑客松里先做了“回答附原文、服务器核对引文”的问答助手（TraceDesk、Cairn）；之后把核对规则抽出来，做成谁都能装的 evidence-check。", en = "Two hackathon assistants came first, each answer quoted and checked by the server (TraceDesk, Cairn); the checking rules were then extracted into evidence-check, which anyone can install." }
result = [
  { zh = "TraceDesk：自动检查全部通过 {tracedesk.check2_v24}，普通提示 {tracedesk.check2_base}", en = "TraceDesk: all automatic checks passed {tracedesk.check2_v24}, plain prompt {tracedesk.check2_base}" },
  { zh = "Cairn：正确页面进前 5 名 {cairn.team_hit5}", en = "Cairn: right page in the top five {cairn.team_hit5}" },
  { zh = "evidence-check：编造数字的回答 {evidence-check.v2_inv_plain} → {evidence-check.v2_inv_v02}", en = "evidence-check: answers with an invented number {evidence-check.v2_inv_plain} → {evidence-check.v2_inv_v02}" },
]
reuse = { zh = "evidence-check 的匹配和数字规则移植自 TraceDesk 的核对代码。", en = "evidence-check's matching and number rules were ported from TraceDesk's checker." }

[[scene]]
title = { zh = "一条判断有没有依据", en = "Does a judgement have grounds?" }
projects = ["screening-audit"]
purpose = { zh = "模型初筛简历时，“符合 / 不符合”能不能都指到简历原文，换掉名字、性别、学校后结论变不变。", en = "When a model screens resumes, can every met / not-met verdict point to the resume, and does it change when name, gender or school change?" }
did = { zh = "虚构岗位和简历、事先定好答案；比较几种接法，把误伤正确判断的接法改了两版；再用陷阱、植入错误和同一个模型的第二次独立复核检验。", en = "Fictional jobs and resumes with answers fixed in advance; several wirings compared, the one that discarded correct verdicts rewired twice; then traps, planted errors and an independent second pass by the same model." }
result = [
  { zh = "换名字后去留变化：{screening-audit.v1_name_flip_evidence}", en = "Advance decisions changed by a name swap: {screening-audit.v1_name_flip_evidence}" },
  { zh = "核对误伤正确的“符合”：{screening-audit.v2_loss_evidence} → {screening-audit.v2_loss_self}", en = "Correct \"met\" verdicts lost to the check: {screening-audit.v2_loss_evidence} → {screening-audit.v2_loss_self}" },
  { zh = "同一个模型再独立复核一次，看得到理由时挑出植入的错读：{screening-audit.verify_full}", en = "A second, independent pass by the same model, seeing the reason, catches planted misreadings: {screening-audit.verify_full}" },
]
reuse = { zh = "用 evidence-check 0.2.0 脚本的冻结副本核对每条引文。", en = "Uses a frozen copy of the evidence-check 0.2.0 script for every quote." }

[[scene]]
title = { zh = "很多条证据怎么汇总成一个结论", en = "How do many pieces of evidence add up to one conclusion?" }
projects = ["sellpoint-check", "merchant-sourcing-my"]
purpose = { zh = "商品页的一条卖点，要从上百条评价里找出支持或反驳它的原话，再下结论；结论只给能改的一方看。招商时先联系哪些商家，也要从一页页公开资料里拼出理由。", en = "One listing claim needs supporting or refuting quotes found among hundreds of reviews before a conclusion; the conclusion goes only to the side that can act on it. Deciding which merchants to recruit first also means building each reason from many public pages." }
did = { zh = "设计成平台和商家一起用：买家只看被证实的卖点，其余私下交给商家；比较三种找证据的做法；修改建议迭代六版，每版先在新写的冻结题上测。招商样本存下公开页面，打分规则先冻结再填表，商家池的每一格都对回原文。", en = "Designed for platform and merchants together: buyers see only confirmed claims, the rest go privately to the merchant; three evidence-finding methods compared; the advice iterated six times, each version tested on new frozen items. The merchant sourcing pack saves public pages, freezes its scoring rules before any row is filled, and checks every cell of the pool against its source." }
result = [
  { zh = "答案已知的卖点：采用的做法 {sellpoint-check.v1_c}，逐条判断 {sellpoint-check.v1_b}", en = "Claims with known answers: adopted method {sellpoint-check.v1_c}, per-review judging {sellpoint-check.v1_b}" },
  { zh = "费用只有逐条判断的 {sellpoint-check.real_cost_share}", en = "Cost only {sellpoint-check.real_cost_share} of per-review judging" },
  { zh = "招商样本：带出处的说法逐字对回原文 {merchant-sourcing-my.msm_claims}，商家池的 {merchant-sourcing-my.msm_cells} 个格子都有核对过的原文", en = "Merchant sourcing: sourced claims matched word for word {merchant-sourcing-my.msm_claims}, and all {merchant-sourcing-my.msm_cells} cells of the pool carry a checked quote" },
]
reuse = { zh = "直接调用 evidence-check 的核对脚本；“先检索”的做法用的是 Cairn 的检索模型和 Orama 混合检索。招商样本用 evidence-check 0.5.0 核对每条事实。", en = "Calls the evidence-check script directly; the retrieval arms use Cairn's embedding models and Orama hybrid search. The merchant sourcing pack checks every fact with evidence-check 0.5.0." }

[[scene]]
title = { zh = "Agent 在多轮、带工具的任务里怎么拿出证据", en = "How does an agent bring evidence through multi-turn, tool-using work?" }
projects = ["grounded-review", "grounded-business-review", "policy-model-lab"]
purpose = { zh = "广告审核不能只给“通过 / 拒绝”，要说出违反哪一条、是哪几个字，广告主改了以后还要复审；经营周报要从指标异动找到原因，每个数字都要对回查询结果。", en = "Ad review must name the clause and the exact words, not just approve or reject, and re-review the advertiser's revision; a weekly business review must trace a metric change to its cause, with every number traced to a query result." }
did = { zh = "做了查条款、引原文、多轮改稿和复审的 Agent，和单个提示词、违禁词表、开源审核模型比较；改稿建议从 v1 迭代到 v1.3；最后换成监管机构和法院定答案的真实广告。经营分析在合成的经营数据上比较固定脚本、一次提示词和自己查数的 Agent，周报放行前逐段核对数字。审核模型实验比较给模型看文案、抽帧还是帧上的字，以及合成数据微调的小模型。", en = "An agent that looks up clauses, quotes them, revises and re-reviews, compared with a single prompt, a banned-word list and open-source moderation models; the advice iterated from v1 to v1.3; then real ads judged by regulators and courts. For business reviews, on synthetic business data, a fixed script, a single prompt and an agent that queries for itself were compared, with every paragraph's numbers checked before release. Policy Model Lab compares showing a model the caption, frames or the text on the frames, and small models tuned on synthetic data." }
result = [
  { zh = "留出集判对：单个提示词 {grounded-review.heldout_oneshot}，Agent {grounded-review.heldout_agent}", en = "Held-out decisions right: single prompt {grounded-review.heldout_oneshot}, agent {grounded-review.heldout_agent}" },
  { zh = "真实广告（英国 ASA 裁决）：{grounded-review.real_en_oneshot}、{grounded-review.real_en_agent}", en = "Real ads (UK ASA rulings): {grounded-review.real_en_oneshot}, {grounded-review.real_en_agent}" },
  { zh = "改稿字段写错：{grounded-review.mt4_v11_fault} → {grounded-review.mt4_v13_fault}", en = "Advice fields filled wrongly: {grounded-review.mt4_v11_fault} → {grounded-review.mt4_v13_fault}" },
  { zh = "经营分析，埋好的原因全找对：一次提示词 {grounded-business-review.oneshot_all}，Agent {grounded-business-review.agent_all}", en = "Business review, all planted causes right: single prompt {grounded-business-review.oneshot_all}, agent {grounded-business-review.agent_all}" },
  { zh = "审核模型实验，视频广告的违规：只看文案抓到 {policy-model-lab.vid_haiku_text_caught}，看 16 帧 {policy-model-lab.vid_haiku_f16_caught}", en = "Policy Model Lab, violations in video ads caught: caption only {policy-model-lab.vid_haiku_text_caught}, 16 frames {policy-model-lab.vid_haiku_f16_caught}" },
]
reuse = { zh = "evidence-check 的脚本是 Agent 的一个工具；演示页复用了简历初筛的页面骨架；经营周报的数字核对也直接调用这个脚本。", en = "The evidence-check script is one of the agent's tools, and the demo reuses the screening study's page skeleton; the business review's number check calls the same script." }

[[scene]]
title = { zh = "生成的内容和交互体验怎么拿证据", en = "How do generated content and interaction get evidence?" }
projects = ["text-on-product", "voice-agent-eval", "creator-skills"]
purpose = { zh = "画面里的字写对没有，语音助手被打断、听到“嗯”、背景有人说话时还办不办得对，都要用数字说话；创作者交给 AI 助手的字幕、分镜和热点选题，交出去之前也要先核对。", en = "Whether the text in an image is right, and whether a voice assistant still gets things right when interrupted, hearing \"mm\" or over background speech, both need numbers; so do the subtitles, shot lists and trend cards a creator hands to an assistant, checked before they go out." }
did = { zh = "AI 生图：OCR 逐字核对画面里的字，结论写成给商家的创作指南和上线前核对工具。语音：42 段事先定好答案的对话（用户语音是合成的），一项一项试改进，把有效的合在一起。创作者 Skill：三个各带核对脚本的 Agent Skill，和不装 Skill 的同一个模型比。", en = "Images: OCR checks every character in the picture, and the findings became a merchant guide and a pre-listing checker. Voice: 42 conversations with fixed answers (the user's speech is synthesised), fixes tried one at a time and the useful ones combined. Creator skills: three Agent Skills, each with a checking script, compared with the same model without them." }
result = [
  { zh = "图片文字全对：Seedream 4.5 {text-on-product.img_exact_45}；视频只有 {text-on-product.video_exact}", en = "Images with exactly right text: Seedream 4.5 {text-on-product.img_exact_45}; videos only {text-on-product.video_exact}" },
  { zh = "背景人声时开口：{voice-agent-eval.babble_base} → {voice-agent-eval.babble_pvad}", en = "First audio over background speech: {voice-agent-eval.babble_base} → {voice-agent-eval.babble_pvad}" },
  { zh = "创作者 Skill：改好的字幕文件完全正确，不装 {creator-skills.sub_perfect_plain}，装上 {creator-skills.sub_perfect_skill}", en = "Creator skills: corrected subtitle files fully right, without the skill {creator-skills.sub_perfect_plain}, with it {creator-skills.sub_perfect_skill}" },
]
reuse = { zh = "语音评测照 evidence-check v2 的做法预注册；AI 生图用同样的“逐字核对”思路，有自己的 OCR 核对；创作者 Skill 的热点选题复制了 evidence-check 的引文匹配。", en = "The voice study preregisters the way evidence-check v2 did; the image study applies the same word-for-word idea with its own OCR check.; the creator skills' trend check copies evidence-check's quote matching" }

[[scene]]
title = { zh = "怎么变成团队能天天用的能力", en = "How does this become something a team uses every day?" }
projects = ["grounded-labelling-pipeline", "judge-calibration", "labelling-agent-kit", "agent-trace-eval", "placement-monitoring-kit"]
self = true
purpose = { zh = "一个个评测做完以后，要让每个能力都有同样格式的评测证据、每次改提示词都能看到新旧分数、上线和回滚有章可循；团队每月跑的数据检查，也要先证明自己查得准。", en = "Once the studies exist, every capability needs evaluation evidence in one format, every prompt change needs old and new scores side by side, and releases and rollbacks need a routine; the data checks a team runs every month must first show they are accurate." }
did = { zh = "这个仓库：统一评测卡、Prompt 资产库（版本、上线标签、灰度回放、上线清单、改提示词时自动贴分数）；有据标注流水线把有据审核接成一条审核工作流：核对引文、复核队列、版本、灰度和回滚、每周指标。实习安置监测包把表单、每月数据检查、跟进表和报告接成一套，检查先在埋好错误的构造样例上量过。", en = "This repository: evaluation cards in one format and a prompt registry (versions, release labels, canary replay, a release checklist in Chinese, scores posted on every prompt change); the Grounded Labelling Pipeline turns Grounded Review into a review workflow: quote checks, a review queue, versions, canary and rollback, weekly metrics. The Placement Monitoring Kit joins forms, monthly data checks, a tracker and reports, with the checks measured first on a constructed sample with planted errors." }
result = [
  { zh = "有据标注流水线：判错又自动生效的从 {grounded-labelling-pipeline.v1_escaped} 降到 {grounded-labelling-pipeline.v2_escaped}；第一轮灰度按事先写好的规则在 {grounded-labelling-pipeline.canary_rollback_share} 回滚，改好规则后第二轮放到全量，v2 转为正式版本；第 3、4 版都没达到事先写好的采用标准，没上线（回放，不是真实用户）", en = "Grounded Labelling Pipeline: wrong decisions that went live fell from {grounded-labelling-pipeline.v1_escaped} to {grounded-labelling-pipeline.v2_escaped}; the first canary rolled back at {grounded-labelling-pipeline.canary_rollback_share} under the rules written beforehand, the second, with fixed rules, reached full release and v2 was promoted to production; versions 3 and 4 missed the adoption standard written beforehand and were not released (a replay, not real users)" },
  { zh = "每张评测卡上的数字都由脚本从结果文件算出", en = "Every number on the evaluation cards is computed by script from the result files" },
  { zh = "灰度回放：有据审核 v1.3 放到全量，v1.2 在放量中途触发回滚", en = "Canary replay: Grounded Review v1.3 reaches full release, v1.2 rolls back partway" },
  { zh = "模型裁判校准：和定好的答案一致 {judge-calibration.jc_constructed}；先规则、再裁判、拿不准的送人工，漏掉的错误 {judge-calibration.jc_missed_a} → {judge-calibration.jc_missed_b}", en = "Judge calibration: agreement with fixed answers {judge-calibration.jc_constructed}; rules, then the judge, unsure items to people, errors missed {judge-calibration.jc_missed_a} → {judge-calibration.jc_missed_b}" },
  { zh = "标注 Agent 工具箱：测试集 A 微平均 F1，短提示词 → 完整 Agent，广告 {labelling-agent-kit.lak_ad_short} → {labelling-agent-kit.lak_ad_full}；按根因改的第二版在没用过的点评上 {labelling-agent-kit.lak_h6_asap}，采用，广告区间碰到 0，不采用", en = "Labelling Agent Kit: test A micro F1, short prompt → full agent, ads {labelling-agent-kit.lak_ad_short} → {labelling-agent-kit.lak_ad_full}; the revision built from root causes gains {labelling-agent-kit.lak_h6_asap} on unseen reviews and is adopted, while on ads the interval reaches 0 and it is not" },
  { zh = "Agent 评测台：三个会调工具的 Agent 按步骤评，基线失败 {agent-trace-eval.ate_failed} 次、上线前的关卡只拦下 {agent-trace-eval.ate_gate_caught:k} 次；不装 Skill 时创作流程成功 {agent-trace-eval.ate_cr_success} → {agent-trace-eval.ate_cr_noskills}", en = "Agent Trace Eval: three tool-using agents scored step by step; of {agent-trace-eval.ate_failed} failed base trials the release gates caught {agent-trace-eval.ate_gate_caught:k}; without skills, creator workflow success {agent-trace-eval.ate_cr_success} → {agent-trace-eval.ate_cr_noskills}" },
  { zh = "实习安置监测包：埋好的数据错误全部查出 {placement-monitoring-kit.pmk_found}，没有多报；简报和演示稿的数字对回数据 {placement-monitoring-kit.pmk_numbers}", en = "Placement Monitoring Kit: planted data errors all caught, {placement-monitoring-kit.pmk_found}, with no extra flags; brief and deck numbers traced to the data, {placement-monitoring-kit.pmk_numbers}" },
