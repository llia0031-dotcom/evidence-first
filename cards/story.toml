# The portfolio storyline shown at the top of the README: an introduction, then the selected
# cases as scenes ordered by how hard the evidence question is. Numbers appear only as
# {project.metric} placeholders filled from the evaluation cards; {_cards}, {_numbers} and
# {_records} are counts of this build. "reuse" lines state only links that exist in the code or
# records (shared script, shared retrieval, shared method), never an invented cause and effect.

intro = { zh = "我是 Liang Liyuan，做会拿出证据的 AI 功能：AI 说的每句话能指到原文，每个能力上线前先拿出评测。", en = "I'm Liang Liyuan. I build AI features that show their evidence: every sentence points to its source, and every capability brings an evaluation before it ships." }
about = { zh = "动手之前，我先把题目和答案写好、冻结，再让模型跑。每改一版就在新写的题上重测，没采用的版本和没成立的预测也照样记下来。结果和局限放在一起公开，每个数字都由脚本从结果文件算出。", en = "Before a model runs, I write the items and answers and freeze them. Every new version is tested again on newly written items, and the versions I dropped and the predictions that failed stay on the record. Results go out together with their limits, and every number is computed by script from the result files." }
links = [
  { label = { zh = "个人网站", en = "Website" }, url = "https://jason-d-e.github.io/" },
  { label = { zh = "GitHub", en = "GitHub" }, url = "https://github.com/Jason-d-e" },
]

[[scene]]
title = { zh = "一句话有没有出处", en = "Does a sentence have a source?" }
projects = ["tracedesk", "cairn", "evidence-check"]
purpose = { zh = "按资料回答问题时，AI 会悄悄改掉截止时间、数字，或者多出资料里没有的话。", en = "Answering from documents, an AI quietly shifts deadlines and numbers or adds what no document says." }
did = { zh = "两次黑客松里先做了“回答附原文、服务器核对引文”的问答助手（TraceDesk、Cairn）；之后把核对规则抽出来，做成谁都能装的 evidence-check。", en = "Two hackathon assistants came first, each answer quoted and checked by the server (TraceDesk, Cairn); the checking rules were then extracted into evidence-check, which anyone can install." }
result = [
  { zh = "TraceDesk：自动检查全部通过 {tracedesk.check2_v24}，普通提示 {tracedesk.check2_base}", en = "TraceDesk: all automatic checks passed {tracedesk.check2_v24}, plain prompt {tracedesk.check2_base}" },
  { zh = "Cairn：正确页面进前 5 名 {cairn.team_hit5}", en = "Cairn: right page in the top five {cairn.team_hit5}" },
  { zh = "evidence-check：编造数字的回答 {evidence-check.v2_inv_plain} → {evidence-check.v2_inv_v02}", en = "evidence-check: answers with an invented number {evidence-check.v2_inv_plain} → {evidence-check.v2_inv_v02}" },
]
reuse = { zh = "evidence-check 的匹配和数字规则移植自 TraceDesk 的核对代码。", en = "evidence-check's matching and number rules were ported from TraceDesk's checker." }

[[scene]]
title = { zh = "一条判断有没有依据", en = "Does a judgement have grounds?" }
projects = ["screening-audit"]
purpose = { zh = "模型初筛简历时，“符合 / 不符合”能不能都指到简历原文，换掉名字、性别、学校后结论变不变。", en = "When a model screens resumes, can every met / not-met verdict point to the resume, and does it change when name, gender or school change?" }
did = { zh = "虚构岗位和简历、事先定好答案；比较几种接法，把误伤正确判断的接法改了两版；再用陷阱、植入错误和第二次独立复核检验。", en = "Fictional jobs and resumes with answers fixed in advance; several wirings compared, the one that discarded correct verdicts rewired twice; then traps, planted errors and an independent second review." }
result = [
  { zh = "换名字后去留变化：{screening-audit.v1_name_flip_evidence}", en = "Advance decisions changed by a name swap: {screening-audit.v1_name_flip_evidence}" },
  { zh = "核对误伤正确的“符合”：{screening-audit.v2_loss_evidence} → {screening-audit.v2_loss_self}", en = "Correct \"met\" verdicts lost to the check: {screening-audit.v2_loss_evidence} → {screening-audit.v2_loss_self}" },
  { zh = "第二次独立复核挑出植入的错读：{screening-audit.verify_full}", en = "Second review catches planted misreadings: {screening-audit.verify_full}" },
]
reuse = { zh = "用 evidence-check 0.2.0 脚本的冻结副本核对每条引文。", en = "Uses a frozen copy of the evidence-check 0.2.0 script for every quote." }

[[scene]]
title = { zh = "很多条证据怎么汇总成一个结论", en = "How do many pieces of evidence add up to one conclusion?" }
projects = ["sellpoint-check"]
purpose = { zh = "商品页的一条卖点，要从上百条评价里找出支持或反驳它的原话，再下结论；结论只给能改的一方看。", en = "One listing claim needs supporting or refuting quotes found among hundreds of reviews before a conclusion; the conclusion goes only to the side that can act on it." }
did = { zh = "设计成平台和商家一起用：买家只看被证实的卖点，其余私下交给商家；比较三种找证据的做法；修改建议迭代六版，每版先在新写的冻结题上测。", en = "Designed for platform and merchants together: buyers see only confirmed claims, the rest go privately to the merchant; three evidence-finding methods compared; the advice iterated six times, each version tested on new frozen items." }
result = [
  { zh = "答案已知的卖点：采用的做法 {sellpoint-check.v1_c}，逐条判断 {sellpoint-check.v1_b}", en = "Claims with known answers: adopted method {sellpoint-check.v1_c}, per-review judging {sellpoint-check.v1_b}" },
  { zh = "费用只有逐条判断的 {sellpoint-check.real_cost_share}", en = "Cost only {sellpoint-check.real_cost_share} of per-review judging" },
]
reuse = { zh = "直接调用 evidence-check 的核对脚本；“先检索”的做法用的是 Cairn 的检索模型和 Orama 混合检索。", en = "Calls the evidence-check script directly; the retrieval arms use Cairn's embedding models and Orama hybrid search." }

[[scene]]
title = { zh = "Agent 在多轮、带工具的任务里怎么拿出证据", en = "How does an agent bring evidence through multi-turn, tool-using work?" }
projects = ["grounded-review", "grounded-business-review"]
purpose = { zh = "广告审核不能只给“通过 / 拒绝”，要说出违反哪一条、是哪几个字，广告主改了以后还要复审；经营周报要从指标异动找到原因，每个数字都要对回查询结果。", en = "Ad review must name the clause and the exact words, not just approve or reject, and re-review the advertiser's revision; a weekly business review must trace a metric change to its cause, with every number traced to a query result." }
did = { zh = "做了查条款、引原文、多轮改稿和复审的 Agent，和单个提示词、违禁词表、开源审核模型比较；改稿建议从 v1 迭代到 v1.3；最后换成监管机构和法院定答案的真实广告。经营分析里比较固定脚本、一次提示词和自己查数的 Agent，周报放行前逐段核对数字。", en = "An agent that looks up clauses, quotes them, revises and re-reviews, compared with a single prompt, a banned-word list and open-source moderation models; the advice iterated from v1 to v1.3; then real ads judged by regulators and courts. For business reviews a fixed script, a single prompt and an agent that queries for itself were compared, with every paragraph's numbers checked before release." }
result = [
  { zh = "留出集判对：单个提示词 {grounded-review.heldout_oneshot}，Agent {grounded-review.heldout_agent}", en = "Held-out decisions right: single prompt {grounded-review.heldout_oneshot}, agent {grounded-review.heldout_agent}" },
  { zh = "真实广告（英国 ASA 裁决）：{grounded-review.real_en_oneshot}、{grounded-review.real_en_agent}", en = "Real ads (UK ASA rulings): {grounded-review.real_en_oneshot}, {grounded-review.real_en_agent}" },
  { zh = "改稿字段写错：{grounded-review.mt4_v11_fault} → {grounded-review.mt4_v13_fault}", en = "Advice fields filled wrongly: {grounded-review.mt4_v11_fault} → {grounded-review.mt4_v13_fault}" },
  { zh = "经营分析，埋好的原因全找对：一次提示词 {grounded-business-review.oneshot_all}，Agent {grounded-business-review.agent_all}", en = "Business review, all planted causes right: single prompt {grounded-business-review.oneshot_all}, agent {grounded-business-review.agent_all}" },
]
reuse = { zh = "evidence-check 的脚本是 Agent 的一个工具；演示页复用了简历初筛的页面骨架；经营周报的数字核对也直接调用这个脚本。", en = "The evidence-check script is one of the agent's tools, and the demo reuses the screening study's page skeleton; the business review's number check calls the same script." }

[[scene]]
title = { zh = "生成的内容和交互体验怎么拿证据", en = "How do generated content and interaction get evidence?" }
projects = ["text-on-product", "voice-agent-eval"]
purpose = { zh = "画面里的字写对没有，语音助手被打断、听到“嗯”、背景有人说话时还办不办得对，都要用数字说话。", en = "Whether the text in an image is right, and whether a voice assistant still gets things right when interrupted, hearing \"mm\" or over background speech, both need numbers." }
did = { zh = "AI 生图：OCR 逐字核对画面里的字，结论写成给商家的创作指南和上线前核对工具。语音：42 段事先定好答案的对话，一项一项试改进，把有效的合在一起。", en = "Images: OCR checks every character in the picture, and the findings became a merchant guide and a pre-listing checker. Voice: 42 conversations with fixed answers, fixes tried one at a time and the useful ones combined." }
result = [
  { zh = "图片文字全对：Seedream 4.5 {text-on-product.img_exact_45}；视频只有 {text-on-product.video_exact}", en = "Images with exactly right text: Seedream 4.5 {text-on-product.img_exact_45}; videos only {text-on-product.video_exact}" },
  { zh = "背景人声时开口：{voice-agent-eval.babble_base} → {voice-agent-eval.babble_pvad}", en = "First audio over background speech: {voice-agent-eval.babble_base} → {voice-agent-eval.babble_pvad}" },
]
reuse = { zh = "语音评测照 evidence-check v2 的做法预注册；AI 生图用同样的“逐字核对”思路，有自己的 OCR 核对。", en = "The voice study preregisters the way evidence-check v2 did; the image study applies the same word-for-word idea with its own OCR check." }

[[scene]]
title = { zh = "怎么变成团队能天天用的能力", en = "How does this become something a team uses every day?" }
projects = ["grounded-labelling-pipeline"]
self = true
purpose = { zh = "一个个评测做完以后，要让每个能力都有同样格式的评测证据、每次改提示词都能看到新旧分数、上线和回滚有章可循。", en = "Once the studies exist, every capability needs evaluation evidence in one format, every prompt change needs old and new scores side by side, and releases and rollbacks need a routine." }
did = { zh = "这个仓库：统一评测卡、Prompt 资产库（版本、上线标签、灰度回放、上线清单、改提示词时自动贴分数）；有据标注流水线把有据审核接成一条审核工作流：核对引文、复核队列、版本、灰度和回滚、每周指标。", en = "This repository: evaluation cards in one format and a prompt registry (versions, release labels, canary replay, release checklist, scores posted on every prompt change); the Grounded Labelling Pipeline turns Grounded Review into a review workflow: quote checks, a review queue, versions, canary and rollback, weekly metrics." }
result = [
  { zh = "有据标注流水线：判错又自动生效的从 {grounded-labelling-pipeline.v1_escaped} 降到 {grounded-labelling-pipeline.v2_escaped}；第一轮灰度按事先写好的规则在 {grounded-labelling-pipeline.canary_rollback_share} 回滚，改好规则后第二轮放到全量，v2 上线；第 3 版没达到事先写好的采用标准，没上线（回放，不是真实用户）", en = "Grounded Labelling Pipeline: wrong decisions that went live fell from {grounded-labelling-pipeline.v1_escaped} to {grounded-labelling-pipeline.v2_escaped}; the first canary rolled back at {grounded-labelling-pipeline.canary_rollback_share} under the rules written beforehand, the second, with fixed rules, reached full release and v2 went live; version 3 missed the adoption standard written beforehand and was not released (a replay, not real users)" },
  { zh = "{_cards} 张评测卡、{_numbers} 个数字全部由脚本从结果文件算出，{_records} 处和项目记录对照", en = "{_cards} evaluation cards and {_numbers} numbers, all computed from result files and checked against {_records} project records" },
  { zh = "灰度回放：有据审核 v1.3 放到全量，v1.2 在放量中途触发回滚（回放，不是真实用户）", en = "Canary replay: Grounded Review v1.3 reaches full release, v1.2 rolls back partway (a replay, not real users)" },
]
reuse = { zh = "资产库收的是前面各幕已有的提示词版本；灰度回放用的是有据审核的真实对比数据。", en = "The registry holds the prompt versions from the earlier scenes; the canary replay uses Grounded Review's real comparison data." }
