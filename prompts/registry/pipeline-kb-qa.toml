what = { zh = "标注员问“这样写算不算违规”，只按检索到的条款回答：结论、说明、每条依据的编号和原文；库里没有管这件事的条款就说“没有”。每段引文都用 evidence-check 核对。流水线自己的资产库里是同一个资产、同样的标签。", en = "A labeller asks whether some wording breaks a rule; the answer uses only the retrieved clauses: a verdict, a short explanation, and the id and exact words of each clause it rests on. If no clause covers the question it says so. Every quote is checked with evidence-check. The pipeline's own registry holds the same asset with the same labels." }
where = "pipeline/kb_qa.py"
