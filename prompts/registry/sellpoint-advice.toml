asset = "sellpoint-check/advice"
project = "sellpoint-check"
order = 2
name = { zh = "卖点体检：给商家的修改建议", en = "Sellpoint Check: rewrite advice for merchants" }
what = { zh = "没被评价证实的卖点，在商家后台给出的修改建议和改写后的文案。每一版都先在为它新写、跑前冻结的测试集上和上一版比较，再看同一批真实数据。", en = "The suggested rewrite shown in the merchant's private view for claims reviews do not confirm. Each version is first compared with the previous one on a set written for it and frozen before the run, then checked on the same real data." }
where = "pipeline/lib/suggest_prompts.mjs, suggest_v2.mjs … suggest_v6.mjs"
model_lock = "claude-haiku-5-5, effort medium"
production_note = { zh = "项目现在采用第 5 版。没有线上流量。", en = "The project uses version 5. There is no live traffic." }

