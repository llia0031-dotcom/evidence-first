asset = "evidence-pipeline/triage"
project = "grounded-labelling-pipeline"
order = 5
name = { zh = "有据标注流水线：第一道判断", en = "Grounded Labelling Pipeline: first-pass decision" }
what = { zh = "广告进入流水线后的第一道判断：通过还是拒绝、违反哪一条、广告里是哪句话。v2 起还要说自己确定还是拿不准，拿不准的送人工复核。流水线自己的资产库里是同一个资产、同样的标签。", en = "The first decision on each ad in the pipeline: approve or reject, which clause, which words of the ad. From v2 it also says whether it is sure; unsure answers go to human review. The pipeline's own registry holds the same asset with the same labels." }
where = "pipeline/triage.py"
model_lock = "claude-haiku-5-5, effort medium, max_tokens 8000"
production_note = { zh = "没有线上流量；灰度用评测题回放演示。", en = "No live traffic; the canary is a replay of test items." }

[[version]]
id = "v1"
date = "2026-11-15"
decision = "superseded"
text = { zh = "有据审核 Agent 的单次提示词，原样（`agent/oneshot.py`）", en = "Grounded Review's one-prompt arm as it is (`agent/oneshot.py`)" }
change = { zh = "第一版：整套政策库、图、文案和图上文字放进一次请求，按审核格式回答。", en = "First version: the whole policy library, the image, the caption and the image's text in one request, answered in the review format." }
why = { zh = "回放请求里判错的全部自动生效（{grounded-labelling-pipeline.v1_escaped}）；引文核对只拦下判对了但引文有毛病的答案。", en = "Every wrong decision in the replay went live ({grounded-labelling-pipeline.v1_escaped}); the quote check only caught answers that were right but quoted badly." }
source = "https://github.com/llia0031-dotcom/grounded-labelling-pipeline/blob/main/reports/compare-v1-v2.md"
compare_set = { zh = "有据审核的 166 条题各回放 2 遍", en = "Grounded Review's 166 items, 2 replays each" }
scores = [
  { label = { zh = "判错又自动生效", en = "Wrong decisions that went live" }, refs = ["grounded-labelling-pipeline.v1_escaped"], direction = "lower" },
  { label = { zh = "判对", en = "Decisions right" }, refs = ["grounded-labelling-pipeline.v1_right"], direction = "higher" },
]

[[version]]
id = "v2"
date = "2026-11-15"
decision = "adopted"
text = { zh = "v1 加一条“拿不准”规则（`triage.CERTAINTY_RULE`），输出格式加 `certainty`、`unsure_reason`", en = "v1 plus one rule on when to be unsure (`triage.CERTAINTY_RULE`) and two output fields, `certainty` and `unsure_reason`" }
change = { zh = "模型说自己确定还是拿不准；拿不准的送人工复核。", en = "The model says whether it is sure; unsure answers go to human review." }
why = { zh = "回归测试按预注册的四条采用标准全部通过，判错又自动生效 {grounded-labelling-pipeline.v1_escaped} → {grounded-labelling-pipeline.v2_escaped}。但按跑之前写好的回滚规则，灰度在 {grounded-labelling-pipeline.canary_rollback_share} 时就回滚了；复盘发现两条规则写错。改好的规则在新写的广告上重新灰度，三步都没触发回滚，采用，production 挪到 v2。第二轮两版都接近全对，只说明放量流程走通了；v2 少漏错判的证据来自第一轮。", en = "It passed all four preregistered adoption rules on the regression set: wrong decisions that went live {grounded-labelling-pipeline.v1_escaped} → {grounded-labelling-pipeline.v2_escaped}. The rollback rules written before the replay rolled it back at {grounded-labelling-pipeline.canary_rollback_share}; the post-mortem found two of those rules were wrong. With the fixed rules, a second canary on newly written ads fired no rule at any of its three steps, so v2 was adopted and production moved to it. Both versions were almost always right in round two, so that round shows the release process works; the evidence that v2 lets fewer errors through comes from round one." }
source = "https://github.com/llia0031-dotcom/grounded-labelling-pipeline/blob/main/docs/CANARY-POSTMORTEM.md"
compare_set = { zh = "第一轮：有据审核的 166 条题各回放 2 遍；第二轮：新写 120 条文字广告各 2 遍", en = "Round one: Grounded Review's 166 items, 2 replays each; round two: 120 newly written text ads, 2 runs each" }
scores = [
  { label = { zh = "判错又自动生效（v1 → v2）", en = "Wrong decisions that went live (v1 → v2)" }, refs = ["grounded-labelling-pipeline.v1_escaped", "grounded-labelling-pipeline.v2_escaped"], direction = "lower" },
  { label = { zh = "送人工复核（v1 → v2）", en = "Sent to human review (v1 → v2)" }, refs = ["grounded-labelling-pipeline.v1_review", "grounded-labelling-pipeline.v2_review"], direction = "none" },
  { label = { zh = "判对（v1 → v2）", en = "Decisions right (v1 → v2)" }, refs = ["grounded-labelling-pipeline.v1_right", "grounded-labelling-pipeline.v2_right"], direction = "higher" },
  { label = { zh = "每个请求的费用（v1 → v2）", en = "Cost per request (v1 → v2)" }, pair = [
    { id = "v1_cost", extractor = "json_value", args = { path = "evidence-pipeline-public/data/versions.json", keys = ["stats", "v1", "cost_per_request"], unit = "usd", decimals = 5 } },
    { id = "v2_cost", extractor = "json_value", args = { path = "evidence-pipeline-public/data/versions.json", keys = ["stats", "v2", "cost_per_request"], unit = "usd", decimals = 5 } },
  ], direction = "lower" },
  { label = { zh = "第二轮新广告：判对（v1 → v2）", en = "Round two, new ads: decisions right (v1 → v2)" }, refs = ["grounded-labelling-pipeline.r2_v1_right", "grounded-labelling-pipeline.r2_v2_right"], direction = "higher" },
]

[[version]]
id = "v3"
date = "2026-11-17"
decision = "not_adopted"
text = { zh = "v2 的“拿不准”规则重写（`triage.CERTAINTY_RULE_V3`）：写明几种情况算拿不准、几种不算；输出格式不变", en = "v2's rule on when to be unsure, rewritten (`triage.CERTAINTY_RULE_V3`): which cases count as unsure and which do not; the output format is unchanged" }
change = { zh = "想让答案清楚的广告少送人工：文字广告没配图、写明出处的事实核实不了、广告主的资质和定向、指导条款明明允许的用语，都不再算“拿不准”。", en = "Meant to send fewer clear ads to people: a text ad with no image, a sourced fact that cannot be checked, the advertiser's licence and targeting, and words a guidance clause plainly allows no longer count as unsure." }
why = { zh = "在另外新写的广告上（采用标准和预测跑前预注册），答案清楚的广告送人工从 {grounded-labelling-pipeline.r3_v2_clear} 降到 {grounded-labelling-pipeline.r3_v3_clear}；但写题时定为“要人来定”的广告，送人工也从 {grounded-labelling-pipeline.r3_v2_handoff} 降到 {grounded-labelling-pipeline.r3_v3_handoff}，超过事先写好的上限，不采用，production 留在 v2。第一轮回归里判错又自动生效 {grounded-labelling-pipeline.r3_reg_v2_escaped} 对 {grounded-labelling-pipeline.r3_reg_v3_escaped}。假如照样放量，灰度的回滚规则一条也不会触发，是采用标准拦下的。", en = "On another set of newly written ads (adoption rules and predictions preregistered), clear ads sent to people fell from {grounded-labelling-pipeline.r3_v2_clear} to {grounded-labelling-pipeline.r3_v3_clear}; but ads written as needing a human were also sent to people less often, {grounded-labelling-pipeline.r3_v2_handoff} to {grounded-labelling-pipeline.r3_v3_handoff}, past the limit set beforehand, so it was not adopted and production stays on v2. In the round-one regression, wrong decisions that went live were {grounded-labelling-pipeline.r3_reg_v2_escaped} against {grounded-labelling-pipeline.r3_reg_v3_escaped}. Had it been rolled out, no canary rollback rule would have fired; the adoption standard stopped it." }
source = "https://github.com/llia0031-dotcom/grounded-labelling-pipeline/blob/main/reports/compare-v2-v3-round3.md"
compare_set = { zh = "第三轮：另外新写 120 条文字广告各 2 遍；回归：第一轮 166 条题各回放 2 遍", en = "Round three: another 120 newly written text ads, 2 runs each; regression: the 166 round-one items, 2 replays each" }
scores = [
  { label = { zh = "答案清楚的广告送了人工（v2 → v3）", en = "Clear ads sent to human review (v2 → v3)" }, refs = ["grounded-labelling-pipeline.r3_v2_clear", "grounded-labelling-pipeline.r3_v3_clear"], direction = "lower" },
  { label = { zh = "要人来定的广告送了人工（v2 → v3）", en = "Ads that need a human, sent to people (v2 → v3)" }, refs = ["grounded-labelling-pipeline.r3_v2_handoff", "grounded-labelling-pipeline.r3_v3_handoff"], direction = "higher" },
  { label = { zh = "回归：判错又自动生效（v2 → v3）", en = "Regression: wrong decisions that went live (v2 → v3)" }, refs = ["grounded-labelling-pipeline.r3_reg_v2_escaped", "grounded-labelling-pipeline.r3_reg_v3_escaped"], direction = "lower" },
  { label = { zh = "回归：送人工复核（v2 → v3）", en = "Regression: sent to human review (v2 → v3)" }, pair = [
    { id = "reg_v2_queued", extractor = "pl_version", args = { path = "evidence-pipeline-public/data/versions-v3.json", version = "v2", field = "queued" } },
    { id = "reg_v3_queued", extractor = "pl_version", args = { path = "evidence-pipeline-public/data/versions-v3.json", version = "v3", field = "queued" } },
  ], direction = "none" },
]

[[version]]
id = "v4"
date = "2026-11-17"
decision = "not_adopted"
text = { zh = "v3 的“拿不准”规则加一类：结论取决于把一句话放进还是放出某条规则、而这句话正好在边界上（`triage.CERTAINTY_RULE_V4`）；输出格式不变", en = "v3's rule on when to be unsure plus one case: the decision turns on placing the ad's words inside or outside a rule and the words sit on the boundary (`triage.CERTAINTY_RULE_V4`); the output format is unchanged" }
change = { zh = "想两头都过：答案清楚的广告少送人工，该交人工的不少送。写明几类常见边界，并加一句自查：另一种读法也说得通就答拿不准。", en = "Meant to pass at both ends: fewer clear ads sent to people, and no fewer of those that need one. It names common boundary cases and adds a self-check: if another reading also holds, answer unsure." }
why = { zh = "在又一批新写的广告上（采用标准和第三轮一字不改，预测跑前冻结），两头都比 v2 好：答案清楚的广告送人工 {grounded-labelling-pipeline.r4_v2_clear} → {grounded-labelling-pipeline.r4_v4_clear}，要人来定的送人工 {grounded-labelling-pipeline.r4_v2_handoff} → {grounded-labelling-pipeline.r4_v4_handoff}。但它判错时更常说“确定”：答案清楚的广告判错又自动生效 {grounded-labelling-pipeline.r4_v2_clear_escaped} → {grounded-labelling-pipeline.r4_v4_clear_escaped}（同一条陷阱题两遍，答案有争议，按预注册没改），第一轮回归漏网 {grounded-labelling-pipeline.r4_reg_v2_escaped} → {grounded-labelling-pipeline.r4_reg_v4_escaped}。不采用，production 留在 v2；假如照样放量，灰度的回滚规则一条也不会触发。", en = "On another set of newly written ads (adoption rules word for word those of round three, predictions frozen before the run), it beat v2 at both ends: clear ads sent to people {grounded-labelling-pipeline.r4_v2_clear} → {grounded-labelling-pipeline.r4_v4_clear}, ads that need a human sent to people {grounded-labelling-pipeline.r4_v2_handoff} → {grounded-labelling-pipeline.r4_v4_handoff}. But it was more often sure when wrong: clear ads decided wrongly and gone live {grounded-labelling-pipeline.r4_v2_clear_escaped} → {grounded-labelling-pipeline.r4_v4_clear_escaped} (both runs of one trap item whose answer is debatable and, as preregistered, unchanged), and round-one regression escapes {grounded-labelling-pipeline.r4_reg_v2_escaped} → {grounded-labelling-pipeline.r4_reg_v4_escaped}. Not adopted; production stays on v2. Had it been rolled out, no canary rollback rule would have fired." }
source = "https://github.com/llia0031-dotcom/grounded-labelling-pipeline/blob/main/reports/compare-v2-v4-round4.md"
compare_set = { zh = "第四轮：又一批新写的 120 条文字广告各 2 遍；回归：第一轮 166 条题各回放 2 遍", en = "Round four: another 120 newly written text ads, 2 runs each; regression: the 166 round-one items, 2 replays each" }
scores = [
  { label = { zh = "答案清楚的广告送了人工（v2 → v4）", en = "Clear ads sent to human review (v2 → v4)" }, refs = ["grounded-labelling-pipeline.r4_v2_clear", "grounded-labelling-pipeline.r4_v4_clear"], direction = "lower" },
  { label = { zh = "要人来定的广告送了人工（v2 → v4）", en = "Ads that need a human, sent to people (v2 → v4)" }, refs = ["grounded-labelling-pipeline.r4_v2_handoff", "grounded-labelling-pipeline.r4_v4_handoff"], direction = "higher" },
  { label = { zh = "答案清楚的广告判错又自动生效（v2 → v4）", en = "Clear ads decided wrongly and gone live (v2 → v4)" }, refs = ["grounded-labelling-pipeline.r4_v2_clear_escaped", "grounded-labelling-pipeline.r4_v4_clear_escaped"], direction = "lower" },
  { label = { zh = "回归：判错又自动生效（v2 → v4）", en = "Regression: wrong decisions that went live (v2 → v4)" }, refs = ["grounded-labelling-pipeline.r4_reg_v2_escaped", "grounded-labelling-pipeline.r4_reg_v4_escaped"], direction = "lower" },
]
